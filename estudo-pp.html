function mmss(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}

/* ---------------------------------------------------------------------
   Embaralhamento das alternativas.
   As questões foram escritas com a alternativa correta sempre em primeiro
   lugar. Se fossem exibidas nessa ordem, daria para acertar tudo sem ler —
   e o app estaria treinando o reflexo errado. Portanto a ordem é sorteada
   a cada apresentação, e fica ESTÁVEL dentro da sessão (senão, navegar para
   trás no simulado moveria a alternativa já marcada).
   Cada item guarda o índice ORIGINAL, para o registro no banco continuar
   significando a mesma coisa ao longo do tempo.
   ------------------------------------------------------------------- */
function embaralharAlts(q){
  const arr = q.alts.map((a,i)=>({a, i}));
  for(let k=arr.length-1;k>0;k--){
    const j = Math.floor(Math.random()*(k+1));
    [arr[k],arr[j]] = [arr[j],arr[k]];
  }
  return arr;
}
function ordemDe(q){
  if(!sessao) return embaralharAlts(q);
  if(!sessao.ordem) sessao.ordem = {};
  if(!sessao.ordem[q.id]) sessao.ordem[q.id] = embaralharAlts(q);
  return sessao.ordem[q.id];
}

/* =====================================================================
   4. MOTOR DE COBERTURA — o "potinho"
   ---------------------------------------------------------------------
   Regra, em português:
     · cada OBJETIVO do Apêndice D presente neste banco é uma célula;
     · a célula enche com 3 acertos, em DIAS DIFERENTES (acertar duas vezes
       no mesmo dia é memória curta, não aprendizado);
     · errar depois de já ter acertado devolve um crédito;
     · a cobertura DECAI: a cada 21 dias sem tocar naquele objetivo, perde-se
       1 crédito. Sem isso o potinho encheria e mentiria.
   ===================================================================== */
function estadoObjetivos(ate){
  const ref = ate || hoje();
  const porObj = {};
  BANCO.forEach(q => {
    if(!porObj[q.obj]) porObj[q.obj] = {obj:q.obj, m:q.m, dias:new Set(), errosPos:0, ultima:null, n:0, acertos:0};
  });
  const ord = respostas.filter(r => r.dia <= ref)
    .sort((a,b)=> (a.dia+a.hora_ord).localeCompare(b.dia+b.hora_ord));
  ord.forEach(r => {
    const o = porObj[r.objetivo];
    if(!o) return;                       // objetivo que saiu do banco
    o.n++;
    if(r.correta){ o.acertos++; o.dias.add(r.dia); o.errosPos = 0; }
    else { if(o.dias.size) o.errosPos++; }
    o.ultima = r.dia;
  });
  const h = ref;
  Object.values(porObj).forEach(o => {
    const base = Math.min(CRED_MAX, o.dias.size) - Math.min(CRED_MAX, o.errosPos);
    const semRever = o.ultima ? diasEntre(o.ultima, h) : 0;
    o.decai = o.ultima ? Math.floor(semRever/DECAI_DIAS) : 0;
    o.diasSemRever = semRever;
    o.cred = Math.max(0, Math.min(CRED_MAX, base - o.decai));
    o.credSemDecai = Math.max(0, Math.min(CRED_MAX, base));
  });
  return porObj;
}

/* Acerto recente por matéria: últimas JANELA_RESP respostas dentro de JANELA_DIAS */
function acertoRecente(mid){
  const h = hoje();
  const rs = respostas
    .filter(r => r.materia === mid && diasEntre(r.dia, h) <= JANELA_DIAS)
    .sort((a,b)=> (b.dia+b.hora_ord).localeCompare(a.dia+a.hora_ord))
    .slice(0, JANELA_RESP);
  if(!rs.length) return {taxa:null, n:0};
  return {taxa: rs.filter(r=>r.correta).length / rs.length, n: rs.length};
}

/* Último simulado: desempenho por matéria */
function ultimoSimulado(){
  const s = sessoes.filter(x=>x.modo==='simulado').sort((a,b)=>(b.dia+b.criado_local).localeCompare(a.dia+a.criado_local));
  return s[0] || null;
}

/* Prontidão por matéria — QUATRO estados, nunca uma média geral */
function prontidao(){
  const po = estadoObjetivos();
  const sim = ultimoSimulado();
  return MATERIAS.map(m => {
    const objs = OBJS[m.id].map(o => po[o]);
    const cred = objs.reduce((s,o)=>s+o.cred, 0);
    const cob  = objs.length ? cred / (objs.length * CRED_MAX) : 0;
    const ar   = acertoRecente(m.id);
    const simM = sim && sim.por_materia ? sim.por_materia[m.id] : null;
    const simOk = !!(simM && simM.acertos/simM.total >= NOTA_CORTE);

    let estado, luz, rotulo;
    if(cob >= GATE_COB && ar.taxa !== null && ar.taxa >= GATE_ACC && ar.n >= GATE_AMOSTRA){
      if(simOk){ estado=3; luz='v'; rotulo='VALIDADA'; }
      else     { estado=2; luz='c'; rotulo='PRONTA P/ VALIDAR'; }
    } else if(cob >= 0.60){ estado=1; luz='a'; rotulo='CONSOLIDANDO'; }
    else { estado=0; luz='r'; rotulo='EM CONSTRUÇÃO'; }

    // o que exatamente falta
    const faltaCred = objs.reduce((s,o)=> s + (CRED_MAX - o.cred), 0);
    const objsIncompletos = objs.filter(o=>o.cred < CRED_MAX).length;
    const falta = [];
    if(cob < GATE_COB) falta.push(objsIncompletos + ' objetivo(s) por completar (cobertura ' + pct(cob) + '%, precisa ' + pct(GATE_COB) + '%)');
    if(ar.n < GATE_AMOSTRA) falta.push('amostra pequena: ' + ar.n + ' de ' + GATE_AMOSTRA + ' respostas recentes');
    else if(ar.taxa < GATE_ACC) falta.push('acerto recente ' + pct(ar.taxa) + '%, precisa ' + pct(GATE_ACC) + '%');
    if(estado === 2) falta.push('falta confirmar em simulado completo (≥ ' + pct(NOTA_CORTE) + '% nesta matéria)');

    return {...m, objs, cob, cred, faltaCred, objsIncompletos, ar, simM, simOk, estado, luz, rotulo, falta};
  });
}

/* Previsão de prontidão — estimativa honesta, atualizada pelo desempenho real */
function previsao(pr){
  const h = hoje();
  // ritmo: questões por dia nos últimos 14 dias em que houve atividade
  const recentes = respostas.filter(r => diasEntre(r.dia,h) <= 14);
  const diasAtivos = new Set(recentes.map(r=>r.dia)).size;
  const ritmo = diasAtivos ? recentes.length / diasAtivos : META_DIA;
  const taxa = recentes.length ? recentes.filter(r=>r.correta).length/recentes.length : 0.70;

  // créditos que faltam para levar todas as matérias ao portão de cobertura
  let faltamCred = 0, credAtual = 0, credAlvo = 0, nObjs = 0;
  pr.forEach(m => {
    const alvo = Math.ceil(GATE_COB * m.objs.length * CRED_MAX);
    credAtual += m.cred; credAlvo += alvo; nObjs += m.objs.length;
    faltamCred += Math.max(0, alvo - m.cred);
  });

  // Custo de MANUTENÇÃO. O decaimento é por OBJETIVO, não por crédito: um
  // único acerto zera o contador de dias sem revisar daquele objetivo e
  // preserva os três créditos. Logo, manter o potinho cheio custa um acerto
  // por objetivo a cada DECAI_DIAS — e não três.
  const ganhoDia    = ritmo * taxa;                    // acertos por dia
  const perdaAlvo   = (GATE_COB * nObjs) / DECAI_DIAS; // acertos/dia só para manter
  const perdaHoje   = credAtual ? (nObjs / DECAI_DIAS) : 0;
  // ritmo mínimo, em questões/dia, só para manter o alvo depois de atingido
  const manutencao  = Math.ceil(perdaAlvo / Math.max(taxa, 0.4));
  const sustenta    = ganhoDia >= perdaAlvo;

  const base = {ritmo, taxa, ganhoDia, perdaHoje, perdaAlvo, manutencao, sustenta, faltamCred};
  if(faltamCred <= 0) return {...base, pronto:true};

  // VELOCIDADE MEDIDA, não teórica: quanto a cobertura de fato cresceu nos
  // últimos 14 dias. Captura sozinha o efeito do espaçamento, do decaimento e
  // do seu acerto real — que é o que o modelo teórico subestima no fim do
  // percurso, quando os objetivos que faltam são justamente os mais espaçados.
  const dHist = [...new Set(respostas.map(r=>r.dia))].length;
  const JANELA_VEL = 21;   // janela larga: 14 dias oscilava demais e dava alarme falso
  const teorica = Math.max(0, ganhoDia - perdaAlvo) * 0.7;   // projeção conservadora
  let velocidade = null, fonte = 'estimada';
  if(dHist >= 10){
    const credAntes = Object.values(estadoObjetivos(somaDias(h,-JANELA_VEL)))
      .reduce((s,o)=>s+o.cred, 0);
    velocidade = (credAtual - credAntes) / JANELA_VEL;
    fonte = 'medida';
  }
  if(velocidade === null) velocidade = teorica;

  // "Estagnado" é afirmação forte: só se a medição E a teoria concordarem.
  // Se a medição caiu mas o ritmo, em tese, dá conta, é oscilação — usa-se a
  // projeção teórica em vez de alarmar à toa.
  if(velocidade <= 0.2){
    if(!sustenta || teorica <= 0.2) return {...base, pronto:false, estagnado:true, fonte};
    velocidade = teorica; fonte = 'estimada';
  }

  // FAIXA, não data única. A cobertura cresce rápido no começo (os primeiros
  // créditos são fáceis) e desacelera no fim (sobram os objetivos mais espaçados
  // e os que você erra). Uma data única seria falsa precisão — e, no começo do
  // percurso, otimista. O app comunica a data TARDIA como referência.
  const dCedo  = Math.max(CRED_MAX, Math.ceil(faltamCred / velocidade));
  const dTarde = Math.max(dCedo + 2, Math.ceil(faltamCred / (velocidade * 0.6)));
  return {...base, pronto:false, estagnado:false, velocidade, fonte,
          dias: dTarde, diasCedo: dCedo,
          data: somaDias(h, dTarde), dataCedo: somaDias(h, dCedo)};
}

/* Sequência de dias praticados */
function streakDias(){
  const dias = [...new Set(respostas.map(r=>r.dia))].sort().reverse();
  if(!dias.length) return 0;
  const h = hoje();
  // a sequência continua válida se o último dia é hoje ou ontem
  if(diasEntre(dias[0], h) > 1) return 0;
  let n = 1;
  for(let i=1;i<dias.length;i++){
    if(diasEntre(dias[i], dias[i-1]) === 1) n++; else break;
  }
  return n;
}

/* =====================================================================
   5. REPETIÇÃO ESPAÇADA — seleção da sessão diária
   Caixas de Leitner por QUESTÃO: 0,1,3,7,16,35 dias.
   Errar devolve à caixa 0 (revisar hoje).
   ===================================================================== */
function estadoQuestoes(){
  const porQ = {};
  BANCO.forEach(q => porQ[q.id] = {q, n:0, streak:0, ultima:null, ultimoErro:null});
  respostas.slice().sort((a,b)=>(a.dia+a.hora_ord).localeCompare(b.dia+b.hora_ord)).forEach(r=>{
    const e = porQ[r.questao_id]; if(!e) return;
    e.n++; e.ultima = r.dia;
    if(r.correta) e.streak++;
    else { e.streak = 0; e.ultimoErro = r.dia; }
  });
  const h = hoje();
  Object.values(porQ).forEach(e=>{
    if(!e.n){ e.nova = true; e.atraso = 0; return; }
    const inter = LEITNER[Math.min(e.streak, LEITNER.length-1)];
    const prox = somaDias(e.ultima, inter);
    e.atraso = diasEntre(prox, h);      // >= 0 significa devida
    e.devida = e.atraso >= 0;
  });
  return porQ;
}

function montarSessaoDiaria(){
  const porQ = estadoQuestoes();
  const pr = prontidao();
  const prioMat = {}; pr.forEach(m => prioMat[m.id] = m.cob);   // menor cobertura = maior prioridade

  const todas = Object.values(porQ);
  const devidas = todas.filter(e => e.devida)
    .sort((a,b)=>{
      const ea = a.ultimoErro ? 1:0, eb = b.ultimoErro ? 1:0;
      if(eb !== ea) return eb - ea;                 // erradas antes
      if(b.atraso !== a.atraso) return b.atraso - a.atraso;  // mais atrasadas antes
      return prioMat[a.q.m] - prioMat[b.q.m];       // matéria mais atrasada antes
    });
  const novas = todas.filter(e => e.nova)
    .sort((a,b)=> (prioMat[a.q.m] - prioMat[b.q.m]) || (Math.random()-0.5));

  const MAX_NOVAS = 6;
  const sel = [];
  const usarNovas = Math.min(MAX_NOVAS, novas.length, Math.max(0, META_DIA - Math.min(devidas.length, META_DIA - Math.min(MAX_NOVAS, novas.length))));
  // primeiro as devidas, depois completa com novas até a meta
  for(const e of devidas){ if(sel.length >= META_DIA - Math.min(MAX_NOVAS, novas.length)) break; sel.push(e.q); }
  for(const e of novas){ if(sel.length >= META_DIA) break; sel.push(e.q); }
  for(const e of devidas){ if(sel.length >= META_DIA) break; if(!sel.includes(e.q)) sel.push(e.q); }
  // se ainda faltar, revisa as mais antigas mesmo não vencidas
  if(sel.length < META_DIA){
    const resto = todas.filter(e=>!e.nova && !sel.includes(e.q)).sort((a,b)=>b.atraso-a.atraso);
    for(const e of resto){ if(sel.length >= META_DIA) break; sel.push(e.q); }
  }
  // embaralha para não ficar agrupado por matéria
  for(let i=sel.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [sel[i],sel[j]]=[sel[j],sel[i]]; }
  return sel;
}

/* =====================================================================
   6. REGISTRO DE RESPOSTA (grava no aparelho primeiro, nuvem depois)
   ===================================================================== */
function registrarResposta(q, escolha, modo, sessaoId, ms){
  const alt = q.alts[escolha];
  const r = {
    questao_id: q.id, materia: q.m, objetivo: q.obj, dificuldade: q.dif,
    correta: !!(alt && alt.ok), escolha: escolha, modo: modo,
    sessao: sessaoId, ms: Math.round(ms||0),
    dia: hoje(), hora_ord: new Date().toISOString().slice(11,23)
  };
  respostas.push({...r, _sync:false});
  LS.gravar('pp_respostas', respostas);
  return r;
}
function registrarSessao(s){
  sessoes.push({...s, _sync:false, criado_local:new Date().toISOString()});
  LS.gravar('pp_sessoes', sessoes);
}

async function sincronizar(){
  const pr = respostas.filter(r=>!r._sync);
  const ps = sessoes.filter(s=>!s._sync);
  if(!pr.length && !ps.length) return 0;
  const limpa = o => { const c={...o}; delete c._sync; delete c.criado_local; return c; };
  try{
    if(pr.length) await nuvemGravar(T_RESP, pr.map(limpa));
    pr.forEach(r=>r._sync=true);
    if(ps.length) await nuvemGravar(T_SESS, ps.map(limpa));
    ps.forEach(s=>s._sync=true);
    LS.gravar('pp_respostas', respostas); LS.gravar('pp_sessoes', sessoes);
    marcarNuvem(true);
    return pr.length + ps.length;
  }catch(e){ marcarNuvem(false); return 0; }
}

/* Traz do banco o que foi respondido em OUTRO aparelho */
async function puxarDaNuvem(){
  try{
    const [rs, ss] = await Promise.all([
      nuvemLer(T_RESP, 'dia.asc,hora_ord.asc'),
      nuvemLer(T_SESS, 'dia.asc')
    ]);
    const chave = r => r.questao_id + '|' + r.dia + '|' + r.hora_ord;
    const tenho = new Set(respostas.map(chave));
    let novas = 0;
    rs.forEach(r => { if(!tenho.has(chave(r))){ respostas.push({...r, _sync:true}); novas++; } });
    const ks = s => s.modo + '|' + s.dia + '|' + s.total + '|' + s.acertos;
    const tenhoS = new Set(sessoes.map(ks));
    ss.forEach(s => { if(!tenhoS.has(ks(s))) sessoes.push({...s, _sync:true}); });
    if(novas){ LS.gravar('pp_respostas', respostas); LS.gravar('pp_sessoes', sessoes); }
    marcarNuvem(true);
    return novas;
  }catch(e){ marcarNuvem(false); return 0; }
}

function marcarNuvem(ok){
  nuvemOk = ok;
  const n = $('nuvem');
  n.className = 'nuvem ' + (ok ? 'ok' : 'off');
  $('nuvem-txt').textContent = ok ? 'banco ok' : 'offline';
}

function desenharDiario(){

  const st = streakDias();

  const totalObjs = pr.reduce((s,m)=>s+m.objs.length,0);
  const credTotal = pr.reduce((s,m)=>s+m.cred,0);
  const cobGeral = credTotal / (totalObjs*CRED_MAX);

      fica parado ou recua. Aumente a <b>frequência</b> das sessões — não precisa aumentar a duração.</div>`;

      mais tardia: a cobertura cresce rápido no começo e desacelera no fim, quando sobram os objetivos

function iniciarSessaoDiaria(){
  const qs = montarSessaoDiaria();
  if(!qs.length){ toast('Banco vazio.'); return; }
  sessao = {modo:'diario', id:uid(), qs, i:0, respondidas:[], t0:Date.now(), tq:Date.now(), escolha:null, revelado:false};
  desenharSessaoDiaria();
  tickDiario();
}

let timerDiario = null;
function tickDiario(){
  clearInterval(timerDiario);
  timerDiario = setInterval(()=>{
    if(!sessao || sessao.modo!=='diario'){ clearInterval(timerDiario); return; }
    const el = $('rel-diario'); if(!el) return;
    const resta = SEG_DIA - (Date.now()-sessao.t0)/1000;
    el.textContent = mmss(Math.abs(resta)) + (resta<0 ? ' +' : '');
    el.className = 'rel' + (resta < 60 ? ' urg' : '');
  }, 1000);
}

function desenharSessaoDiaria(){
  const s = sessao;
  if(s.i >= s.qs.length){ encerrarSessaoDiaria(); return; }
  const q = s.qs[s.i];
  const m = MAT[q.m];
  const ord = ordemDe(q);

  $('tela-diario').innerHTML = `

function revelar(escolha){
  const s = sessao, q = s.qs[s.i];
  const ord = ordemDe(q);
  s.revelado = true;
  const ms = Date.now() - s.tq;
  const r = registrarResposta(q, escolha, 'diario', s.id, ms);
  s.respondidas.push(r);

  document.querySelectorAll('#alts .alt').forEach((b,pos)=>{
    const a = ord[pos].a;
    b.classList.add(a.ok ? 'ok' : (ord[pos].i===escolha ? 'mau' : 'pale'));
    const p = document.createElement('div');
    p.className = 'pq';
    p.innerHTML = esc(a.pq);
    b.appendChild(p);
  });

  const ok = q.alts[escolha].ok;
  $('pos').innerHTML = `

function encerrarSessaoDiaria(){
  const s = sessao;
  clearInterval(timerDiario);
  const dur = Math.round((Date.now()-s.t0)/1000);
  const acertos = s.respondidas.filter(r=>r.correta).length;
  const porMat = {};
  s.respondidas.forEach(r=>{ (porMat[r.materia] = porMat[r.materia] || {total:0,acertos:0}); porMat[r.materia].total++; if(r.correta) porMat[r.materia].acertos++; });

  registrarSessao({modo:'diario', dia:hoje(), total:s.respondidas.length, acertos,
    duracao_s:dur, por_materia:porMat, resultado:null, aprovado:null});

  sessao = null;
  const pr = prontidao();
  const cred = pr.reduce((a,m)=>a+m.cred,0), tot = pr.reduce((a,m)=>a+m.objs.length,0)*CRED_MAX;

  $('tela-diario').innerHTML = `

      <div class="resumo">
        <div><b>${acertos}/${s.respondidas.length}</b><span>ACERTOS</span></div>

  $('btn-voltar').onclick = desenharDiario;
  atualizarTopo();
  sincronizar().then(n => { if(n) toast(n + ' registro(s) enviados ao banco.'); });

function sortear(mid, n){
  const pool = BANCO.filter(q=>q.m===mid).slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0, Math.min(n, pool.length));
}

        const cor = s.resultado==='APR' ? 'bom' : (s.resultado==='2EP' ? 'med' : 'mau');
        return `<div class="lin"><div class="lb">${d}<div class="sub" style="font-size:11px">
          ${MATERIAS.map(m=>{const x=s.por_materia&&s.por_materia[m.id]; return x? m.id+' '+x.acertos+'/'+x.total : '';}).filter(Boolean).join(' · ')}
        </div></div><div class="vl ${cor}">${esc(s.resultado||'—')}</div></div>`;
      }).join('')}
    </div>` : ''}`;

  $('btn-sim').onclick = iniciarSimulado;
}

function iniciarSimulado(){
  const blocos = MATERIAS.map(m => ({mid:m.id, qs:sortear(m.id, QPORMAT), seg:m.min*60}));
  if(blocos.every(b=>!b.qs.length)){ toast('Banco vazio.'); return; }
  sessao = {modo:'simulado', id:uid(), blocos, b:0, i:0, respostas:{}, t0:Date.now(), tb:Date.now()};
  desenharBlocoSimulado();
  tickSimulado();
}

let timerSim = null;
function tickSimulado(){
  clearInterval(timerSim);
  timerSim = setInterval(()=>{
    if(!sessao || sessao.modo!=='simulado'){ clearInterval(timerSim); return; }
    const bl = sessao.blocos[sessao.b];
    const resta = bl.seg - (Date.now()-sessao.tb)/1000;
    const el = $('rel-sim');
    if(el){ el.textContent = mmss(resta); el.className = 'rel' + (resta < 180 ? ' urg':''); }
    if(resta <= 0) proximoBloco(true);
  }, 1000);
}

function desenharBlocoSimulado(){
  const s = sessao, bl = s.blocos[s.b];
  if(s.i >= bl.qs.length){ proximoBloco(false); return; }
  const q = bl.qs[s.i], m = MAT[bl.mid];
  const marcada = s.respostas[q.id];
  const ord = ordemDe(q);

  $('tela-simulado').innerHTML = `
    <div class="card">
      <div class="qcab">
        <span class="tag mat" style="color:${m.cor};border-color:${m.cor}44">BLOCO ${s.b+1}/5 · ${esc(bl.mid)}</span>
        <div class="prog"><div style="width:${(s.i/bl.qs.length*100)}%"></div></div>
        <span class="rel" id="rel-sim">${mmss(bl.seg - (Date.now()-s.tb)/1000)}</span>
      </div>
      <div class="sub" style="font-size:11px;margin-bottom:8px">Questão ${s.i+1} de ${bl.qs.length} deste bloco</div>
      <div class="enun">${esc(q.p)}</div>
      <div id="alts">
        ${ord.map((o,pos)=>`<button class="alt ${marcada===o.i?'sel':''}" data-i="${o.i}"><span class="ltr">${'ABCD'[pos]}</span>${esc(o.a.t)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btn-ant" ${s.i===0?'disabled':''} style="flex:1">◂ Anterior</button>
        <button class="btn pri" id="btn-prx" style="flex:2">${s.i+1>=bl.qs.length ? 'Encerrar bloco ▸':'Próxima ▸'}</button>
      </div>
      <button class="btn" id="btn-abortar" style="opacity:.6">Abandonar simulado</button>
    </div>`;

  document.querySelectorAll('#alts .alt').forEach(b=>{
    b.onclick = () => {
      s.respostas[q.id] = parseInt(b.dataset.i,10);
      document.querySelectorAll('#alts .alt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    };
  });
  $('btn-ant').onclick = () => { if(s.i>0){ s.i--; desenharBlocoSimulado(); window.scrollTo(0,0);} };
  $('btn-prx').onclick = () => { s.i++; desenharBlocoSimulado(); window.scrollTo(0,0); };
  $('btn-abortar').onclick = () => {
    if(confirm('Abandonar o simulado? Nada será registrado.')){ clearInterval(timerSim); sessao=null; desenharSimulado(); }
  };
}

function proximoBloco(porTempo){
  const s = sessao;
  if(porTempo) toast('Tempo do bloco encerrado.', 2500);
  s.b++; s.i = 0; s.tb = Date.now();
  if(s.b >= s.blocos.length){ corrigirSimulado(); return; }
  desenharBlocoSimulado();
  window.scrollTo(0,0);
}

function corrigirSimulado(){
  const s = sessao;
  clearInterval(timerSim);
  const dur = Math.round((Date.now()-s.t0)/1000);
  const porMat = {};
  let acertosTot = 0, totalTot = 0;

  s.blocos.forEach(bl=>{
    let ac = 0;
    bl.qs.forEach(q=>{
      const e = s.respostas[q.id];
      const ok = (e !== undefined) && q.alts[e].ok;
      if(ok) ac++;
      registrarResposta(q, (e!==undefined? e : -1), 'simulado', s.id, 0);
    });
    porMat[bl.mid] = {total:bl.qs.length, acertos:ac, pct: bl.qs.length ? ac/bl.qs.length : 0};
    acertosTot += ac; totalTot += bl.qs.length;
  });

  // REGRA REAL DA ANAC (IS 00-003H): 70% em CADA prova, sem média.
  const reprovadas = MATERIAS.filter(m => porMat[m.id] && porMat[m.id].pct < NOTA_CORTE);
  const todasAcimaDoPiso = reprovadas.every(m => porMat[m.id].pct >= PISO_2EP);
  let resultado, texto;
  if(reprovadas.length === 0){
    resultado = 'APR';
    texto = 'APROVADO. Você atingiu ' + pct(NOTA_CORTE) + '% ou mais em todas as cinco matérias.';
  } else if(reprovadas.length <= MAX_2EP && todasAcimaDoPiso){
    resultado = '2EP';
    texto = 'SEGUNDA ÉPOCA. Ficou abaixo de ' + pct(NOTA_CORTE) + '% em ' + reprovadas.length +
      ' matéria(s), mas em todas elas atingiu ao menos ' + pct(PISO_2EP) + '%. Na prova real você repetiria ' +
      'apenas essa(s) matéria(s), uma única vez, com inscrição em até 90 dias.';
  } else {
    resultado = 'REP';
    texto = 'REPROVADO. ' + (reprovadas.length > MAX_2EP
      ? 'Foram ' + reprovadas.length + ' matérias abaixo do corte — acima do limite de ' + MAX_2EP + ' para segunda época.'
      : 'Alguma matéria ficou abaixo do piso de ' + pct(PISO_2EP) + '%, o que elimina o direito à segunda época.')
      + ' Na prova real, o exame completo teria de ser refeito.';
  }

  registrarSessao({modo:'simulado', dia:hoje(), total:totalTot, acertos:acertosTot,
    duracao_s:dur, por_materia:porMat, resultado, aprovado: resultado==='APR'});
  sessao = null;

  $('tela-simulado').innerHTML = `
    <div class="card">
      <div class="rot">RESULTADO — REGRA REAL DA ANAC</div>
      <div class="veredito ${resultado==='APR'?'ok':'mau'}" style="font-size:15px">${resultado}</div>
      <div class="sub">${esc(texto)}</div>
      <div class="resumo">
        <div><b>${acertosTot}/${totalTot}</b><span>TOTAL</span></div>
        <div><b>${pct(acertosTot/totalTot)}%</b><span>GERAL</span></div>
        <div><b>${mmss(dur)}</b><span>DURAÇÃO</span></div>
      </div>
      <div class="perigo"><b>O total geral não vale nada para aprovação.</b> A ANAC avalia cada
      matéria isoladamente — ${pct(NOTA_CORTE)}% em cada uma, sem média. É por isso que a linha
      que importa é a tabela abaixo, e não o percentual geral acima.</div>
    </div>

    <div class="card">
      <div class="rot">POR MATÉRIA — CORTE EM ${Math.ceil(NOTA_CORTE*QPORMAT)}/${QPORMAT}</div>
      ${MATERIAS.map(m=>{
        const x = porMat[m.id]; if(!x) return '';
        const passou = x.pct >= NOTA_CORTE;
        const cls = passou ? 'bom' : (x.pct >= PISO_2EP ? 'med' : 'mau');
        return `<div class="lin">
          <div class="lb"><b style="color:${m.cor}">${esc(m.id)}</b> ${esc(m.nome)}
            <div class="mini"><div style="width:${pct(x.pct)}%;background:${passou?'var(--verde)':'var(--vermelho)'}"></div></div>
          </div>
          <div class="vl ${cls}">${x.acertos}/${x.total}<br><span style="font-size:10px">${passou?'PASSOU':'ABAIXO'}</span></div>
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <button class="btn pri" id="btn-voltar-sim">Voltar</button>
      <button class="btn" id="btn-ver-desemp">Ver o que estudar (Desempenho)</button>
    </div>`;

  $('btn-voltar-sim').onclick = desenharSimulado;
  $('btn-ver-desemp').onclick = () => document.querySelector('.abas button[data-t="desempenho"]').click();
  atualizarTopo();
  sincronizar();
}

/* =====================================================================
   10. TELA — DESEMPENHO
   ===================================================================== */
function desenharDesempenho(){
  const pr = prontidao();
  const po = estadoObjetivos();
  const prev = previsao(pr);
  const total = respostas.length;
  const acertos = respostas.filter(r=>r.correta).length;
  const sims = sessoes.filter(s=>s.modo==='simulado');

  if(!total){
    $('tela-desempenho').innerHTML = `<div class="vazio">Nenhuma resposta registrada ainda.<br><br>
      Faça uma sessão na aba DIÁRIO. A partir da primeira sessão esta tela mostra
      acerto por matéria, acerto por objetivo do Apêndice D e o que está pendente.</div>`;
    return;
  }

  // últimos 14 dias
  const dias = [];
  for(let i=13;i>=0;i--){
    const d = somaDias(hoje(), -i);
    const rs = respostas.filter(r=>r.dia===d);
    dias.push({d, n:rs.length, ac: rs.length ? rs.filter(r=>r.correta).length/rs.length : null});
  }

  // objetivos por desempenho
  const objsArr = Object.values(po).filter(o=>o.n>0);
  const nuncaAcertou = objsArr.filter(o=>o.acertos===0);
  const fracos = objsArr.filter(o=>o.acertos>0).sort((a,b)=> (a.acertos/a.n) - (b.acertos/b.n)).slice(0,12);
  const naoVistos = Object.values(po).filter(o=>o.n===0);

  $('tela-desempenho').innerHTML = `
    <div class="card">
      <div class="rot">VISÃO GERAL</div>
      <div class="resumo">
        <div><b>${streakDias()}</b><span>DIAS SEGUIDOS</span></div>
        <div><b>${total}</b><span>RESPOSTAS</span></div>
        <div><b>${pct(acertos/total)}%</b><span>ACERTO GERAL</span></div>
      </div>
      <div class="resumo">
        <div><b>${sims.length}</b><span>SIMULADOS</span></div>
        <div><b>${pr.filter(m=>m.estado>=2).length}/5</b><span>NO PORTÃO</span></div>
        <div><b>${pr.filter(m=>m.estado===3).length}/5</b><span>VALIDADAS</span></div>
      </div>
      ${prev.pronto ? '<div class="nota-fonte">Cobertura no alvo nas cinco matérias.</div>'
        : prev.estagnado ? `<div class="aviso-box">No ritmo atual a cobertura não avança:
            ganho ~${prev.ganhoDia.toFixed(1)}/dia contra perda ~${prev.perdaAlvo.toFixed(1)}/dia por decaimento perto do alvo.</div>`
        : `<div class="nota-fonte">Previsão de prontidão: <b>${new Date(prev.data+'T00:00:00').toLocaleDateString('pt-BR')}</b>
            (~${prev.dias} dias no ritmo de ${prev.ritmo.toFixed(0)} questões/dia com ${pct(prev.taxa)}% de acerto).</div>`}
      ${!prev.sustenta ? `<div class="aviso-box">Ritmo de manutenção: manter o potinho cheio pede cerca de
        <b>${prev.manutencao} questões/dia</b> no seu acerto atual. Você está em ${prev.ritmo.toFixed(0)}/dia.</div>` : ''}
    </div>

    <div class="card">
      <div class="rot">EVOLUÇÃO — ÚLTIMOS 14 DIAS</div>
      <div class="barras">
        ${dias.map(d=>`<i class="${d.ac!==null && d.ac<NOTA_CORTE?'mau':''}"
          style="height:${d.ac===null?3:Math.max(6,d.ac*100)}%;opacity:${d.n?0.9:0.25}"
          title="${d.d} — ${d.n} questões${d.ac!==null?', '+pct(d.ac)+'% de acerto':''}"></i>`).join('')}
      </div>
      <div class="sub">Altura = % de acerto do dia. Barra vermelha = abaixo dos ${pct(NOTA_CORTE)}% da prova.
        Barra apagada = dia sem prática.</div>
    </div>

    <div class="card">
      <div class="rot">POR MATÉRIA</div>
      ${pr.map(m=>{
        const rs = respostas.filter(r=>r.materia===m.id);
        const ac = rs.length ? rs.filter(r=>r.correta).length/rs.length : 0;
        const cls = ac>=GATE_ACC?'bom':(ac>=NOTA_CORTE?'med':'mau');
        return `<div class="lin">
          <div class="lb"><b style="color:${m.cor}">${esc(m.id)}</b> ${esc(m.nome)}
            <div class="sub" style="font-size:10.5px">cobertura ${pct(m.cob)}% ·
              recente ${m.ar.taxa===null?'—':pct(m.ar.taxa)+'% (n=' + m.ar.n + ')'} ·
              <b>${m.rotulo}</b></div>
            <div class="mini"><div style="width:${pct(ac)}%;background:${m.cor}"></div></div>
          </div>
          <div class="vl ${cls}">${rs.length?pct(ac)+'%':'—'}<br><span style="font-size:10px">${rs.length} resp.</span></div>
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <div class="rot">COBERTURA REAL DO BANCO SOBRE O APÊNDICE D</div>
      <table class="blk">
        <tr><th>MATÉRIA</th><th class="n">OBJ. NO BANCO</th><th class="n">OBJ. NO APÊNDICE D</th><th class="n">%</th></tr>
        ${MATERIAS.map(m=>{
          const n = OBJS[m.id].length;
          const p = m.objApD ? n/m.objApD : 0;
          return `<tr><td style="color:${m.cor}">${esc(m.id)}</td><td class="n">${n}</td>
            <td class="n">~${m.objApD}</td><td class="n">${pct(p)}%</td></tr>`;
        }).join('')}
      </table>
      <div class="perigo"><b>Leia isto antes de confiar no potinho.</b> Ele mede o domínio dos objetivos
      que existem <i>neste banco</i>, não do Apêndice D inteiro. A coluna da direita mostra o tamanho real
      da lacuna. Regulamentos é o caso extremo: a seção REG do Apêndice D é compartilhada com quase todos
      os exames da ANAC e traz centenas de objetivos — muitos de PANS-OPS, Doc 4444 e Anexo 14, fora do
      escopo VFR de um piloto privado. Nenhum banco de tamanho razoável cobre aquilo por inteiro, e este
      prioriza deliberadamente o núcleo VFR.
      <br><br>Contagem de objetivos do Apêndice D obtida por leitura automática do texto oficial — é
      aproximada, serve de ordem de grandeza.</div>
      ${htmlEscopoREG()}
    </div>

    ${nuncaAcertou.length ? `<div class="card">
      <div class="rot">OBJETIVOS QUE VOCÊ NUNCA ACERTOU — ${nuncaAcertou.length}</div>
      <div class="sub" style="margin-bottom:10px">É por aqui que se começa a estudar.</div>
      ${nuncaAcertou.slice(0,15).map(o=>`<div class="lin">
        <div class="lb"><span class="tag mat" style="color:${MAT[o.m].cor};border-color:${MAT[o.m].cor}44">${o.m}</span>
          ${esc(o.obj)}</div>
        <div class="vl mau">0/${o.n}</div></div>`).join('')}
      ${nuncaAcertou.length>15 ? `<div class="sub" style="margin-top:8px">…e mais ${nuncaAcertou.length-15}.</div>`:''}
    </div>` : ''}

    ${fracos.length ? `<div class="card">
      <div class="rot">OBJETIVOS MAIS FRACOS</div>
      ${fracos.map(o=>`<div class="lin">
        <div class="lb"><span class="tag mat" style="color:${MAT[o.m].cor};border-color:${MAT[o.m].cor}44">${o.m}</span>
          ${esc(o.obj)}
          <div class="sub" style="font-size:10.5px">célula ${o.cred}/${CRED_MAX}${o.decai?' · perdeu '+o.decai+' por '+o.diasSemRever+' dias sem revisar':''}</div>
        </div>
        <div class="vl ${o.acertos/o.n>=GATE_ACC?'bom':(o.acertos/o.n>=NOTA_CORTE?'med':'mau')}">${o.acertos}/${o.n}</div></div>`).join('')}
    </div>` : ''}

    ${naoVistos.length ? `<div class="card">
      <div class="rot">AINDA NÃO VISTOS — ${naoVistos.length} OBJETIVO(S)</div>
      <div class="sub">${naoVistos.slice(0,10).map(o=>'· <b>'+o.m+'</b> '+esc(o.obj.slice(0,80))).join('<br>')}
      ${naoVistos.length>10?'<br>…e mais '+(naoVistos.length-10)+'.':''}</div>
    </div>` : ''}

    <div class="card">
      <div class="rot">DETALHE DO POTINHO</div>
      ${pr.map(htmlPotinho).join('')}
      ${htmlExplicacaoCriterio()}
    </div>

    <div class="card">
      <button class="btn" id="btn-sync">Sincronizar com o banco agora</button>
      <button class="btn" id="btn-export">Exportar histórico (JSON)</button>
      <div class="sub" style="margin-top:10px">Banco local: ${respostas.filter(r=>!r._sync).length} resposta(s) ainda não enviada(s).</div>
    </div>`;

  $('btn-sync').onclick = async () => {
    toast('Sincronizando…');
    const n = await sincronizar();
    const v = await puxarDaNuvem();
    toast('Enviados: ' + n + ' · recebidos: ' + v, 3500);
    desenharDesempenho(); atualizarTopo();
  };
  $('btn-export').onclick = () => {
    const blob = new Blob([JSON.stringify({respostas, sessoes}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'estudo-pp-historico.json'; a.click();
  };
}

/* =====================================================================
   11. NAVEGAÇÃO E ARRANQUE
   ===================================================================== */
function atualizarTopo(){
  const s = streakDias();
  $('streak').textContent = s ? s + (s===1?' dia':' dias') : 'comece hoje';
}

document.querySelectorAll('.abas button').forEach(b=>{
  b.onclick = () => {
    if(sessao && ((sessao.modo==='simulado' && b.dataset.t!=='simulado') ||
                  (sessao.modo==='diario' && b.dataset.t!=='diario'))){
      if(!confirm('Há uma sessão em andamento. Sair dela?')) return;
      clearInterval(timerSim); clearInterval(timerDiario); sessao = null;
    }
    document.querySelectorAll('.abas button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.tela').forEach(t=>t.classList.remove('on'));
    $('tela-'+b.dataset.t).classList.add('on');
    if(b.dataset.t==='diario') desenharDiario();
    if(b.dataset.t==='simulado') desenharSimulado();
    if(b.dataset.t==='desempenho') desenharDesempenho();
    window.scrollTo(0,0);
  };
});

atualizarTopo();
desenharDiario();

// testa a conexão e sincroniza sem travar a tela
(async () => {
  const v = await puxarDaNuvem();
  await sincronizar();
  if(v){ atualizarTopo(); desenharDiario(); toast(v + ' resposta(s) recuperada(s) do banco.'); }
})();

</script>
