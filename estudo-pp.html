   pq:`Errada. O recurso é ato pessoal do candidato, feito no sistema do executante ou, em segunda instância, por protocolo eletrônico.`}
 ]}
];
/* =====================================================================
   REG — LOTE 3: Regras do ar (Anexo 2), espaço aéreo e ATS (Anexo 11),
   altimetria e transponder, AIS (Anexo 15), aeródromos (Anexo 14 — só o
   que o piloto VFR usa), busca e salvamento (Anexo 12), segurança
   (Anexo 17), investigação (Anexo 13) e marco regulatório brasileiro.
   Questões ORIGINAIS. Nenhuma copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_REG3 = [
{id:`REG-54`, m:`REG`, dif:2,
 obj:`Explicar a problemática do uso de substâncias psicoativas por membros da tripulação de voo.`,
 p:`O que estabelecem as Regras do Ar sobre o uso de substâncias psicoativas por quem exerce função crítica para a segurança de voo?`,
 alts:[
  {t:`É permitido, desde que a substância tenha sido prescrita por médico.`, ok:false,
   pq:`Errada como regra geral. Prescrição médica não autoriza automaticamente o voo: muitos medicamentos prescritos afetam atenção, tempo de reação e visão, e cabe verificar com médico examinador credenciado a compatibilidade com a atividade aérea.`},
  {t:`Nenhuma pessoa cuja função seja crítica para a segurança de voo deve exercê-la sob efeito de qualquer substância psicoativa que possa comprometer seu desempenho.`, ok:true,
   pq:`Correta. A regra é ampla de propósito: não fala em substância ilícita, e sim em qualquer substância psicoativa capaz de prejudicar o desempenho — o que inclui álcool, medicamentos de venda livre e prescritos.`},
  {t:`A regra vale apenas para álcool; medicamentos não são alcançados.`, ok:false,
   pq:`Errada. A redação alcança substâncias psicoativas em geral, e não apenas o álcool.`},
  {t:`A regra vale apenas para tripulantes de voos comerciais.`, ok:false,
   pq:`Errada. Ela alcança qualquer pessoa em função crítica para a segurança, incluindo o piloto privado no seu próprio avião.`}
 ]},

{id:`REG-55`, m:`REG`, dif:2,
 obj:`Descreva as luzes a serem exibidas pela aeronave.`,
 p:`Quais são as cores das luzes de navegação de uma aeronave e o que elas permitem deduzir?`,
 alts:[
  {t:`Verde na asa esquerda, vermelha na direita e branca no nariz.`, ok:false,
   pq:`Errada. As cores das asas estão trocadas e a branca fica na cauda, não no nariz. Essa inversão levaria a interpretar errado a direção de deslocamento de outra aeronave à noite.`},
  {t:`Vermelha em ambas as asas e branca na cauda.`, ok:false,
   pq:`Errada. Se as duas asas tivessem a mesma cor, seria impossível distinguir se a aeronave se aproxima ou se afasta.`},
  {t:`Vermelha na asa esquerda, verde na asa direita e branca na cauda.`, ok:true,
   pq:`Correta. A utilidade prática é enorme à noite: se você vê verde à sua esquerda e vermelha à direita, a outra aeronave vem na sua direção. Se vê apenas a branca, você está atrás dela. Vermelha e verde juntas de frente significam rota de colisão frontal.`},
  {t:`Todas brancas, com a anticolisão vermelha no topo.`, ok:false,
   pq:`Errada. Luzes brancas idênticas não informariam nada sobre a orientação da aeronave, que é justamente a função do sistema.`}
 ]},

{id:`REG-56`, m:`REG`, dif:3,
 obj:`Explique a limitação de proximidade a outras aeronaves e as regras de direito de passagem, incluindo posições de espera na pista e barras de parada iluminadas.`,
 p:`Uma aeronave alcança outra por trás, na mesma rota. Qual é o procedimento correto para a que ultrapassa?`,
 alts:[
  {t:`Deve ultrapassar pela esquerda, como na estrada.`, ok:false,
   pq:`Errada. A convenção aeronáutica é a ultrapassagem pela direita, e essa diferença em relação ao trânsito rodoviário é justamente o que a torna alvo de prova.`},
  {t:`Deve subir e passar por cima, mantendo separação vertical.`, ok:false,
   pq:`Errada. A regra prevê alteração de rumo à direita, não manobra vertical, que é imprevisível para a aeronave alcançada.`},
  {t:`Deve chamar no rádio e aguardar autorização da aeronave alcançada.`, ok:false,
   pq:`Errada. A regra de direito de passagem se aplica independentemente de comunicação; e em espaço aéreo não controlado pode nem haver contato entre as duas.`},
  {t:`Deve ultrapassar pela DIREITA da aeronave alcançada, que mantém rumo e velocidade.`, ok:true,
   pq:`Correta. A aeronave alcançada tem o direito de passagem e não deve manobrar; quem ultrapassa altera o rumo para a direita e mantém afastamento, sem passar por baixo, por cima ou por trás em curso de colisão.`}
 ]},

{id:`REG-57`, m:`REG`, dif:2,
 obj:`Indique as regras básicas para uma aeronave que opere dentro e nas proximidades de um aeródromo (AD).`,
 p:`Salvo indicação em contrário publicada para o aeródromo, qual é o sentido padrão do circuito de tráfego?`,
 alts:[
  {t:`À esquerda, com todas as curvas do circuito feitas para a esquerda.`, ok:true,
   pq:`Correta. O padrão internacional é o circuito à esquerda, e a razão histórica é simples: em aeronaves com dois pilotos, o comandante senta à esquerda e enxerga melhor a pista daquele lado. Circuito à direita precisa estar publicado.`},
  {t:`À direita, sempre.`, ok:false,
   pq:`Errada. O circuito à direita existe, mas é a exceção, adotada por razões de relevo, ruído ou proximidade de outro aeródromo — e, por ser exceção, precisa estar publicada.`},
  {t:`Depende do vento predominante no dia.`, ok:false,
   pq:`Errada. O vento define a cabeceira em uso, não o sentido das curvas do circuito.`},
  {t:`Fica a critério do piloto, desde que ele informe pelo rádio.`, ok:false,
   pq:`Errada. Se cada um escolhesse, o circuito deixaria de cumprir sua função, que é tornar o tráfego previsível.`}
 ]},

{id:`REG-58`, m:`REG`, dif:2,
 obj:`Descreva as regras para evitar colisões.`,
 p:`Duas aeronaves da mesma categoria convergem aproximadamente no mesmo nível, com risco de colisão. Quem tem o direito de passagem?`,
 alts:[
  {t:`A que estiver à esquerda da outra.`, ok:false,
   pq:`Errada — é o inverso. Quem tem outra aeronave à sua DIREITA é quem cede passagem; logo, a preferência é de quem está à direita.`},
  {t:`A que estiver à DIREITA da outra; a que tem a outra à sua direita deve ceder passagem.`, ok:true,
   pq:`Correta. A regra existe para ser resolvida sem negociação: cada piloto olha para a própria direita. Quem cede deve manobrar de modo claro e cedo, evitando passar à frente da outra.`},
  {t:`A que estiver mais alta.`, ok:false,
   pq:`Errada. Altura não confere prioridade em convergência ao mesmo nível.`},
  {t:`A que estiver voando mais devagar.`, ok:false,
   pq:`Errada. Velocidade não é critério de direito de passagem.`}
 ]},

{id:`REG-59`, m:`REG`, dif:2,
 obj:`Descreva as regras para evitar colisões.`,
 p:`Duas aeronaves se aproximam de um mesmo aeródromo para pouso. Qual tem prioridade?`,
 alts:[
  {t:`A que estiver em nível mais alto, por já estar estabilizada.`, ok:false,
   pq:`Errada, e inverte a lógica. A aeronave mais alta é a que cede, justamente por ter mais margem para manobrar.`},
  {t:`A que chamar primeiro no rádio.`, ok:false,
   pq:`Errada. Ordem de chamada não estabelece prioridade; em aeródromo controlado quem sequencia é o órgão ATS.`},
  {t:`A que estiver em nível mais BAIXO — mas ela não pode usar essa prerrogativa para cortar à frente de outra em final nem para ultrapassá-la.`, ok:true,
   pq:`Correta. A preferência da mais baixa reconhece que ela tem menos energia e menos opções. A ressalva é essencial: a regra não autoriza descer deliberadamente para tomar a frente de quem já está estabelecido na final.`},
  {t:`A de maior porte.`, ok:false,
   pq:`Errada. Porte não é critério, embora a esteira de turbulência de aeronaves pesadas gere requisitos próprios de separação.`}
 ]},

{id:`REG-60`, m:`REG`, dif:3,
 obj:`Descreva as Regras de Voo Visual conforme consta no Capítulo 4 do Anexo 2 da ICAO.`,
 p:`O que é o VFR ESPECIAL e onde ele pode ser autorizado?`,
 alts:[
  {t:`É o voo VFR realizado acima do FL200, com autorização.`, ok:false,
   pq:`Errada. O VFR acima de determinados níveis é objeto de outra restrição das Regras do Ar, e não tem relação com o VFR especial.`},
  {t:`É o voo VFR feito à noite, com equipamento adicional.`, ok:false,
   pq:`Errada. Voo noturno VFR é assunto distinto, tratado pelas condições que cada Estado estabelece.`},
  {t:`É o voo VFR em que o piloto dispensa o plano de voo.`, ok:false,
   pq:`Errada. Apresentação de plano de voo é outro assunto, sem relação com a autorização de VFR especial.`},
  {t:`É o voo VFR autorizado dentro de uma zona de controle (CTR) quando as condições meteorológicas estão abaixo das do voo visual, mediante autorização do órgão ATC e nas condições por ele estabelecidas.`, ok:true,
   pq:`Correta. Dois pontos essenciais: só existe dentro de CTR, e depende de autorização — não é uma decisão do piloto. Como as condições estão abaixo do VMC, é operação de margem estreita, e o piloto continua responsável por manter referência visual e afastamento do terreno.`}
 ]},

{id:`REG-61`, m:`REG`, dif:2,
 obj:`Explique os requisitos para a apresentação de um plano de voo ATS.`,
 p:`Em quais situações a apresentação de plano de voo é exigida pelas Regras do Ar?`,
 alts:[
  {t:`Para voos que cruzam fronteiras internacionais, para voos IFR em espaço aéreo controlado e sempre que exigido pela autoridade competente — além dos casos em que o piloto opta por apresentá-lo.`, ok:true,
   pq:`Correta. No Brasil, quem detalha as situações é o DECEA, e as exigências constam do AIP e das ICA. Vale lembrar o outro lado do plano: ele aciona o serviço de alerta se você não chegar — e por isso precisa ser encerrado após o pouso.`},
  {t:`Somente para voos comerciais de passageiros.`, ok:false,
   pq:`Errada. A natureza comercial do voo não é o critério; um voo privado internacional também exige plano de voo.`},
  {t:`Somente quando o piloto quiser receber serviço de informação de voo.`, ok:false,
   pq:`Errada. O serviço de informação de voo é prestado independentemente de plano apresentado; e o plano é exigido em situações objetivas, não por conveniência.`},
  {t:`Nunca, para voos VFR.`, ok:false,
   pq:`Errada. Voos VFR podem, sim, estar sujeitos à exigência, e em muitos casos o plano é exigido pela autoridade nacional mesmo em VFR.`}
 ]},

{id:`REG-62`, m:`REG`, dif:3,
 obj:`Descreva a ação necessária quando uma aeronave passa por uma falha COM.`,
 p:`Um piloto em voo VFR, em condições visuais, perde a comunicação em rádio. Qual é a conduta esperada?`,
 alts:[
  {t:`Ajustar 7700 e prosseguir até o destino original em qualquer condição.`, ok:false,
   pq:`Errada em ambos os pontos. O 7700 é emergência, e não falha de comunicação; e insistir no destino original sob falha de rádio, ignorando as condições, agrava o problema.`},
  {t:`Ajustar o transponder para 7600, continuar o voo em condições visuais, pousar no aeródromo adequado mais próximo e reportar a chegada ao órgão ATS.`, ok:true,
   pq:`Correta. Em VMC a prioridade é simples: continue enxergando e pouse. O 7600 avisa o órgão de vigilância do problema. Nada disso dispensa a vigilância visual redobrada, já que você deixou de receber informação de tráfego.`},
  {t:`Descer imediatamente para o solo, pousando no primeiro campo disponível.`, ok:false,
   pq:`Errada. Falha de rádio não é emergência que justifique pouso fora de aeródromo; a orientação é pousar em aeródromo adequado.`},
  {t:`Manter o voo em círculos até a comunicação ser restabelecida.`, ok:false,
   pq:`Errada. Circular consome combustível e mantém a aeronave em situação incerta para os demais tráfegos, sem resolver nada.`}
 ]},

{id:`REG-63`, m:`REG`, dif:3,
 obj:`Declare qual ação primária deve ser realizada por uma aeronave interceptada.`,
 p:`Uma aeronave civil é interceptada por aeronave militar. Quais são as ações do piloto interceptado?`,
 alts:[
  {t:`Manter a rota e ignorar a interceptadora, já que o voo é legal.`, ok:false,
   pq:`Errada, e perigosa. Ignorar a interceptação é o comportamento que escala a situação; a legalidade do voo será apurada depois, no solo.`},
  {t:`Acelerar e descer para se afastar da aeronave interceptadora.`, ok:false,
   pq:`Errada. Manobra evasiva é interpretada como recusa e pode ter consequências graves.`},
  {t:`Seguir as instruções da aeronave interceptadora, tentar contato na frequência de emergência 121,5 MHz, notificar o órgão ATS e ajustar o transponder para 7700, salvo instrução em contrário.`, ok:true,
   pq:`Correta. A sequência é: obedecer, comunicar, identificar-se. A frequência 121,5 MHz é a de emergência internacional e deve ser a primeira tentativa quando não há contato estabelecido.`},
  {t:`Pousar imediatamente no campo mais próximo, sem qualquer comunicação.`, ok:false,
   pq:`Errada. O piloto deve seguir as instruções recebidas, que podem incluir pousar num aeródromo determinado — mas a decisão não é unilateral nem silenciosa.`}
 ]},

{id:`REG-64`, m:`REG`, dif:2,
 obj:`Declare para quais voos deve ser obtida uma autorização do controle de tráfego aéreo.`,
 p:`Em que situação um voo VFR precisa de autorização do controle de tráfego aéreo antes de entrar num espaço aéreo?`,
 alts:[
  {t:`Nunca; voos VFR são sempre livres.`, ok:false,
   pq:`Errada. VFR não significa ausência de controle: em espaço aéreo controlado das classes mais restritivas, o VFR depende de autorização.`},
  {t:`Sempre, em qualquer espaço aéreo, inclusive no não controlado.`, ok:false,
   pq:`Errada. Em espaço aéreo não controlado — classe G — não há autorização a ser obtida, porque não há serviço de controle sendo prestado.`},
  {t:`Apenas quando houver mais de uma aeronave na frequência.`, ok:false,
   pq:`Errada. A exigência decorre da classificação do espaço aéreo, não do volume de tráfego naquele momento.`},
  {t:`Ao ingressar em espaço aéreo controlado cuja classificação exija autorização para voos VFR, como as zonas de controle e áreas de controle terminal correspondentes.`, ok:true,
   pq:`Correta. A regra prática: consulte a classe do espaço aéreo na carta antes de decolar. Entrar sem autorização em CTR ou TMA que a exija é violação de espaço aéreo, com consequências administrativas e risco real de conflito de tráfego.`}
 ]},

{id:`REG-65`, m:`REG`, dif:2,
 obj:`Compreenda as várias regras e serviços que se aplicam às várias classes de espaço aéreo.`,
 p:`O que caracteriza o espaço aéreo CLASSE A?`,
 alts:[
  {t:`Permite apenas voos IFR, todos recebendo serviço de controle e separação entre si.`, ok:true,
   pq:`Correta. É a classe mais restritiva: o VFR simplesmente não é admitido. Todas as aeronaves são controladas e separadas umas das outras. Na prática, para um piloto privado VFR, classe A é área a evitar por definição.`},
  {t:`Permite voos VFR e IFR, com separação apenas entre os IFR.`, ok:false,
   pq:`Errada. Essa descrição se aproxima de classes intermediárias como a D ou a E, não da A, onde o VFR não é permitido.`},
  {t:`É espaço aéreo não controlado, sem exigência de autorização.`, ok:false,
   pq:`Errada. Espaço aéreo não controlado é a classe G.`},
  {t:`É reservado a aeronaves militares.`, ok:false,
   pq:`Errada. A classificação de espaço aéreo não distingue aeronaves civis de militares; áreas de uso militar têm designações próprias, como áreas restritas e perigosas.`}
 ]},

{id:`REG-66`, m:`REG`, dif:2,
 obj:`Descreva o propósito de estabelecer as FIR, incluindo as UIR.`,
 p:`Qual é a diferença entre FIR, CTR e TMA?`,
 alts:[
  {t:`FIR é uma área militar, CTR é civil e TMA é internacional.`, ok:false,
   pq:`Errada. Nenhuma das três se define pela natureza militar ou civil do tráfego.`},
  {t:`FIR é a região de informação de voo, ampla, onde se presta serviço de informação e alerta; CTR é a zona de controle em torno de um aeródromo, a partir da superfície; TMA é a área de controle terminal, que protege as chegadas e saídas e tem base acima da superfície.`, ok:true,
   pq:`Correta. A diferença que mais importa em voo é a base: a CTR começa no chão, então você entra nela decolando; a TMA tem base em altitude, então é possível voar por baixo dela. Confundir as duas é causa comum de violação de espaço aéreo.`},
  {t:`São nomes diferentes para a mesma coisa, conforme a altitude.`, ok:false,
   pq:`Errada. São volumes com finalidades distintas, e não sinônimos.`},
  {t:`FIR é o circuito de tráfego, CTR é a pista e TMA é o pátio.`, ok:false,
   pq:`Errada. As três são divisões do espaço aéreo, não do aeródromo.`}
 ]},

{id:`REG-67`, m:`REG`, dif:2,
 obj:`Indique para qual aeronave o FIS deve ser fornecido.`,
 p:`O que é o Serviço de Informação de Voo (FIS) e a quem ele é prestado?`,
 alts:[
  {t:`É o serviço de controle que separa aeronaves em rota.`, ok:false,
   pq:`Errada. Separar aeronaves é serviço de CONTROLE de tráfego aéreo, que é coisa distinta do FIS.`},
  {t:`É o serviço prestado exclusivamente a voos IFR.`, ok:false,
   pq:`Errada. O FIS alcança também os voos VFR, e é justamente neles que ele costuma fazer mais diferença.`},
  {t:`É o serviço que fornece informações úteis e conselhos para a condução segura e eficiente dos voos, prestado a todas as aeronaves que possam ser afetadas por essas informações.`, ok:true,
   pq:`Correta. O FIS informa — condições meteorológicas significativas, mudanças em auxílios, condições de aeródromo, tráfego conhecido — mas não emite autorizações nem provê separação. Em classe G, é o único serviço além do alerta.`},
  {t:`É o boletim meteorológico transmitido a cada hora cheia.`, ok:false,
   pq:`Errada. Isso descreveria produtos meteorológicos específicos; o FIS é mais amplo que meteorologia.`}
 ]},

{id:`REG-68`, m:`REG`, dif:2,
 obj:`Indique quem é responsável por iniciar a fase apropriada de emergência.`,
 p:`O que é o serviço de ALERTA e quando ele é acionado?`,
 alts:[
  {t:`É o serviço que avisa o piloto sobre tráfego conflitante em rota.`, ok:false,
   pq:`Errada. Informação de tráfego é função do FIS e do serviço de controle, não do serviço de alerta.`},
  {t:`É o alarme sonoro da aeronave que indica proximidade do solo.`, ok:false,
   pq:`Errada. Isso é equipamento de bordo, do tipo GPWS, e não um serviço ATS.`},
  {t:`É o serviço de despacho operacional das empresas aéreas.`, ok:false,
   pq:`Errada. Despacho operacional é atividade do operador, exercida pelo DOV, e não um serviço de tráfego aéreo.`},
  {t:`É o serviço prestado para notificar os organismos apropriados sobre aeronaves que necessitem de busca e salvamento, e para auxiliar esses organismos conforme necessário.`, ok:true,
   pq:`Correta. É ele que percorre as fases INCERFA, ALERFA e DETRESFA e aciona o centro de coordenação de salvamento. É também a razão pela qual não encerrar o plano de voo tem consequência: o sistema presume que algo aconteceu.`}
 ]},

{id:`REG-69`, m:`REG`, dif:3,
 obj:`Descreva os dois objetivos principais das configurações do altímetro.`,
 p:`Qual é a diferença prática entre os ajustes QNH e QFE do altímetro?`,
 alts:[
  {t:`Com QNH o altímetro indica a altitude em relação ao nível médio do mar; com QFE, indica a altura em relação ao aeródromo, marcando zero no solo daquele aeródromo.`, ok:true,
   pq:`Correta. O QNH é o ajuste usual no Brasil e permite comparar sua indicação com as elevações publicadas nas cartas. O QFE dá altura direta sobre a pista, o que é cômodo no circuito, mas perde utilidade assim que você se afasta do aeródromo.`},
  {t:`Com QNH o altímetro indica altura sobre o terreno sobrevoado a cada instante.`, ok:false,
   pq:`Errada. Nenhum ajuste barométrico faz isso: acompanhar o relevo instantaneamente é função do radioaltímetro.`},
  {t:`QNH e QFE são a mesma coisa, mudando apenas a unidade de medida.`, ok:false,
   pq:`Errada. As unidades podem ser as mesmas (hPa ou inHg); o que muda é a referência de altura zero.`},
  {t:`Com QFE o altímetro indica níveis de voo.`, ok:false,
   pq:`Errada. Níveis de voo são obtidos com o ajuste na pressão padrão de 1013,25 hPa.`}
 ]},

{id:`REG-70`, m:`REG`, dif:2,
 obj:`Indique quando e onde o piloto deverá operar o transponder.`,
 p:`Além dos códigos de emergência, quando o piloto deve acionar a função IDENT do transponder?`,
 alts:[
  {t:`Sempre que mudar de frequência.`, ok:false,
   pq:`Errada. Troca de frequência é procedimento de comunicação e não requer IDENT.`},
  {t:`Quando solicitado pelo órgão ATS, para que o controlador identifique aquela aeronave na tela.`, ok:true,
   pq:`Correta. O IDENT gera um realce momentâneo do símbolo da aeronave, permitindo ao controlador correlacionar o eco com o indicativo. Por isso deve ser acionado apenas quando pedido — e é comum ouvir a instrução "squawk ident".`},
  {t:`Continuamente, para facilitar o acompanhamento pelo radar.`, ok:false,
   pq:`Errada, e contraproducente: o IDENT acionado sem necessidade polui a tela do controlador e atrapalha a identificação de quem realmente foi solicitado.`},
  {t:`Somente em caso de emergência.`, ok:false,
   pq:`Errada. Emergência tem código próprio, o 7700; o IDENT é recurso de identificação em operação normal.`}
 ]},

{id:`REG-71`, m:`REG`, dif:2,
 obj:`Cite as diferentes partes do AIP.`,
 p:`Como está organizado o AIP (Publicação de Informação Aeronáutica) e o que se encontra em cada parte?`,
 alts:[
  {t:`Em duas partes: VFR e IFR.`, ok:false,
   pq:`Errada. Informações de VFR e IFR aparecem distribuídas pelas três partes, conforme o assunto.`},
  {t:`Em cinco partes, uma para cada região do país.`, ok:false,
   pq:`Errada. A divisão do AIP é temática, não geográfica.`},
  {t:`Em três partes: GEN (generalidades), ENR (em rota) e AD (aeródromos).`, ok:true,
   pq:`Correta. Saber essa divisão economiza tempo real: procedimentos gerais e diferenças em relação aos Anexos ficam em GEN; espaço aéreo, rotas e regras de voo ficam em ENR; tudo sobre um aeródromo específico — cartas, frequências, pistas, procedimentos — fica em AD.`},
  {t:`Em uma parte única, ordenada alfabeticamente por aeródromo.`, ok:false,
   pq:`Errada. Só a parte AD é ordenada por aeródromo; as demais tratam de assuntos gerais e de rota.`}
 ]},

{id:`REG-72`, m:`REG`, dif:2,
 obj:`Descreva como uma recapitulação dos NOTAM atuais e outras informações de caráter urgente devem ser disponibilizadas às tripulações de voo.`,
 p:`O que é o PIB (Pre-flight Information Bulletin)?`,
 alts:[
  {t:`O boletim meteorológico obrigatório antes de cada decolagem.`, ok:false,
   pq:`Errada. Informação meteorológica vem de METAR, TAF, SIGMET e cartas — produtos distintos do PIB.`},
  {t:`O plano de voo simplificado usado em operações VFR locais.`, ok:false,
   pq:`Errada. Plano de voo é outro documento, com finalidade e formato próprios.`},
  {t:`O relatório de ocorrências do aeródromo no dia anterior.`, ok:false,
   pq:`Errada. Registro de ocorrências não é finalidade do PIB.`},
  {t:`A recapitulação dos NOTAM em vigor e demais informações urgentes, organizada para a rota e os aeródromos do voo, para consulta antes da decolagem.`, ok:true,
   pq:`Correta. O PIB existe porque ninguém consegue ler todos os NOTAM do país: ele filtra o que é pertinente àquele voo. Consultá-lo faz parte da preparação e é o que evita chegar a um aeródromo com a pista interditada.`}
 ]},

{id:`REG-73`, m:`REG`, dif:3,
 obj:`Listar os quatro tipos de 'distâncias declaradas' em uma pista e também as abreviaturas apropriadas.`,
 p:`Quais são as quatro distâncias declaradas de uma pista?`,
 alts:[
  {t:`TORA, TODA, ASDA e LDA.`, ok:true,
   pq:`Correta. TORA é o comprimento disponível para a corrida de decolagem; TODA acrescenta a zona desimpedida (clearway); ASDA acrescenta a área de parada (stopway) e é a distância para acelerar e parar; LDA é a disponível para o pouso, que pode ser menor se houver cabeceira deslocada.`},
  {t:`TORA, TODA, ASDA e RESA.`, ok:false,
   pq:`Errada. RESA é a área de segurança de fim de pista, um elemento físico do aeródromo, e não uma distância declarada.`},
  {t:`LDA, RVR, MEF e MSA.`, ok:false,
   pq:`Errada. RVR é alcance visual de pista, MEF é elevação máxima de quadrícula na carta e MSA é altitude mínima de setor — nenhuma delas é distância declarada.`},
  {t:`PCN, ACN, TORA e LDA.`, ok:false,
   pq:`Errada. PCN e ACN dizem respeito à resistência do pavimento e à carga da aeronave, não a distâncias.`}
 ]},

{id:`REG-74`, m:`REG`, dif:2,
 obj:`Interprete o que o piloto verá durante a abordagem usando PAPI, APAPI, T-VASIS e AT-VASIS.`,
 p:`Aproximando-se para pouso, o piloto vê no PAPI três luzes vermelhas e uma branca. O que isso indica?`,
 alts:[
  {t:`Que ele está exatamente na rampa correta.`, ok:false,
   pq:`Errada. A rampa correta é indicada por duas brancas e duas vermelhas — a configuração equilibrada.`},
  {t:`Que ele está ABAIXO da rampa de aproximação e deve corrigir para cima.`, ok:true,
   pq:`Correta. Quanto mais vermelho, mais baixo. O mnemônico clássico ajuda: vermelho sobre branco, tudo certo; todas vermelhas, você está morto — exagero pedagógico para lembrar que vermelho é a direção do terreno.`},
  {t:`Que ele está ACIMA da rampa e deve descer.`, ok:false,
   pq:`Errada, e inverte o significado. Predominância de BRANCO indica estar alto; predominância de vermelho indica estar baixo.`},
  {t:`Que a pista está fechada.`, ok:false,
   pq:`Errada. Pista fechada é indicada por marcação em cruz na superfície e por NOTAM, não pelo PAPI.`}
 ]},

{id:`REG-75`, m:`REG`, dif:2,
 obj:`Indique onde uma marca de designação RWY deve ser fornecida e como ela é projetada.`,
 p:`O número pintado na cabeceira de uma pista, como "09" ou "27", representa o quê?`,
 alts:[
  {t:`A ordem de construção das pistas do aeródromo.`, ok:false,
   pq:`Errada. Numeração sequencial de pistas não existe; o número tem significado direcional.`},
  {t:`O comprimento da pista em centenas de metros.`, ok:false,
   pq:`Errada. Comprimento é publicado no AIP e nas cartas, não pintado na cabeceira.`},
  {t:`A direção magnética aproximada da pista, arredondada para a dezena mais próxima e dividida por dez.`, ok:true,
   pq:`Correta. Uma pista com proa magnética de 087° é designada 09. E as duas cabeceiras de uma mesma pista diferem sempre em 18 — como 09 e 27 — porque apontam em sentidos opostos. Por isso a numeração muda ao longo dos anos: a declinação magnética varia.`},
  {t:`A largura da pista em metros.`, ok:false,
   pq:`Errada. Largura também é dado publicado, não pintado como designativo.`}
 ]},

{id:`REG-76`, m:`REG`, dif:2,
 obj:`Descreva os indicadores de direção do vento com os quais os AD devem ser equipados.`,
 p:`O que a biruta (indicador de direção do vento) informa ao piloto?`,
 alts:[
  {t:`A direção para onde o vento sopra, apontando com a ponta estreita.`, ok:false,
   pq:`Errada quanto à convenção. O vento é sempre nomeado pela direção DE ONDE vem, e a boca larga da biruta fica voltada para o vento — a ponta estreita aponta para onde ele vai.`},
  {t:`A temperatura e a umidade do ar na superfície.`, ok:false,
   pq:`Errada. Esses dados vêm de instrumentos meteorológicos e são divulgados por METAR ou ATIS.`},
  {t:`A pressão atmosférica do aeródromo.`, ok:false,
   pq:`Errada. Pressão é informada como QNH, por rádio ou ATIS.`},
  {t:`A direção de onde sopra o vento na superfície e, pela sua inclinação e agitação, uma noção de sua intensidade.`, ok:true,
   pq:`Correta. É o instrumento mais simples e mais consultado do aeródromo: define a cabeceira a usar e alerta para componente de través. Biruta totalmente estendida e horizontal indica vento forte; pendida, vento fraco.`}
 ]},

{id:`REG-77`, m:`REG`, dif:2,
 obj:`Explique os procedimentos operacionais SAR para o piloto em comando interceptar uma transmissão de socorro.`,
 p:`Um piloto em voo capta uma transmissão de socorro de outra aeronave. Qual é sua obrigação?`,
 alts:[
  {t:`Anotar a posição informada, acusar recebimento se possível, e retransmitir a mensagem ao órgão ATS apropriado, prestando o auxílio que estiver ao seu alcance.`, ok:true,
   pq:`Correta. A aeronave que capta o socorro vira o elo de comunicação: muitas vezes ela está mais alta ou mais próxima e consegue falar com quem a aeronave em perigo não alcança. Registrar a posição é o dado mais valioso para a busca.`},
  {t:`Manter silêncio para não interferir na comunicação.`, ok:false,
   pq:`Errada. Silêncio na frequência é exigido de quem não tem informação útil, mas quem CAPTOU o socorro tem obrigação de agir e retransmitir.`},
  {t:`Dirigir-se imediatamente ao local, independentemente do combustível a bordo.`, ok:false,
   pq:`Errada nessa formulação absoluta. Prestar auxílio é dever, mas nunca à custa de criar uma segunda emergência; a avaliação de combustível, condições e capacidade é do piloto em comando.`},
  {t:`Aguardar o pouso para relatar o ocorrido.`, ok:false,
   pq:`Errada. Em busca e salvamento, minutos importam. A retransmissão deve ser imediata.`}
 ]},

{id:`REG-78`, m:`REG`, dif:2,
 obj:`Explique o "código de sinal visual solo-ar" para uso pelos sobreviventes.`,
 p:`No código visual de sinais solo-ar do Anexo 12, o que significam os sinais "V" e "X" marcados no solo por sobreviventes?`,
 alts:[
  {t:`"V" significa que não há sobreviventes e "X" que a área é segura para pouso.`, ok:false,
   pq:`Errada. Nenhum dos dois tem esse significado, e interpretar assim inverteria completamente a prioridade do resgate.`},
  {t:`"V" significa requer assistência e "X" significa requer assistência MÉDICA.`, ok:true,
   pq:`Correta. A distinção é de prioridade: o "X" sinaliza feridos e demanda resposta mais urgente, possivelmente com meios diferentes. Outros sinais úteis do mesmo código são o "N" para não, o "Y" para sim e a seta indicando a direção seguida.`},
  {t:`"V" significa vitória e "X" significa cancelar a operação.`, ok:false,
   pq:`Errada. Não há sinal de vitória no código; e o cancelamento tem representação própria.`},
  {t:`São sinais de identificação de aeródromos não pavimentados.`, ok:false,
   pq:`Errada. O código solo-ar é para uso de sobreviventes, e não para sinalização de aeródromos.`}
 ]},

{id:`REG-79`, m:`REG`, dif:2,
 obj:`Esteja familiarizado com o Decreto nº 9.540, de 25 de outubro de 2018, que dispõe sobre o sistema de investigação e prevenção de acidentes aeronáuticos no Brasil.`,
 p:`No Brasil, qual é a finalidade da investigação SIPAER de um acidente aeronáutico?`,
 alts:[
  {t:`Determinar culpados e fundamentar a punição dos responsáveis.`, ok:false,
   pq:`Errada, e é o mal-entendido mais comum. A investigação SIPAER é expressamente voltada à prevenção; apuração de responsabilidade civil ou penal corre em processos próprios e independentes.`},
  {t:`Calcular a indenização devida às vítimas e seguradoras.`, ok:false,
   pq:`Errada. Questões indenizatórias são matéria cível, alheia à investigação de prevenção.`},
  {t:`Prevenir a ocorrência de novos acidentes, identificando fatores contribuintes e emitindo recomendações de segurança — sem finalidade de atribuir culpa ou responsabilidade.`, ok:true,
   pq:`Correta. Essa separação é o que permite a colaboração franca de pilotos e mecânicos com a investigação, e é o mesmo princípio do Anexo 13 da OACI. É também o fundamento do reporte voluntário, tratado na ICA 3-7.`},
  {t:`Decidir sobre a cassação da licença dos pilotos envolvidos.`, ok:false,
   pq:`Errada. Medidas administrativas sobre licenças são competência da ANAC em processo próprio, não da investigação SIPAER.`}
 ]},

{id:`REG-80`, m:`REG`, dif:2,
 obj:`Compreender as atividades necessárias esperadas em cada aeroporto que atende a aviação civil internacional.`,
 p:`Segundo o Anexo 17 da OACI, o que é uma área restrita de segurança em um aeroporto?`,
 alts:[
  {t:`Qualquer área do aeroporto onde é proibido fumar.`, ok:false,
   pq:`Errada. Restrições contra incêndio existem, mas nada têm a ver com o conceito de área restrita de segurança da AVSEC.`},
  {t:`A área reservada às autoridades aduaneiras.`, ok:false,
   pq:`Errada. Alfândega e imigração ocupam áreas específicas, mas o conceito de área restrita de segurança é mais amplo e tem outra finalidade.`},
  {t:`O pátio destinado exclusivamente à aviação geral.`, ok:false,
   pq:`Errada. A destinação do pátio à aviação geral ou comercial é questão operacional, não de classificação AVSEC.`},
  {t:`A área do lado ar identificada como de risco prioritário, onde, além do controle de acesso, aplicam-se outros controles de segurança.`, ok:true,
   pq:`Correta. É onde ficam, por exemplo, as posições de estacionamento de aeronaves em operação comercial e as áreas de processamento de bagagem. O acesso exige credenciamento e inspeção, e a delimitação é definida pelo programa de segurança do aeroporto.`}
 ]}
];
/* =====================================================================
   MET — METEOROLOGIA
   Objetivos: Apêndice D da IS 00-003H, seção
   "MET - METEOROLOGIA - EXAMES: PPA, PPL E CPA"
   Questões ORIGINAIS. Nenhuma foi copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_MET = [
{id:`MET-01`, m:`MET`, dif:1,
 obj:`Explicar a importância da Meteorologia Aeronáutica para a aviação, com relação à segurança e à economia.`,
 p:`Além do aspecto de segurança de voo, a Meteorologia Aeronáutica tem um papel econômico direto na operação. Qual das situações abaixo representa MELHOR esse papel econômico?`,
 alts:[
  {t:`Escolher um nível de cruzeiro com vento de cauda favorável, reduzindo o tempo de voo e o consumo de combustível.`, ok:true,
   pq:`Correta. O ganho econômico da meteorologia vem de decisões de planejamento: nível, rota e quantidade de combustível embarcado. Vento de cauda reduz o tempo de voo para a mesma distância, e menos tempo é menos combustível queimado e menos horas de célula e motor.`},
  {t:`Cancelar todo voo em que haja qualquer nuvem no aeródromo de destino.`, ok:false,
   pq:`Errada, e por dois motivos. Presença de nuvem não é, por si só, impedimento — o que importa é o teto, a visibilidade e o tipo de nuvem frente aos mínimos da operação. E cancelar sem necessidade é justamente o oposto de eficiência econômica.`},
  {t:`Substituir a inspeção pré-voo da aeronave quando a previsão indica tempo bom.`, ok:false,
   pq:`Errada. Previsão meteorológica e inspeção pré-voo são coisas independentes: uma trata do ambiente, a outra da condição da aeronave. Nenhuma substitui a outra em nenhuma circunstância.`},
  {t:`Dispensar o embarque de combustível de reserva quando o METAR do destino está bom.`, ok:false,
   pq:`Errada. O METAR descreve o momento presente, não o momento do pouso; e a reserva existe exatamente para cobrir o que a previsão não acertou. Cortar reserva com base em boletim é reduzir margem de segurança, não fazer economia.`}
 ]},

{id:`MET-02`, m:`MET`, dif:1,
 obj:`Citar os principais componentes da atmosfera.`,
 p:`Considerando o ar seco, quais são os dois gases mais abundantes na atmosfera e em que proporção aproximada, em volume?`,
 alts:[
  {t:`Oxigênio, cerca de 78%, e nitrogênio, cerca de 21%.`, ok:false,
   pq:`Errada — os valores estão trocados. É um erro comum por associação com respiração, mas o gás dominante é o nitrogênio, não o oxigênio.`},
  {t:`Nitrogênio, cerca de 78%, e oxigênio, cerca de 21%.`, ok:true,
   pq:`Correta. Ar seco: aproximadamente 78% de nitrogênio e 21% de oxigênio, somando cerca de 99%. O 1% restante é argônio, dióxido de carbono e gases traço. O vapor d/água é tratado à parte porque sua proporção é muito variável.`},
  {t:`Oxigênio, cerca de 50%, e vapor d/água, cerca de 50%.`, ok:false,
   pq:`Errada. O vapor d/água raramente ultrapassa 4% do volume, mesmo em ar tropical saturado, e o oxigênio fica em torno de 21%.`},
  {t:`Dióxido de carbono, cerca de 60%, e nitrogênio, cerca de 30%.`, ok:false,
   pq:`Errada. O dióxido de carbono é um gás traço, na casa de 0,04% do volume. Sua importância é climática, não quantitativa.`}
 ]},

{id:`MET-03`, m:`MET`, dif:2,
 obj:`Definir atmosfera padrão OACI (ICAO Standard Atmosphere - ISA).`,
 p:`Na atmosfera padrão da OACI (ISA), quais são os valores adotados ao nível médio do mar e qual o gradiente térmico até a tropopausa?`,
 alts:[
  {t:`0 °C e 1000 hPa, com queda de 1 °C a cada 1.000 ft.`, ok:false,
   pq:`Errada nos três valores. Nem a temperatura, nem a pressão, nem o gradiente correspondem à ISA. 1000 hPa é um valor redondo conveniente, mas não é o padrão.`},
  {t:`15 °C e 1013,25 hPa, com queda de 2 °C a cada 100 ft.`, ok:false,
   pq:`Errada no gradiente, e por um fator de dez. A 2 °C por 100 ft a temperatura cairia 20 °C em 1.000 ft, o que colocaria a isoterma de zero grau a poucas centenas de pés do solo num dia comum.`},
  {t:`15 °C e 1013,25 hPa, com queda de aproximadamente 2 °C a cada 1.000 ft de subida.`, ok:true,
   pq:`Correta. A ISA fixa 15 °C e 1013,25 hPa (29,92 inHg) ao nível médio do mar, com gradiente de 6,5 °C por quilômetro — o que dá cerca de 2 °C por 1.000 ft — até a tropopausa padrão, a 36.090 ft, onde a temperatura estabiliza em −56,5 °C.`},
  {t:`25 °C e 1013,25 hPa, porque a ISA é definida para condições tropicais.`, ok:false,
   pq:`Errada. A ISA não é regional: é uma convenção única, mundial, justamente para que altímetros e tabelas de desempenho tenham uma referência comum. Não existe uma ISA tropical e outra polar.`}
 ]},

{id:`MET-04`, m:`MET`, dif:2,
 obj:`Realizar cálculos de transformação de escalas termométricas.`,
 p:`A temperatura indicada no aeródromo é de 86 °F. Qual é o valor correspondente em graus Celsius?`,
 alts:[
  {t:`54 °C`, ok:false,
   pq:`Errada. 54 é o resultado apenas de 86 − 32; faltou multiplicar por 5/9. É o erro mais comum nessa conversão: parar na metade da fórmula.`},
  {t:`47,8 °C`, ok:false,
   pq:`Errada. Esse é o resultado de 86 × 5/9, ou seja, aplicou-se a proporção sem subtrair os 32 graus de deslocamento entre as escalas.`},
  {t:`186,8 °C`, ok:false,
   pq:`Errada. Esse valor sai de aplicar a fórmula inversa, C = F × 9/5 + 32, que converte Celsius em Fahrenheit. A conversão foi feita no sentido contrário ao pedido.`},
  {t:`30 °C`, ok:true,
   pq:`Correta. C = (F − 32) × 5/9 = (86 − 32) × 5/9 = 54 × 5/9 = 30 °C.`}
 ]},

{id:`MET-05`, m:`MET`, dif:2,
 obj:`Explicar a influência da umidade do ar no desempenho do voo.`,
 p:`Mantidas iguais a temperatura e a pressão, qual é o efeito de um aumento da umidade do ar sobre o desempenho de decolagem de um avião com motor a pistão?`,
 alts:[
  {t:`Piora: o ar úmido é menos denso, o que reduz a sustentação, a tração da hélice e a potência do motor.`, ok:true,
   pq:`Correta. A molécula de água é mais leve que as de nitrogênio e oxigênio que ela desloca, então ar úmido é menos denso que ar seco nas mesmas condições. Menos densidade significa menos massa de ar por segundo na asa, na hélice e no cilindro — corrida de decolagem mais longa e subida mais fraca.`},
  {t:`Melhora: a água adicionada ao ar aumenta a massa específica e portanto a sustentação.`, ok:false,
   pq:`Errada, e inverte a física. O vapor d/água não se soma ao ar: ele ocupa o lugar de moléculas mais pesadas. Por isso ar úmido é mais leve, não mais pesado.`},
  {t:`Não há efeito: a umidade só interessa para formação de nuvens e nevoeiro.`, ok:false,
   pq:`Errada. A umidade tem efeito direto e mensurável na densidade e, por consequência, no desempenho — é por isso que os gráficos de decolagem trazem correções de altitude-densidade.`},
  {t:`Melhora, porque a umidade reduz o risco de detonação e permite usar mais potência.`, ok:false,
   pq:`Errada como resposta à pergunta. Mesmo que a umidade influa na tendência à detonação, o efeito dominante e o que é cobrado é a queda de densidade, que piora o desempenho.`}
 ]},

{id:`MET-06`, m:`MET`, dif:2,
 obj:`Identificar as unidades de medida da pressão atmosférica e seus respectivos símbolos.`,
 p:`Qual alternativa apresenta corretamente uma equivalência entre unidades de pressão usadas na aviação?`,
 alts:[
  {t:`1013,25 hPa equivale a 1013,25 inHg.`, ok:false,
   pq:`Errada. São escalas com magnitudes muito diferentes; o valor numérico não se repete. Polegada de mercúrio é uma unidade de coluna de líquido, hectopascal é força por área.`},
  {t:`1013,25 hPa equivale a 29,92 inHg.`, ok:true,
   pq:`Correta. São as duas formas de expressar a pressão padrão ao nível médio do mar: 1013,25 hectopascal (numericamente igual ao antigo milibar) e 29,92 polegadas de mercúrio. Altímetros brasileiros usam hPa; manuais e aeronaves de origem norte-americana costumam usar inHg.`},
  {t:`1 hPa equivale a 1 polegada de mercúrio.`, ok:false,
   pq:`Errada. Uma polegada de mercúrio vale aproximadamente 33,86 hPa. Confundir as duas leva a erros grosseiros de ajuste de altímetro.`},
  {t:`1013,25 hPa equivale a 760 inHg.`, ok:false,
   pq:`Errada por troca de unidade: 760 é o valor em milímetros de mercúrio (mmHg), não em polegadas. Em polegadas o valor é 29,92.`}
 ]},

{id:`MET-07`, m:`MET`, dif:2,
 obj:`Relacionar as variações da pressão atmosférica com a temperatura, a densidade e a umidade do ar; o período do dia, a altitude, a latitude e as condições meteorológicas.`,
 p:`Um avião voa mantendo indicação constante de altitude, com o altímetro ajustado no QNH de partida, e se desloca de uma região de ar frio para uma região de ar significativamente mais quente. O que acontece com a altura real em relação ao terreno?`,
 alts:[
  {t:`A altura real diminui, e a aeronave fica mais baixa do que o altímetro indica.`, ok:false,
   pq:`Errada, é exatamente o caso oposto. Voar de uma região quente para uma fria é que faz a aeronave descer fisicamente mantendo a mesma indicação — situação perigosa em relevo.`},
  {t:`Nada muda, porque o altímetro é um instrumento barométrico e não sofre influência de temperatura.`, ok:false,
   pq:`Errada. O altímetro de fato mede pressão, e é justamente por isso que ele é sensível à temperatura: a relação entre pressão e altura geométrica depende da densidade, que depende da temperatura.`},
  {t:`A altura real aumenta: com ar mais quente, a aeronave passa a voar acima da altitude indicada.`, ok:true,
   pq:`Correta. Ar quente é menos denso e as camadas de mesma pressão ficam mais espaçadas verticalmente. Mantendo a mesma pressão indicada, a aeronave sobe fisicamente. Daí a regra clássica: do quente para o frio, cuidado — e o inverso, do frio para o quente, sobra altura.`},
  {t:`A altura real aumenta, mas apenas se o piloto também alterar o ajuste do altímetro.`, ok:false,
   pq:`Errada na causa. O efeito da temperatura ocorre independentemente de o piloto mexer no ajuste; o ajuste corrige variação de pressão, não de temperatura.`}
 ]},

{id:`MET-08`, m:`MET`, dif:2,
 obj:`Definir sistema de pressão atmosférica (sistema bárico), centro de alta pressão atmosférica (anticiclone), centro de baixa pressão atmosférica (ciclone), cavado de pressão e crista ou cunha de pressão.`,
 p:`No Hemisfério Sul, como circula o ar em torno de um centro de alta pressão (anticiclone) próximo à superfície, e que tempo ele tende a produzir?`,
 alts:[
  {t:`Sentido horário, com ar convergindo e ascendendo no centro, favorecendo formação de nuvens e chuva.`, ok:false,
   pq:`Errada em tudo. O sentido descrito e, principalmente, a convergência com ascensão são características da BAIXA pressão, não da alta. Ar que sobe resfria, satura e forma nuvem.`},
  {t:`Sentido anti-horário, com ar convergindo e ascendendo, favorecendo trovoadas.`, ok:false,
   pq:`Errada. O sentido está certo para o Hemisfério Sul, mas a alta é sistema de divergência e subsidência. Convergência e ascensão pertencem ao ciclone.`},
  {t:`O ar permanece parado no centro do anticiclone, sem circulação definida.`, ok:false,
   pq:`Errada. Existe circulação organizada em torno do centro; o que é fraco no núcleo é o gradiente de pressão, e portanto o vento — mas o padrão de divergência e subsidência está lá.`},
  {t:`Sentido anti-horário, com ar divergindo na superfície e subsidência no centro, favorecendo tempo estável e céu limpo.`, ok:true,
   pq:`Correta. No Hemisfério Sul o giro em torno da alta é anti-horário. O ar diverge na superfície e é reposto por subsidência vinda de cima; ar que desce aquece por compressão e se afasta da saturação, o que dissolve nuvens e produz tempo bom.`}
 ]},

{id:`MET-09`, m:`MET`, dif:2,
 obj:`Definir altitude, altura, nível de voo, elevação, elevação do aeródromo, altitude de pressão indicada, altitude de pressão calibrada (ou básica), altitude indicada, altitude calibrada, altitude densidade, altitude absoluta e altitude verdadeira.`,
 p:`Qual alternativa define corretamente ALTURA, no vocabulário meteorológico e operacional?`,
 alts:[
  {t:`Distância vertical entre a aeronave e um ponto ou nível de referência específico na superfície, como o terreno ou o aeródromo.`, ok:true,
   pq:`Correta. Altura é sempre medida a partir de uma referência na superfície — tipicamente o terreno ou a elevação do aeródromo. É o que se obtém, por exemplo, ajustando o altímetro no QFE.`},
  {t:`Distância vertical entre a aeronave e o nível médio do mar.`, ok:false,
   pq:`Errada — essa é a definição de ALTITUDE. A diferença entre altura e altitude é justamente a referência: superfície local no primeiro caso, nível médio do mar no segundo.`},
  {t:`Distância vertical entre a aeronave e a superfície isobárica de 1013,25 hPa.`, ok:false,
   pq:`Errada — isso é NÍVEL DE VOO, a referência usada acima da altitude de transição, com o altímetro ajustado na pressão padrão.`},
  {t:`Distância vertical entre o aeródromo e o nível médio do mar.`, ok:false,
   pq:`Errada — isso é ELEVAÇÃO do aeródromo, que é uma característica fixa do local e não depende da posição da aeronave.`}
 ]},

{id:`MET-10`, m:`MET`, dif:3,
 obj:`Identificar as graduações e os ajustes do altímetro.`,
 p:`Um piloto pousa em um aeródromo cuja elevação é 2.100 ft. Com o altímetro ajustado corretamente no QNH do local, quanto ele indicará com a aeronave parada no solo?`,
 alts:[
  {t:`Zero, porque a aeronave está no solo.`, ok:false,
   pq:`Errada — isso ocorreria com o altímetro ajustado no QFE, que referencia a leitura ao próprio aeródromo e portanto indica zero no solo. Com QNH a leitura é a elevação.`},
  {t:`2.100 ft, ou seja, a própria elevação do aeródromo.`, ok:true,
   pq:`Correta. Essa é a definição prática do QNH: é o ajuste que faz o altímetro indicar a altitude do local em relação ao nível médio do mar. Com a aeronave no solo, essa altitude é a elevação do aeródromo. É também a verificação padrão do instrumento antes do voo.`},
  {t:`Um valor negativo, proporcional à diferença entre a pressão local e 1013,25 hPa.`, ok:false,
   pq:`Errada. Indicação negativa aparece quando se usa pressão padrão num aeródromo de elevação baixa com pressão local alta, não quando o QNH está corretamente ajustado.`},
  {t:`Depende da temperatura do dia; não há um valor esperado.`, ok:false,
   pq:`Errada como resposta. A temperatura afeta a relação entre a indicação e a altura geométrica em voo, mas com a aeronave parada no aeródromo e QNH ajustado a indicação esperada é a elevação publicada.`}
 ]},

{id:`MET-11`, m:`MET`, dif:3,
 obj:`Definir gradiente térmico vertical, gradiente isotérmico, gradiente negativo, gradiente superadiabático, gradiente autoconvectivo e gradiente do ponto de orvalho.`,
 p:`Uma sondagem mostra que, em determinada camada, a temperatura AUMENTA com a altura. Como se chama esse gradiente e o que ele significa para o voo?`,
 alts:[
  {t:`Gradiente superadiabático: camada instável, com forte tendência a correntes ascendentes.`, ok:false,
   pq:`Errada. Superadiabático é o oposto: a temperatura cai com a altura mais rápido do que o resfriamento adiabático, gerando instabilidade acentuada. É típico de solo muito aquecido, não de inversão.`},
  {t:`Gradiente isotérmico: a temperatura permanece constante com a altura.`, ok:false,
   pq:`Errada. Isotérmico é temperatura constante, sem variação. No enunciado a temperatura aumenta, o que é mais estável ainda que o isotérmico.`},
  {t:`Gradiente negativo, ou inversão térmica: camada muito estável, que tende a aprisionar umidade, fumaça e poluentes abaixo dela, reduzindo a visibilidade.`, ok:true,
   pq:`Correta. Quando a temperatura sobe com a altura tem-se a inversão, um gradiente negativo. É a configuração mais estável possível: o ar não sobe espontaneamente, e tudo o que está embaixo fica retido — daí nevoeiro, névoa seca e má visibilidade sob inversões.`},
  {t:`Gradiente autoconvectivo: a camada gera convecção espontânea sem aquecimento do solo.`, ok:false,
   pq:`Errada. O autoconvectivo é um gradiente de queda extremamente acentuada, associado a instabilidade máxima. Nada a ver com temperatura crescendo com a altura.`}
 ]},

{id:`MET-12`, m:`MET`, dif:2,
 obj:`Citar as características da condição de tempo com instabilidade.`,
 p:`Qual conjunto de características é típico de uma massa de ar INSTÁVEL?`,
 alts:[
  {t:`Nuvens estratiformes, chuvisco contínuo, ar liso e visibilidade ruim.`, ok:false,
   pq:`Errada — esse é o quadro de ar ESTÁVEL. Sem movimento vertical, as nuvens se espalham em camadas, a precipitação é fraca e contínua, o voo é liso e os poluentes ficam retidos, piorando a visibilidade.`},
  {t:`Céu totalmente limpo, vento calmo e inversão térmica próxima ao solo.`, ok:false,
   pq:`Errada. Inversão é a assinatura da estabilidade máxima. Céu limpo com vento calmo sob inversão é o cenário clássico de ar estável, não instável.`},
  {t:`Nevoeiro de radiação ao amanhecer, dissipando ao longo da manhã.`, ok:false,
   pq:`Errada. O nevoeiro de radiação depende de noite clara, vento fraco e ar estável junto ao solo. É fenômeno de estabilidade.`},
  {t:`Nuvens de desenvolvimento vertical, pancadas de chuva, turbulência em baixos níveis e boa visibilidade fora das áreas de precipitação.`, ok:true,
   pq:`Correta. Instabilidade significa que uma parcela deslocada para cima continua subindo por conta própria. Isso produz cumuliformes, chuva em pancadas, turbulência convectiva e, como o ar se mistura verticalmente, a visibilidade fora das pancadas costuma ser boa.`}
 ]},

{id:`MET-13`, m:`MET`, dif:2,
 obj:`Definir cada uma das forças atuantes sobre o vento.`,
 p:`Qual é a força que dá origem ao vento, ou seja, a causa primária do deslocamento horizontal do ar?`,
 alts:[
  {t:`A força do gradiente de pressão, que empurra o ar da alta para a baixa pressão.`, ok:true,
   pq:`Correta. Sem diferença de pressão não há vento. As demais forças — Coriolis, atrito, centrífuga — apenas modificam a direção e a intensidade de um movimento que o gradiente de pressão iniciou.`},
  {t:`A força de Coriolis, gerada pela rotação da Terra.`, ok:false,
   pq:`Errada quanto ao papel. Coriolis desvia o ar já em movimento (para a esquerda no Hemisfério Sul), mas não coloca ar parado em movimento. Ela é força defletora, não motora.`},
  {t:`A força de atrito com a superfície.`, ok:false,
   pq:`Errada. O atrito freia e reorienta o vento nos primeiros milhares de pés, fazendo-o cruzar as isóbaras em direção à baixa. É força de oposição, nunca de origem.`},
  {t:`A força centrífuga em torno dos centros de pressão.`, ok:false,
   pq:`Errada. A força centrífuga só existe porque o ar já está descrevendo uma trajetória curva; é consequência do movimento, não sua causa.`}
 ]},

{id:`MET-14`, m:`MET`, dif:3,
 obj:`Definir vento barostrófico e vento geostrófico.`,
 p:`O que caracteriza o vento GEOSTRÓFICO?`,
 alts:[
  {t:`É o vento medido na superfície, já modificado pelo atrito com o terreno.`, ok:false,
   pq:`Errada. Justamente porque há atrito, o vento de superfície cruza as isóbaras em direção à baixa pressão e é mais fraco — deixando de ser geostrófico.`},
  {t:`É o vento resultante do equilíbrio entre a força do gradiente de pressão e a força de Coriolis, soprando paralelamente a isóbaras retilíneas, em altitude, longe do atrito.`, ok:true,
   pq:`Correta. Quando as duas forças se equilibram exatamente, o vento não cruza as isóbaras: ele corre paralelo a elas. Isso só se sustenta em isóbaras retilíneas e acima da camada de atrito, tipicamente a partir de uns 2.000 a 3.000 ft.`},
  {t:`É o vento que sopra em isóbaras curvas, com participação da força centrífuga.`, ok:false,
   pq:`Errada — esse é o vento gradiente (ou, no vocabulário do programa, barostrófico), em que a curvatura das isóbaras traz a força centrífuga para o balanço.`},
  {t:`É o vento local gerado por diferença de aquecimento entre continente e oceano.`, ok:false,
   pq:`Errada. Isso descreve brisa marítima e terrestre, fenômeno térmico local, sem relação com o equilíbrio geostrófico.`}
 ]},

{id:`MET-15`, m:`MET`, dif:2,
 obj:`Definir turbulências.`,
 p:`Um voo em fim de tarde sobre terreno seco e irregular, em dia de forte aquecimento, encontra solavancos frequentes e desorganizados abaixo de 5.000 ft. Qual é a origem mais provável dessa turbulência?`,
 alts:[
  {t:`Turbulência de céu claro (CAT), típica de aeronaves leves em baixa altitude.`, ok:false,
   pq:`Errada. A CAT está associada a cisalhamento junto a correntes de jato, em altos níveis — bem acima da faixa de operação descrita, e sem relação com aquecimento do solo.`},
  {t:`Turbulência de esteira, gerada pelo próprio avião.`, ok:false,
   pq:`Errada. A esteira é gerada pelos vórtices de ponta de asa de OUTRA aeronave, normalmente maior, e é encontrada em rota de tráfego ou nas proximidades de pistas — não de forma difusa sobre terreno aquecido.`},
  {t:`Turbulência térmica ou convectiva, causada por correntes ascendentes e descendentes geradas pelo aquecimento desigual do solo.`, ok:true,
   pq:`Correta. Superfícies diferentes aquecem de forma diferente, criando térmicas isoladas. A aeronave atravessa alternadamente ar subindo e ar descendo, o que produz o solavanco típico das tardes quentes em baixos níveis.`},
  {t:`Turbulência frontal, sempre presente na retaguarda de uma frente quente.`, ok:false,
   pq:`Errada. A turbulência frontal existe, mas está ligada à superfície frontal e à convecção associada, e o quadro descrito não menciona qualquer sistema frontal.`}
 ]},

{id:`MET-16`, m:`MET`, dif:1,
 obj:`Explicar as condições gerais para a formação das nuvens.`,
 p:`Quais condições precisam ocorrer simultaneamente para que uma nuvem se forme?`,
 alts:[
  {t:`Apenas o resfriamento do ar, independentemente de seu conteúdo de umidade.`, ok:false,
   pq:`Errada. Ar muito seco pode ser resfriado bastante sem formar nuvem alguma, porque nunca chega à saturação em temperaturas praticáveis.`},
  {t:`Apenas a presença de vento forte que eleve o ar mecanicamente.`, ok:false,
   pq:`Errada. A elevação mecânica é um dos mecanismos de resfriamento possíveis, mas é meio, não condição suficiente: sem umidade adequada não há condensação.`},
  {t:`Aquecimento do ar até que ele atinja o ponto de orvalho.`, ok:false,
   pq:`Errada e invertida. Aquecer o ar o AFASTA da saturação, aumentando sua capacidade de reter vapor. O caminho para a nuvem é o resfriamento.`},
  {t:`Ar com umidade suficiente, um mecanismo que o resfrie até o ponto de orvalho e a presença de núcleos de condensação.`, ok:true,
   pq:`Correta. As três pernas do tripé. Falta de qualquer uma impede a nuvem: sem umidade não há o que condensar, sem resfriamento o ar não satura, e sem núcleos higroscópicos a condensação não se organiza em gotículas visíveis.`}
 ]},

{id:`MET-17`, m:`MET`, dif:2,
 obj:`Identificar cada um dos tipos de nuvens altas.`,
 p:`Um piloto observa nuvens finas, esbranquiçadas, em forma de filamentos e sem sombras próprias, muito acima do nível de cruzeiro previsto. A que gênero elas pertencem e de que são compostas?`,
 alts:[
  {t:`Cirrus — nuvens altas, compostas essencialmente por cristais de gelo.`, ok:true,
   pq:`Correta. Cirrus, cirrocumulus e cirrostratus são o grupo das nuvens altas, formadas acima de aproximadamente 20.000 ft em latitudes médias, onde a temperatura é bem negativa. Por isso são de cristais de gelo e têm aquele aspecto fibroso e translúcido.`},
  {t:`Stratus — nuvens baixas, compostas por gotículas de água.`, ok:false,
   pq:`Errada no grupo. Stratus é nuvem baixa, em camada uniforme e cinzenta, muitas vezes cobrindo o terreno alto. Nada a ver com o aspecto filamentoso descrito.`},
  {t:`Altocumulus — nuvens médias, compostas por gotículas superresfriadas.`, ok:false,
   pq:`Errada. Altocumulus são médias e se apresentam em bancos ou lençóis de elementos arredondados com sombreamento próprio, não em filamentos finos e translúcidos.`},
  {t:`Nimbostratus — nuvem de precipitação contínua, de grande espessura.`, ok:false,
   pq:`Errada. Nimbostratus é uma camada espessa, escura e chuvosa, que bloqueia o sol — o oposto da aparência descrita.`}
 ]},

{id:`MET-18`, m:`MET`, dif:2,
 obj:`Identificar cada um dos tipos de nuvens especiais.`,
 p:`Voando a favor do vento nas proximidades de uma serra, o piloto observa nuvens lenticulares estacionárias a sotavento do relevo. O que essa formação indica?`,
 alts:[
  {t:`Ar estável e calmo na região, indicando condições favoráveis à travessia em baixa altitude.`, ok:false,
   pq:`Errada e perigosa. A aparência lisa e imóvel da lenticular engana: ela é justamente o indicador visual de que existe onda de montanha ativa, com correntes verticais capazes de exceder a razão de subida de um monomotor leve.`},
  {t:`Presença de ondas orográficas, com forte turbulência e correntes verticais associadas, mesmo com a nuvem parecendo imóvel.`, ok:true,
   pq:`Correta. A lenticular marca a crista de uma onda de montanha: o ar atravessa a nuvem continuamente, condensando na subida e evaporando na descida, o que a mantém aparentemente parada. É sinal de onda estabelecida, com ascendentes e descendentes fortes e turbulência, especialmente sob a nuvem, na região do rotor.`},
  {t:`Formação de nevoeiro orográfico, que se dissipará com o aumento do vento.`, ok:false,
   pq:`Errada. Nevoeiro orográfico se forma pela ascensão forçada do ar úmido na encosta a barlavento e toca o terreno; a lenticular fica em altitude, a sotavento, e não é nevoeiro.`},
  {t:`Presença de uma frente fria em aproximação.`, ok:false,
   pq:`Errada. A lenticular é fenômeno local ligado ao relevo e ao perfil de vento, e pode ocorrer com qualquer configuração sinótica, inclusive sob domínio de alta pressão.`}
 ]},

{id:`MET-19`, m:`MET`, dif:2,
 obj:`Diferenciar nevoeiro de névoas.`,
 p:`Qual é o critério que distingue NEVOEIRO de NÉVOA ÚMIDA?`,
 alts:[
  {t:`A altura em que se formam: nevoeiro toca o solo, névoa fica sempre acima de 500 ft.`, ok:false,
   pq:`Errada. Ambos são fenômenos de superfície, em contato com o solo. Nuvem que fica acima do solo é stratus, não névoa.`},
  {t:`A composição: nevoeiro é formado por gelo e névoa por água.`, ok:false,
   pq:`Errada. Ambos são compostos por gotículas de água líquida. Existe o nevoeiro de gelo, mas ele é caso particular de temperaturas muito baixas, não o critério de distinção.`},
  {t:`A visibilidade horizontal resultante: no nevoeiro ela fica abaixo de 1.000 m; na névoa úmida, igual ou acima desse valor.`, ok:true,
   pq:`Correta. Os dois fenômenos são gotículas de água em suspensão junto à superfície; o que os separa é o critério operacional de visibilidade, fixado em 1.000 m. Abaixo disso é nevoeiro, e o impacto sobre a operação VFR é imediato.`},
  {t:`O horário: nevoeiro ocorre só de madrugada e névoa só à tarde.`, ok:false,
   pq:`Errada. Há preferências horárias, mas elas não definem os fenômenos. Nevoeiro de advecção, por exemplo, pode formar-se e persistir em qualquer hora do dia.`}
 ]},

{id:`MET-20`, m:`MET`, dif:2,
 obj:`Identificar os tipos de nevoeiro.`,
 p:`Noite de céu limpo, vento fraco e ar úmido sobre terreno plano. Ao amanhecer forma-se nevoeiro raso, que se dissipa com o aquecimento da manhã. Que tipo de nevoeiro é esse e qual seu mecanismo?`,
 alts:[
  {t:`Nevoeiro de advecção, causado pelo deslocamento de ar quente e úmido sobre superfície mais fria.`, ok:false,
   pq:`Errada para o caso descrito. O nevoeiro de advecção exige vento transportando uma massa de ar sobre uma superfície mais fria — típico de área costeira — e costuma persistir mesmo com vento moderado, ao contrário do descrito.`},
  {t:`Nevoeiro frontal, associado à evaporação da chuva que cai em ar frio sob a superfície frontal.`, ok:false,
   pq:`Errada. Faltam os elementos do quadro frontal: não há precipitação nem sistema frontal no enunciado.`},
  {t:`Nevoeiro de encosta, formado pela ascensão de ar úmido ao longo do relevo.`, ok:false,
   pq:`Errada. O enunciado descreve terreno plano, e o nevoeiro orográfico ou de encosta depende justamente da elevação forçada do ar pelo relevo.`},
  {t:`Nevoeiro de radiação, formado pelo resfriamento do solo por irradiação noturna, que resfria por contato a camada de ar imediatamente acima até a saturação.`, ok:true,
   pq:`Correta. A receita é exatamente essa: céu limpo permite a perda de calor por radiação, vento fraco permite que só a camada mais baixa resfrie sem se misturar, e umidade suficiente faz essa camada saturar. Com o sol, o solo aquece de volta e o nevoeiro levanta ou evapora.`}
 ]},

{id:`MET-21`, m:`MET`, dif:2,
 obj:`Identificar os limites mínimos, para voo visual, de visibilidade horizontal, de visibilidade vertical, de visibilidade oblíqua, de visibilidade de aproximação e de alcance visual da pista.`,
 p:`O que significa a sigla RVR, e em que ela difere da visibilidade predominante informada no METAR?`,
 alts:[
  {t:`É o alcance visual da pista: a distância ao longo da pista que o piloto de uma aeronave alinhada consegue enxergar as marcas de superfície ou as luzes que a delimitam, medida por equipamento junto à pista.`, ok:true,
   pq:`Correta. A RVR é medida por instrumento na cabeceira e ao longo da pista, e reflete a condição naquele ponto específico, na altura dos olhos do piloto. Serve exatamente para decisões de pouso e decolagem.`},
  {t:`É a visibilidade vertical, usada quando o céu está obscurecido e não se consegue determinar o teto.`, ok:false,
   pq:`Errada. Visibilidade vertical é outra grandeza, informada no METAR como VV seguido do valor, quando não é possível identificar a base das nuvens.`},
  {t:`É a visibilidade predominante em todo o aeródromo, observada por um observador humano.`, ok:false,
   pq:`Errada — essa é justamente a visibilidade predominante do METAR, que é uma média espacial em torno do aeródromo. A RVR é local, instrumental e específica da pista.`},
  {t:`É a distância máxima a que a aeronave pode ser vista da torre de controle.`, ok:false,
   pq:`Errada. Esse conceito não é a RVR; a RVR é sempre referida ao que o piloto vê a partir da pista, não ao que o controlador vê da torre.`}
 ]},

{id:`MET-22`, m:`MET`, dif:2,
 obj:`Citar as características das massas de ar tropicais, equatoriais, polares, árticas, antárticas, continentais secas, marítimas úmidas, quentes e frias.`,
 p:`Uma massa de ar é classificada como FRIA ou QUENTE em relação a quê?`,
 alts:[
  {t:`A um valor fixo de temperatura, definido em 15 °C pela OACI.`, ok:false,
   pq:`Errada. Os 15 °C são a temperatura padrão da ISA ao nível do mar, uma convenção para altimetria e desempenho. Não servem de fronteira entre massas quentes e frias.`},
  {t:`À temperatura da superfície sobre a qual ela está se deslocando no momento.`, ok:true,
   pq:`Correta. A classificação é relativa, não absoluta. Massa fria é a que está mais fria que a superfície por onde passa — e por isso é aquecida por baixo, tornando-se instável. Massa quente é mais quente que a superfície, é resfriada por baixo e torna-se estável.`},
  {t:`À latitude da região de origem, sendo fria toda massa formada acima de 30° de latitude.`, ok:false,
   pq:`Errada. A latitude de origem define se a massa é tropical, polar ou ártica — outra classificação, referente à ORIGEM. Quente e frio dizem respeito ao contraste com a superfície atual.`},
  {t:`À umidade que ela transporta: massas úmidas são frias e massas secas são quentes.`, ok:false,
   pq:`Errada. Umidade define a classificação em marítima ou continental, e é independente do contraste térmico com a superfície.`}
 ]},

{id:`MET-23`, m:`MET`, dif:2,
 obj:`Utilizar as informações meteorológicas concernentes a áreas de frontogênese, áreas de frontólise, e aos diferentes tipos de frentes.`,
 p:`Comparando a passagem de uma frente FRIA com a de uma frente QUENTE, qual afirmação está correta?`,
 alts:[
  {t:`A frente quente é sempre mais perigosa para o voo VFR porque produz trovoadas mais intensas.`, ok:false,
   pq:`Errada. As trovoadas mais intensas estão tipicamente na frente fria. A frente quente é perigosa para o VFR por outro motivo: tetos baixos, chuva e visibilidade ruim em área extensa e por muito tempo.`},
  {t:`Na passagem de qualquer frente o vento permanece constante em direção e intensidade.`, ok:false,
   pq:`Errada. A mudança de direção do vento é um dos indicadores mais confiáveis de passagem frontal, junto com a variação de pressão e de temperatura.`},
  {t:`A frente fria tem rampa mais íngreme, faixa de mau tempo mais estreita e intensa, com cumulonimbus e pancadas; a frente quente tem rampa suave, faixa larga e precipitação contínua sob nuvens estratiformes.`, ok:true,
   pq:`Correta. Na frente fria o ar frio, mais denso, avança por baixo e força a ascensão brusca do ar quente — resultado: nuvens de desenvolvimento vertical, tempo severo e passagem rápida. Na frente quente o ar quente sobe suavemente sobre o frio, produzindo camadas extensas e chuva persistente ao longo de centenas de quilômetros.`},
  {t:`A frente oclusa não produz nuvens nem precipitação porque as massas já se misturaram.`, ok:false,
   pq:`Errada. A oclusão ocorre quando a frente fria alcança a quente, elevando o ar quente por completo. Isso costuma produzir nebulosidade e precipitação, muitas vezes combinando características dos dois tipos.`}
 ]},

{id:`MET-24`, m:`MET`, dif:2,
 obj:`Explicar a formação das trovoadas de massa de ar.`,
 p:`Qual é a sequência correta dos estágios de uma célula de trovoada e o que caracteriza o estágio maduro?`,
 alts:[
  {t:`Maduro, cumulus e dissipação, sendo o maduro o estágio em que só existem correntes ascendentes.`, ok:false,
   pq:`Errada duas vezes: a ordem está trocada e a descrição do maduro está incorreta. Ascendente isolada é a marca do estágio cumulus, o primeiro.`},
  {t:`Cumulus, dissipação e maduro, sendo o maduro o momento em que a nuvem já perdeu a bigorna.`, ok:false,
   pq:`Errada na ordem. A dissipação é o último estágio, e a bigorna geralmente aparece a partir do maduro, quando o topo atinge a tropopausa e se espalha.`},
  {t:`Cumulus, maduro e dissipação, sendo o maduro o estágio de menor risco por já ter chovido.`, ok:false,
   pq:`Errada na avaliação de risco. A ordem está certa, mas o maduro é o estágio MAIS perigoso: é quando ocorrem os fenômenos severos. Chuva na superfície é sinal de célula ativa, não de célula gasta.`},
  {t:`Cumulus, maduro e dissipação. O estágio maduro se caracteriza pela coexistência de correntes ascendentes e descendentes, quando começa a precipitação na superfície.`, ok:true,
   pq:`Correta. No estágio cumulus só há ascendente. A precipitação, ao cair, arrasta ar para baixo e cria a descendente: é o início do maduro, o momento de máxima energia, com cisalhamento, granizo, raios e rajadas. Quando a descendente domina e corta o suprimento de ar quente e úmido, vem a dissipação.`}
 ]},

{id:`MET-25`, m:`MET`, dif:2,
 obj:`Descrever as práticas e os procedimentos para evitar ou minimizar os efeitos das tempestades sobre a aeronave em voo.`,
 p:`Qual é o procedimento correto para um piloto privado, em voo VFR num monomotor leve, ao identificar uma linha de trovoadas à frente?`,
 alts:[
  {t:`Contornar as células com ampla margem lateral, ou desviar-se e pousar em alternativa, sem tentar atravessar nem voar por baixo da base.`, ok:true,
   pq:`Correta. A única conduta segura é evitar. Voar por baixo da base expõe a rajada de proa, ao microexplosão e ao granizo; passar entre células duas células próximas expõe ao mesmo, sem espaço de manobra. Se a linha não pode ser contornada com folga, o voo não deve prosseguir.`},
  {t:`Atravessar a célula perpendicularmente, na menor altitude possível, para reduzir o tempo de exposição.`, ok:false,
   pq:`Errada e perigosa. Perto do solo é exatamente onde ficam a rajada de saída e o cisalhamento, e não há altura para recuperar de uma descendente forte. Reduzir o tempo de exposição não compensa a severidade.`},
  {t:`Subir acima do topo da nuvem para passar por cima.`, ok:false,
   pq:`Errada. Cumulonimbus atingem rotineiramente 30.000 a 50.000 ft, muito acima do teto de serviço de um monomotor leve não pressurizado. Além disso, sobrevoar o topo expõe à turbulência de bigorna.`},
  {t:`Reduzir para a velocidade de manobra e prosseguir na rota original, já que abaixo da Va a estrutura está protegida.`, ok:false,
   pq:`Errada. Voar na velocidade de penetração de turbulência é a providência correta caso a turbulência seja inevitável, mas ela não autoriza entrar em trovoada: a Va protege contra sobrecarga aerodinâmica, não contra granizo, raio, cisalhamento ou perda de controle.`}
 ]},

{id:`MET-26`, m:`MET`, dif:3,
 obj:`Explicar as influências exercidas no acúmulo de gelo na aeronave pelo tamanho e quantidade de gotículas de água presentes no ar, pela temperatura do ar, pelos aspectos externos da aeronave, pelas superfícies expostas e pela sua velocidade.`,
 p:`Que condição favorece a formação de gelo CLARO (transparente), o mais perigoso para a aeronave?`,
 alts:[
  {t:`Gotículas muito pequenas e temperatura bem abaixo de zero, congelando instantaneamente no impacto.`, ok:false,
   pq:`Errada — essa é a receita do gelo ESCARCHA (rime), branco e opaco, formado por congelamento instantâneo que aprisiona ar entre os cristais. É mais leve e menos aderente que o gelo claro.`},
  {t:`Gotículas grandes e temperatura pouco abaixo de zero, fazendo a água escoar antes de congelar e formar uma camada densa e aderente.`, ok:true,
   pq:`Correta. Gotícula grande não congela por inteiro no impacto: parte escorre para trás e congela depois, preenchendo os vazios. O resultado é gelo transparente, pesado, muito aderente e que deforma o perfil além do bordo de ataque — daí ser o mais perigoso.`},
  {t:`Ar completamente seco em temperaturas muito negativas.`, ok:false,
   pq:`Errada. Sem água líquida superresfriada não há formação de gelo por impacto, independentemente de quão baixa esteja a temperatura.`},
  {t:`Voo acima da tropopausa, onde a umidade é máxima.`, ok:false,
   pq:`Errada nos dois pontos. A umidade diminui fortemente com a altura, e acima da tropopausa praticamente não há água líquida superresfriada disponível.`}
 ]}
];
/* =====================================================================
   LOTE 2 de MET, TV e NAV.
   MET: ênfase em leitura de METAR/TAF, que é onde a prova cobra
        interpretação e não decoreba.
   Questões ORIGINAIS. Nenhuma copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_MET2 = [
{id:`MET-27`, m:`MET`, dif:2,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`Qual é a diferença entre METAR e TAF?`,
 alts:[
  {t:`METAR é a previsão e TAF é a observação.`, ok:false,
   pq:`Errada — os conceitos estão trocados.`},
  {t:`METAR vale para a rota e TAF para o aeródromo.`, ok:false,
   pq:`Errada. Ambos são de aeródromo. Informação de rota vem de cartas de tempo significativo, SIGMET e boletins de área.`},
  {t:`METAR é uma observação do tempo presente no aeródromo; TAF é uma previsão para um período futuro naquele aeródromo.`, ok:true,
   pq:`Correta. Um relata o que ESTÁ acontecendo, o outro o que SE ESPERA. Para decidir sobre um voo você precisa dos dois: o METAR diz se dá para sair agora, o TAF diz o que esperar na hora do pouso.`},
  {t:`METAR é emitido em português e TAF em inglês.`, ok:false,
   pq:`Errada. Ambos usam o mesmo código internacional, e o idioma não os distingue.`}
 ]},

{id:`MET-28`, m:`MET`, dif:3,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`No METAR, o grupo de vento é informado em relação a qual norte, e como isso se compara com o vento informado pela torre para pouso e decolagem?`,
 alts:[
  {t:`Ambos em relação ao norte magnético.`, ok:false,
   pq:`Errada. O METAR usa norte verdadeiro; se ambos usassem o magnético, não haveria diferença a considerar.`},
  {t:`Ambos em relação ao norte verdadeiro.`, ok:false,
   pq:`Errada quanto ao vento da torre. Ele é dado em relação ao norte magnético justamente para poder ser comparado diretamente com o designativo da pista.`},
  {t:`O METAR usa magnético e a torre usa verdadeiro.`, ok:false,
   pq:`Errada — a relação está invertida.`},
  {t:`O METAR usa o norte VERDADEIRO; o vento informado pela torre para pouso e decolagem é referido ao norte MAGNÉTICO.`, ok:true,
   pq:`Correta, e é diferença que confunde muita gente. A razão é prática: o boletim é um produto meteorológico padronizado internacionalmente, enquanto o vento da torre precisa ser comparável com o número pintado na cabeceira, que é magnético.`}
 ]},

{id:`MET-29`, m:`MET`, dif:3,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`O que significa a abreviatura CAVOK num METAR?`,
 alts:[
  {t:`Que a visibilidade é de 10 km ou mais, não há nuvens abaixo de 1.500 m (5.000 ft) nem abaixo da altitude mínima de setor — a que for maior —, não há CB nem TCU, e não ocorre tempo significativo.`, ok:true,
   pq:`Correta. CAVOK é uma abreviação que substitui vários grupos de uma vez. Atenção ao detalhe: a ausência exigida é de nuvens ABAIXO daquele limite; pode haver nuvens acima, e ainda assim ser CAVOK.`},
  {t:`Que o aeródromo está fechado por condições meteorológicas.`, ok:false,
   pq:`Errada, e é o oposto. CAVOK indica condições francamente boas.`},
  {t:`Que o céu está completamente limpo, sem qualquer nuvem em nenhuma altitude.`, ok:false,
   pq:`Errada. Céu totalmente limpo se codifica de outra forma; CAVOK admite nuvens acima dos limites estabelecidos.`},
  {t:`Que a observação foi feita automaticamente, sem observador humano.`, ok:false,
   pq:`Errada. Observação automática é indicada por outro grupo, o AUTO.`}
 ]},

{id:`MET-30`, m:`MET`, dif:3,
 obj:`Interpretar as informações meteorológicas concernentes a nuvens.`,
 p:`Num METAR, o que significam as siglas FEW, SCT, BKN e OVC, e em que unidade é dada a altura que as acompanha?`,
 alts:[
  {t:`São tipos de nuvem (cirros, cumulus, stratus e nimbus), com altura em metros.`, ok:false,
   pq:`Errada. As siglas indicam QUANTIDADE de cobertura, e não gênero de nuvem.`},
  {t:`Indicam a cobertura do céu em oitavos — FEW 1 a 2, SCT 3 a 4, BKN 5 a 7 e OVC 8 —, com a altura da base em centenas de pés acima do nível do aeródromo.`, ok:true,
   pq:`Correta. Assim, BKN020 significa base a 2.000 ft acima do aeródromo, cobrindo de 5 a 7 oitavos do céu. E é a partir de BKN que se começa a falar em teto.`},
  {t:`São intensidades de precipitação, com altura em quilômetros.`, ok:false,
   pq:`Errada. Intensidade de precipitação é indicada por sinais de mais e menos junto ao grupo de tempo presente.`},
  {t:`Indicam a velocidade do vento em cada camada, em nós.`, ok:false,
   pq:`Errada. Vento em altitude é objeto de cartas e de previsões específicas, não do grupo de nuvens do METAR.`}
 ]},

{id:`MET-31`, m:`MET`, dif:3,
 obj:`Interpretar as informações meteorológicas concernentes a nuvens.`,
 p:`Um METAR informa FEW015 SCT025 BKN040 OVC080. Qual é o TETO desse aeródromo?`,
 alts:[
  {t:`1.500 ft, a base da camada mais baixa informada.`, ok:false,
   pq:`Errada. FEW é cobertura de 1 a 2 oitavos e não constitui teto — a maior parte do céu está aberta.`},
  {t:`8.000 ft, a camada mais alta.`, ok:false,
   pq:`Errada. Teto é a camada BAIXA que fecha o céu, não a mais alta.`},
  {t:`4.000 ft, a base da camada BKN mais baixa.`, ok:true,
   pq:`Correta. Teto é a altura da base da camada mais baixa que seja BKN ou OVC, ou seja, a partir de 5 oitavos. Aqui, FEW015 e SCT025 não fecham o céu; BKN040 é a primeira que fecha.`},
  {t:`2.500 ft, a média entre as camadas.`, ok:false,
   pq:`Errada. Não se calcula média entre camadas; usa-se a primeira que atinge o critério.`}
 ]},

{id:`MET-32`, m:`MET`, dif:2,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`Num METAR, o que indicam os grupos "25/18" e "Q1013"?`,
 alts:[
  {t:`Visibilidade de 25 km e teto de 1.013 ft.`, ok:false,
   pq:`Errada. Visibilidade tem grupo próprio, em metros, e teto se lê no grupo de nuvens.`},
  {t:`Vento de 25 kt e pressão de 18 inHg.`, ok:false,
   pq:`Errada. Vento tem grupo próprio, terminado em KT, e a pressão em polegadas seria indicada pela letra A, não Q.`},
  {t:`Altitude de 2.500 ft e nível de voo 1.013.`, ok:false,
   pq:`Errada. Não existem esses grupos no código METAR.`},
  {t:`Temperatura de 25 °C, ponto de orvalho de 18 °C e QNH de 1013 hPa.`, ok:true,
   pq:`Correta. A proximidade entre temperatura e ponto de orvalho é dado operacional importante: quanto menor a diferença, mais próximo o ar está da saturação e maior o risco de nevoeiro ou nuvens baixas. Valores negativos aparecem precedidos de M, como M03.`}
 ]},

{id:`MET-33`, m:`MET`, dif:2,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`Num METAR, o grupo de visibilidade aparece como "9999". O que isso significa?`,
 alts:[
  {t:`Visibilidade de 10 km ou mais.`, ok:true,
   pq:`Correta. É o valor máximo codificável no grupo, usado sempre que a visibilidade horizontal atinge ou supera 10 km. É também um dos critérios do CAVOK.`},
  {t:`Visibilidade de 9.999 metros exatos.`, ok:false,
   pq:`Errada na leitura literal. O grupo é um código convencionado, e não uma medição precisa até o último metro.`},
  {t:`Visibilidade indisponível ou não medida.`, ok:false,
   pq:`Errada. Ausência de dado é tratada de outra forma no código.`},
  {t:`Visibilidade reduzida a menos de 1 km.`, ok:false,
   pq:`Errada, e é o oposto. Visibilidade muito baixa se codifica com valores pequenos, como 0500.`}
 ]},

{id:`MET-34`, m:`MET`, dif:3,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`Num TAF, o que indicam os grupos BECMG, TEMPO e PROB?`,
 alts:[
  {t:`São os nomes dos centros meteorológicos que emitiram a previsão.`, ok:false,
   pq:`Errada. O emissor é identificado pelo indicador de localidade no início do boletim.`},
  {t:`BECMG é uma mudança permanente esperada dentro do período indicado; TEMPO são flutuações temporárias, de curta duração; PROB indica a probabilidade percentual de ocorrer a condição descrita.`, ok:true,
   pq:`Correta. A distinção muda a decisão: BECMG significa que a condição nova veio para ficar; TEMPO significa oscilação passageira, tipicamente de menos de uma hora por ocorrência; PROB30 ou PROB40 sinaliza possibilidade, não certeza.`},
  {t:`Indicam, respectivamente, vento, visibilidade e nuvens.`, ok:false,
   pq:`Errada. Esses elementos têm grupos próprios e específicos.`},
  {t:`São graus de confiabilidade do TAF, do mais alto ao mais baixo.`, ok:false,
   pq:`Errada. Não são níveis de confiança do boletim como um todo; são qualificadores de mudanças previstas.`}
 ]},

{id:`MET-35`, m:`MET`, dif:2,
 obj:`Justificar a obrigatoriedade de ser informada à estação rádio de solo, pelo piloto em voo, sempre que julgar essencial à segurança de outros voos, qualquer condição meteorológica potencialmente perigosa encontrada em voo.`,
 p:`O que é um SIGMET e qual sua finalidade?`,
 alts:[
  {t:`Um relatório de condições no aeródromo, emitido a cada 30 minutos.`, ok:false,
   pq:`Errada. Isso descreve o METAR, que é observação de aeródromo.`},
  {t:`A previsão de vento e temperatura em altitude para o planejamento.`, ok:false,
   pq:`Errada. Isso é produto de cartas de vento e temperatura de altitude.`},
