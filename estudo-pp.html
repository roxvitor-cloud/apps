  {t:`Uma informação emitida por centro de vigilância meteorológica sobre fenômenos significativos e perigosos em rota, que possam afetar a segurança das aeronaves.`, ok:true,
   pq:`Correta. Trovoadas fortes, turbulência severa, gelo severo, cinza vulcânica e ciclones tropicais são exemplos. Diferentemente do METAR e do TAF, o SIGMET fala da ROTA, e é por isso que ele é parte do serviço de informação de voo.`},
  {t:`O aviso de tempestade emitido apenas para operações militares.`, ok:false,
   pq:`Errada. O SIGMET é da aviação civil e alcança todas as operações na região de informação de voo.`}
 ]},

{id:`MET-36`, m:`MET`, dif:2,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`Num METAR, o que significam as abreviaturas FG, BR e HZ?`,
 alts:[
  {t:`Congelamento, chuva forte e granizo.`, ok:false,
   pq:`Errada. Granizo é GR e chuva é RA; nenhuma das três siglas do enunciado tem esse significado.`},
  {t:`Frente fria, brisa e alta pressão.`, ok:false,
   pq:`Errada. Sistemas sinóticos não são codificados no grupo de tempo presente do METAR.`},
  {t:`Vento de rajada, turbulência e cisalhamento.`, ok:false,
   pq:`Errada. Rajada é indicada por G no grupo de vento, e cisalhamento por WS.`},
  {t:`Nevoeiro (FG), névoa úmida (BR) e névoa seca (HZ).`, ok:true,
   pq:`Correta, e as três reduzem visibilidade por mecanismos diferentes: FG e BR são gotículas de água, distinguindo-se pelo critério de 1.000 m de visibilidade; HZ é partícula sólida em suspensão — poeira, fumaça, poluição —, típica de ar seco e estável.`}
 ]},

{id:`MET-37`, m:`MET`, dif:2,
 obj:`Identificar e citar a finalidade de cada informe meteorológico.`,
 p:`Num METAR, o grupo de vento aparece como "27015G28KT". Como se lê?`,
 alts:[
  {t:`Vento de 270° verdadeiros, com 15 kt de intensidade e rajadas de 28 kt.`, ok:true,
   pq:`Correta. Três dígitos de direção, dois de intensidade, e a letra G introduzindo a rajada. A diferença entre 15 e 28 kt é grande e tem consequência operacional direta no cálculo de componente de través e na técnica de pouso.`},
  {t:`Vento de 270 kt, com 15 graus de variação e 28 de rajada.`, ok:false,
   pq:`Errada. Nenhum vento de superfície atinge 270 kt; os três primeiros dígitos são sempre direção.`},
  {t:`Vento calmo com rajadas isoladas de 28 kt.`, ok:false,
   pq:`Errada. Vento calmo é codificado como 00000KT.`},
  {t:`Vento de 27 kt vindo de 15° com pressão de 28 hPa.`, ok:false,
   pq:`Errada. A leitura dos campos está trocada e não há grupo de pressão dentro do vento.`}
 ]},

{id:`MET-38`, m:`MET`, dif:3,
 obj:`Identificar os processos e condições que resultam em reduções significativas de visibilidade.`,
 p:`Um METAR mostra temperatura 18 °C e ponto de orvalho 17 °C, ao entardecer, com vento calmo e céu limpo. O que se deve esperar para as próximas horas?`,
 alts:[
  {t:`Aumento da visibilidade, por causa do resfriamento noturno.`, ok:false,
   pq:`Errada. Resfriamento com ar quase saturado produz condensação, e não melhora de visibilidade.`},
  {t:`Risco elevado de formação de nevoeiro de radiação, com queda acentuada da visibilidade.`, ok:true,
   pq:`Correta. A diferença de apenas 1 °C entre temperatura e ponto de orvalho indica ar praticamente saturado. Somando céu limpo, que favorece a perda de calor por irradiação, e vento fraco, que não mistura as camadas, tem-se exatamente a receita do nevoeiro de radiação.`},
  {t:`Formação de trovoadas noturnas.`, ok:false,
   pq:`Errada. Trovoada exige instabilidade e movimento vertical vigoroso; o quadro descrito é de ar estável e calmo.`},
  {t:`Elevação do teto e dissipação das nuvens baixas.`, ok:false,
   pq:`Errada. A tendência é o inverso: condensação junto ao solo.`}
 ]},

{id:`MET-39`, m:`MET`, dif:2,
 obj:`Identificar a validade das informações meteorológicas.`,
 p:`Por que não se deve tomar a decisão de decolar baseando-se apenas no METAR do aeródromo de destino?`,
 alts:[
  {t:`Porque o METAR não informa vento nem visibilidade.`, ok:false,
   pq:`Errada na premissa. O METAR informa justamente vento, visibilidade, nuvens, temperatura e pressão.`},
  {t:`Porque o METAR só é emitido para aeródromos internacionais.`, ok:false,
   pq:`Errada. Muitos aeródromos domésticos com estação meteorológica emitem METAR.`},
  {t:`Porque o METAR descreve o momento da OBSERVAÇÃO, e o pouso ocorrerá no futuro — é preciso somar o TAF, a tendência e as informações de rota.`, ok:true,
   pq:`Correta. Um METAR bom às 12h nada garante sobre as 14h, especialmente em região de convecção de fim de tarde. A decisão madura combina observação, previsão, alternativa e um limite pessoal definido antes de sair.`},
  {t:`Porque o METAR é uma previsão pouco confiável.`, ok:false,
   pq:`Errada na natureza do produto: o METAR não é previsão, é observação — e observação bem feita é confiável para o momento a que se refere.`}
 ]},

{id:`MET-40`, m:`MET`, dif:2,
 obj:`Utilizar as informações meteorológicas concernentes a turbulências.`,
 p:`O que é CISALHAMENTO DO VENTO (wind shear) e por que ele é especialmente perigoso na aproximação final?`,
 alts:[
  {t:`É a variação da pressão com a altitude, corrigida pelo altímetro.`, ok:false,
   pq:`Errada. Isso descreve o funcionamento do altímetro, não o cisalhamento.`},
  {t:`É o atrito do ar com a superfície da asa.`, ok:false,
   pq:`Errada. Isso é arrasto de atrito superficial, fenômeno aerodinâmico local.`},
  {t:`É a diferença entre a velocidade indicada e a verdadeira.`, ok:false,
   pq:`Errada. Essa diferença decorre da densidade do ar e não tem relação com cisalhamento.`},
  {t:`É a variação súbita da direção e/ou da intensidade do vento em curta distância, que provoca mudanças bruscas na velocidade indicada e na trajetória, com pouca altura para recuperar.`, ok:true,
   pq:`Correta. Na final a aeronave está lenta, com pouca potência aplicada e baixa. A perda súbita de vento de proa reduz a velocidade indicada e a sustentação de uma vez — e a altura disponível para corrigir é mínima. Associa-se a trovoadas, microexplosões e inversões.`}
 ]}
];

const Q_TV2 = [
{id:`TV-23`, m:`TV`, dif:3,
 obj:`Descrever as peculiaridades do voo em função dos diversos fatores que influenciam a realização das manobras de: decolagem, subida, voo cruzeiro, curvas, descida e pouso.`,
 p:`Qual é a diferença entre Vx e Vy, e quando cada uma é usada?`,
 alts:[
  {t:`Vx é a velocidade de melhor ÂNGULO de subida — mais altura por distância percorrida, usada para transpor obstáculo; Vy é a de melhor RAZÃO de subida — mais altura por tempo, usada para ganhar altitude depressa.`, ok:true,
   pq:`Correta. Vx é sempre menor que Vy ao nível do mar, e as duas convergem à medida que a aeronave sobe, encontrando-se no teto absoluto. Escolher errado tem consequência concreta: subir em Vy com obstáculo à frente pode não limpar o obstáculo.`},
  {t:`Vx é a velocidade máxima de subida e Vy a mínima.`, ok:false,
   pq:`Errada. Nenhuma das duas é máximo ou mínimo de velocidade; ambas são velocidades ótimas para critérios diferentes.`},
  {t:`Vx é para subida com flapes e Vy para subida limpa.`, ok:false,
   pq:`Errada. A configuração de flapes é outra variável; Vx e Vy se distinguem pelo critério otimizado, não pela configuração.`},
  {t:`São a mesma velocidade, com nomes diferentes conforme o fabricante.`, ok:false,
   pq:`Errada. São velocidades distintas e ambas constam do manual da aeronave.`}
 ]},

{id:`TV-24`, m:`TV`, dif:3,
 obj:`Descrever as peculiaridades do voo em função dos diversos fatores que influenciam a realização das manobras de: decolagem, subida, voo cruzeiro, curvas, descida e pouso.`,
 p:`Após uma pane de motor, o que determina a maior DISTÂNCIA de planeio?`,
 alts:[
  {t:`Voar o mais devagar possível, próximo da velocidade de estol.`, ok:false,
   pq:`Errada. Perto do estol o arrasto induzido dispara e a razão de descida piora — perde-se altura sem avançar.`},
  {t:`Manter a velocidade de melhor planeio publicada no manual, que corresponde ao ponto de arrasto total mínimo.`, ok:true,
   pq:`Correta. É o número que se decora antes de precisar dele. Note que a velocidade de melhor planeio varia com o PESO — mais leve, um pouco menor — e que vento de proa ou de cauda desloca a velocidade ótima para o alcance sobre o solo.`},
  {t:`Voar o mais rápido possível, para chegar antes ao campo escolhido.`, ok:false,
   pq:`Errada. Em alta velocidade o arrasto parasita cresce com o quadrado da velocidade, e a aeronave desce muito mais rápido.`},
  {t:`Depende apenas da altitude em que a pane ocorreu.`, ok:false,
   pq:`Errada. A altitude determina quanto tempo e quanta distância você tem, mas a EFICIÊNCIA do planeio depende da velocidade voada.`}
 ]},

{id:`TV-25`, m:`TV`, dif:3,
 obj:`Descrever as características das atitudes anormais, em especial, os “parafusos”.`,
 p:`Qual é a diferença entre PARAFUSO e MERGULHO EM ESPIRAL, e por que confundi-los é perigoso?`,
 alts:[
  {t:`São o mesmo fenômeno; a diferença é apenas o sentido da rotação.`, ok:false,
   pq:`Errada. São situações aerodinamicamente distintas e com recuperações diferentes.`},
  {t:`O parafuso ocorre só em aeronaves acrobáticas e o espiral só em aeronaves de treinamento.`, ok:false,
   pq:`Errada. Ambos podem ocorrer em qualquer aeronave, e várias aeronaves leves não são certificadas para recuperação de parafuso.`},
  {t:`No parafuso a asa está ESTOLADA e a velocidade permanece baixa e estável; no mergulho em espiral a asa NÃO está estolada e a velocidade aumenta rapidamente. Confundi-los é perigoso porque puxar o manche num espiral aumenta o fator de carga e pode romper a estrutura.`, ok:true,
   pq:`Correta. O indicador mais confiável é o velocímetro: velocidade baixa e travada indica parafuso; velocidade crescendo depressa indica espiral. No espiral, a recuperação começa reduzindo potência e NIVELANDO AS ASAS antes de cabrar.`},
  {t:`No parafuso a velocidade aumenta muito e no espiral ela cai.`, ok:false,
   pq:`Errada — está exatamente invertido, e essa inversão é o que leva à quebra estrutural.`}
 ]},

{id:`TV-26`, m:`TV`, dif:2,
 obj:`Utilizar corretamente os gráficos e tabelas com as limitações e performances de uma aeronave para planejamento de voo.`,
 p:`Como o aumento de PESO afeta o desempenho de decolagem e a velocidade de estol?`,
 alts:[
  {t:`Reduz a corrida de decolagem e diminui a velocidade de estol.`, ok:false,
   pq:`Errada nos dois pontos, e é a inversão completa dos efeitos.`},
  {t:`Não afeta nenhum dos dois, desde que dentro do peso máximo.`, ok:false,
   pq:`Errada. Estar dentro do limite significa que a operação é segura, não que o desempenho é o mesmo — os gráficos do manual trazem correções justamente por peso.`},
  {t:`Aumenta a corrida de decolagem mas não altera a velocidade de estol.`, ok:false,
   pq:`Errada quanto ao estol. A velocidade de estol varia com a raiz quadrada do peso, e a marcação no velocímetro é válida apenas para o peso máximo.`},
  {t:`Aumenta a corrida de decolagem, reduz a razão de subida e AUMENTA a velocidade de estol.`, ok:true,
   pq:`Correta. Mais peso exige mais sustentação, que exige mais velocidade. O efeito combinado é perverso: você precisa de mais pista para acelerar até uma velocidade maior, e depois sobe menos. Em dia quente e pista curta, é a soma que causa acidentes.`}
 ]},

{id:`TV-27`, m:`TV`, dif:3,
 obj:`Descrever as peculiaridades do voo em função dos diversos fatores que influenciam a realização das manobras de: decolagem, subida, voo cruzeiro, curvas, descida e pouso.`,
 p:`O vento na pista 09 é informado como 060° com 20 kt. Qual é, aproximadamente, a componente de TRAVÉS?`,
 alts:[
  {t:`Cerca de 10 kt, já que o ângulo entre o vento e a pista é de 30°.`, ok:true,
   pq:`Correta. Pista 09 tem direção 090°; vento de 060° faz 30° com ela. A componente de través é a intensidade multiplicada pelo seno do ângulo: sen 30° = 0,5, logo 20 × 0,5 = 10 kt. Regra prática útil: 30° dá metade, 45° dá cerca de 70%, e 60° ou mais dá praticamente tudo.`},
  {t:`Cerca de 20 kt, porque toda a intensidade age de través.`, ok:false,
   pq:`Errada. A componente total só seria de través se o vento fosse perpendicular à pista, ou seja, a 90° dela.`},
  {t:`Zero, porque o vento é de proa.`, ok:false,
   pq:`Errada. Vento exatamente de proa exigiria direção 090°; a 060° há componente lateral.`},
  {t:`Cerca de 17 kt.`, ok:false,
   pq:`Errada — esse é o valor da componente de PROA (20 × cos 30° ≈ 17 kt), e não a de través.`}
 ]},

{id:`TV-28`, m:`TV`, dif:2,
 obj:`Identificar as forças que atuam sobre uma aeronave em voo, bem como os fatores que nelas influem.`,
 p:`O que é a ESTEIRA DE TURBULÊNCIA e como o piloto de uma aeronave leve deve se proteger dela?`,
 alts:[
  {t:`É a turbulência causada pelo escapamento do motor; basta manter distância lateral.`, ok:false,
   pq:`Errada quanto à origem. A esteira é fenômeno aerodinâmico das pontas de asa, e não do escapamento.`},
  {t:`São vórtices gerados nas pontas das asas como subproduto da sustentação; a proteção é evitar a esteira de aeronaves maiores, pousando ALÉM do ponto de toque delas e decolando ANTES do ponto de rotação delas, e respeitando os tempos de espera.`, ok:true,
   pq:`Correta. Os vórtices descem e se afastam lateralmente, e são mais intensos quando a aeronave geradora está pesada, lenta e limpa — exatamente a condição de decolagem e de aproximação final. Por isso as regras de separação existem, e por isso não se corta a esteira mesmo com pista livre.`},
  {t:`É o rastro de condensação visível em altitude, inofensivo para o voo.`, ok:false,
   pq:`Errada. Rastro de condensação é fenômeno visual; a esteira é um par de vórtices capaz de rolar uma aeronave leve para além do controle.`},
  {t:`É a turbulência gerada pelo vento cruzando obstáculos próximos à pista.`, ok:false,
   pq:`Errada. Isso é turbulência mecânica, causada pelo terreno e por edificações.`}
 ]},

{id:`TV-29`, m:`TV`, dif:2,
 obj:`Identificar as forças que agem sobre um corpo no ar.`,
 p:`Por que asas de grande ALONGAMENTO (envergadura grande em relação à corda) são mais eficientes?`,
 alts:[
  {t:`Porque têm menos área e portanto menos peso.`, ok:false,
   pq:`Errada. Alongamento é uma relação de forma, e não implica menor área nem menor peso.`},
  {t:`Porque suportam maior fator de carga.`, ok:false,
   pq:`Errada, e em geral é o oposto: asas longas e finas têm momento fletor maior na raiz e costumam ser limitadas estruturalmente.`},
  {t:`Porque reduzem o arrasto INDUZIDO: as pontas ficam mais afastadas e os vórtices influenciam uma parcela menor da asa.`, ok:true,
   pq:`Correta. É por isso que planadores têm asas longas e estreitas — eles vivem de eficiência em baixa velocidade, onde o induzido domina. O preço é estrutural e de manobrabilidade em rolagem.`},
  {t:`Porque permitem velocidades supersônicas.`, ok:false,
   pq:`Errada. Voo supersônico pede o contrário: asas de baixo alongamento e enflechadas.`}
 ]},

{id:`TV-30`, m:`TV`, dif:2,
 obj:`Identificar os princípios de funcionamento dos comandos (ou controles) de voo nas manobras das aeronaves.`,
 p:`O que indica a "bola" do indicador de curva e derrapagem, e como se corrige um desvio?`,
 alts:[
  {t:`Indica a inclinação da aeronave; corrige-se com aileron.`, ok:false,
   pq:`Errada. Inclinação é indicada pelo ponteiro ou pelo horizonte artificial; a bola trata de coordenação.`},
  {t:`Indica a velocidade da curva; corrige-se com potência.`, ok:false,
   pq:`Errada. A razão de curva é indicada pelo ponteiro do instrumento, não pela bola.`},
  {t:`Indica a altitude na curva; corrige-se com profundor.`, ok:false,
   pq:`Errada. Altitude é lida no altímetro.`},
  {t:`Indica a coordenação da curva; se a bola está deslocada, aplica-se pé do MESMO lado para onde ela se deslocou.`, ok:true,
   pq:`Correta. A regra prática é literal: "pise na bola". Bola para a esquerda pede pé esquerdo. Voar descoordenado em baixa velocidade é a condição que transforma um estol em parafuso — daí a insistência na curva de base para final.`}
 ]},

{id:`TV-31`, m:`TV`, dif:2,
 obj:`Descrever o comportamento da estabilidade do avião em função das variações de potência e de altitude.`,
 p:`Numa aeronave convencional, o que acontece com a atitude de arfagem ao se AUMENTAR a potência em voo nivelado e trimado?`,
 alts:[
  {t:`O nariz tende a SUBIR, tanto pelo aumento da velocidade quanto pelo momento de arfagem gerado pela linha de tração e pelo fluxo da hélice sobre a empenagem.`, ok:true,
   pq:`Correta, e daí a regra de cabine: potência e arfagem andam juntas. Aumentou potência, o nariz sobe; reduziu, o nariz desce. Antecipar isso com o profundor, e depois retrimar, é o que mantém a altitude estável.`},
  {t:`O nariz tende a baixar, pela maior velocidade.`, ok:false,
   pq:`Errada para a configuração convencional, com motor à frente e linha de tração abaixo do CG.`},
  {t:`Nada acontece, porque o avião está trimado.`, ok:false,
   pq:`Errada. O trim equilibra a condição anterior; mudar a potência muda os momentos e desfaz o equilíbrio.`},
  {t:`A aeronave rola para a direita.`, ok:false,
   pq:`Errada. O efeito de torque tende a rolar para a esquerda em hélice que gira no sentido horário, e de todo modo o efeito predominante em arfagem é o descrito.`}
 ]},

{id:`TV-32`, m:`TV`, dif:3,
 obj:`Reconhecer a importância do CG na estabilidade da aeronave e os limites do CG que uma aeronave pode suportar.`,
 p:`Quais são as consequências de operar com o CG ADIANTADO além do limite dianteiro?`,
 alts:[
  {t:`Menor estabilidade e resposta muito sensível em arfagem.`, ok:false,
   pq:`Errada — isso descreve o CG ATRASADO além do limite traseiro.`},
  {t:`Maior estabilidade longitudinal, comandos mais pesados em arfagem, maior velocidade de estol e dificuldade para cabrar no flare.`, ok:true,
   pq:`Correta. O CG dianteiro exige mais força de compensação para baixo no estabilizador, o que soma carga à asa: a aeronave se comporta como se estivesse mais pesada. O sintoma clássico é não conseguir levantar o nariz o suficiente no flare, resultando em toque com a bequilha.`},
  {t:`Redução da velocidade de estol e melhora do desempenho de subida.`, ok:false,
   pq:`Errada. O CG dianteiro AUMENTA a velocidade de estol e piora o desempenho, por causa do arrasto de compensação.`},
  {t:`Nenhuma, desde que o peso total esteja abaixo do máximo.`, ok:false,
   pq:`Errada. Peso e centragem são limites independentes e ambos precisam ser respeitados.`}
 ]}
];

const Q_NAV2 = [
{id:`NAV-33`, m:`NAV`, dif:3,
 obj:`Efetuar cálculos e conversões aplicáveis à navegação.`,
 p:`Uma aeronave consome 9 galões por hora e leva 48 galões utilizáveis. Descontando uma reserva de 45 minutos, qual é a autonomia utilizável para o planejamento da etapa?`,
 alts:[
  {t:`5 h 20 min`, ok:false,
   pq:`Errada. Esse é o total bruto (48 ÷ 9 = 5,33 h), sem descontar a reserva. Planejar assim é planejar para pousar com os tanques secos.`},
  {t:`4 h 00 min`, ok:false,
   pq:`Errada. Corresponderia a descontar 1 h 20 min, mais que a reserva estabelecida.`},
  {t:`4 h 35 min`, ok:true,
   pq:`Correta. Autonomia bruta = 48 ÷ 9 = 5,33 h = 5 h 20 min. Descontando 45 min de reserva, restam 4 h 35 min. Note que a reserva se desconta em TEMPO, não em galões, porque é assim que se consome combustível.`},
  {t:`5 h 45 min`, ok:false,
   pq:`Errada, e no sentido perigoso: somou-se a reserva em vez de subtraí-la.`}
 ]},

{id:`NAV-34`, m:`NAV`, dif:3,
 obj:`Aplicar os conhecimentos básicos de navegação estimada em planejamentos de voo em rota.`,
 p:`Numa etapa de 180 NM, o piloto planejou GS de 120 kt. Passados 30 minutos, ele confirma ter percorrido apenas 50 NM. Qual o novo tempo total estimado para a etapa?`,
 alts:[
  {t:`1 h 30 min, como planejado.`, ok:false,
   pq:`Errada. O planejamento original supunha 120 kt; a verificação em rota mostrou 100 kt, e ignorar isso é ignorar o dado real.`},
  {t:`2 h 15 min.`, ok:false,
   pq:`Errada. Corresponderia a uma GS de 80 kt, mais lenta do que a medida.`},
  {t:`2 h 00 min.`, ok:false,
   pq:`Errada. Seria a resposta se a GS fosse 90 kt.`},
  {t:`1 h 48 min.`, ok:true,
   pq:`Correta. GS real = 50 NM em 30 min = 100 kt. Tempo total = 180 ÷ 100 = 1,8 h = 1 h 48 min. Ou seja, 18 minutos a mais que o previsto — o que precisa ser conferido contra a autonomia antes de prosseguir.`}
 ]},

{id:`NAV-35`, m:`NAV`, dif:3,
 obj:`Processar informações sobre o vento e seus efeitos imediatos no deslocamento da aeronave, em relação à manutenção da rota pretendida.`,
 p:`Voando com TAS de 100 kt, o piloto precisa corrigir 8° para a direita para manter a rota, e a GS observada é de 92 kt. O que isso indica sobre o vento?`,
 alts:[
  {t:`Vento de proa vindo pela direita: a correção aponta para o lado de onde o vento sopra, e a GS menor que a TAS indica componente de proa.`, ok:true,
   pq:`Correta. São duas leituras independentes que se somam: o ângulo de correção revela de que LADO vem o vento, e a comparação entre GS e TAS revela se ele tem componente de proa ou de cauda. Juntas, permitem estimar a direção aproximada do vento em voo.`},
  {t:`Vento de cauda vindo da esquerda.`, ok:false,
   pq:`Errada em ambos os elementos. Vento de cauda aumentaria a GS acima da TAS, e correção para a direita indica vento vindo da direita.`},
  {t:`Vento calmo; a diferença é erro de instrumento.`, ok:false,
   pq:`Errada. Com vento calmo não haveria correção de deriva a aplicar, e a GS seria igual à TAS.`},
  {t:`Vento de través puro, sem componente longitudinal.`, ok:false,
   pq:`Errada. Vento de través puro deixaria a GS praticamente igual à TAS, e aqui ela caiu 8 kt.`}
 ]},

{id:`NAV-36`, m:`NAV`, dif:2,
 obj:`Identificar e interpretar as simbologias convencionadas nas cartas aeronáuticas.`,
 p:`Ao planejar uma rota VFR, o piloto identifica na carta uma área designada como PROIBIDA. O que isso significa?`,
 alts:[
  {t:`Que o voo é permitido mediante coordenação prévia com o órgão ATS.`, ok:false,
   pq:`Errada. Coordenação prévia ou autorização caracteriza a área RESTRITA, não a proibida.`},
  {t:`Que o voo de aeronaves é vedado naquele volume de espaço aéreo.`, ok:true,
   pq:`Correta. As três categorias que aparecem na carta se distinguem pelo grau: PROIBIDA veda o voo; RESTRITA condiciona a autorização ou requisitos; PERIGOSA não proíbe, mas adverte sobre atividade que representa risco em determinados períodos.`},
  {t:`Que há risco de turbulência na região.`, ok:false,
   pq:`Errada. Fenômenos meteorológicos não são delimitados por áreas designadas em carta desse tipo.`},
  {t:`Que o voo é permitido apenas em IFR.`, ok:false,
   pq:`Errada. A designação não distingue regras de voo; ela veda a operação.`}
 ]},

{id:`NAV-37`, m:`NAV`, dif:2,
 obj:`Utilizar corretamente os elementos básicos de orientação para determinar a posição e a direção da aeronave em relação à superfície da Terra.`,
 p:`Qual é a diferença entre uma área RESTRITA e uma área PERIGOSA na carta aeronáutica?`,
 alts:[
  {t:`A restrita é permanente e a perigosa é temporária.`, ok:false,
   pq:`Errada. Ambas podem ser permanentes ou ativadas por períodos; a diferença não é de duração.`},
  {t:`Na perigosa é proibido voar e na restrita é permitido livremente.`, ok:false,
   pq:`Errada. A vedação absoluta é da área PROIBIDA, e a restrita não é de acesso livre.`},
  {t:`Na restrita o voo é condicionado ao cumprimento de requisitos ou à autorização; na perigosa o voo não é proibido, mas há atividade que representa risco para as aeronaves.`, ok:true,
   pq:`Correta. Na prática: entrar em área restrita sem atender à condição é infração; entrar em área perigosa ativa é legal, porém imprudente. Ambas têm horários e níveis publicados, que precisam ser conferidos antes do voo.`},
  {t:`A restrita se aplica só a aeronaves militares.`, ok:false,
   pq:`Errada. As designações valem para todas as aeronaves, salvo o que a própria publicação estabelecer.`}
 ]},

{id:`NAV-38`, m:`NAV`, dif:3,
 obj:`Efetuar cálculos e conversões aplicáveis à navegação.`,
 p:`Uma aeronave está a 6.000 ft e precisa nivelar a 2.000 ft, mantendo razão de descida de 500 ft/min com GS de 120 kt. A quantos NM do ponto ela deve iniciar a descida?`,
 alts:[
  {t:`4 NM`, ok:false,
   pq:`Errada. Corresponderia a apenas 2 minutos de voo, insuficiente para perder 4.000 ft a 500 ft/min.`},
  {t:`8 NM`, ok:false,
   pq:`Errada. Confundiu-se o tempo em minutos com a distância em milhas; 8 é o TEMPO da descida, não a distância.`},
  {t:`32 NM`, ok:false,
   pq:`Errada. Corresponderia a 16 minutos de descida, o dobro do necessário.`},
  {t:`16 NM`, ok:true,
   pq:`Correta. Perder 4.000 ft a 500 ft/min leva 8 minutos. A 120 kt, ou seja, 2 NM por minuto, são 16 NM. É o cálculo de topo de descida, e vale a pena treiná-lo de cabeça: divide-se a altura a perder pela razão e multiplica-se pelo NM por minuto.`}
 ]},

{id:`NAV-39`, m:`NAV`, dif:2,
 obj:`Descrever o funcionamento dos instrumentos básicos de navegação.`,
 p:`Por que o GPS, embora preciso, não dispensa a navegação por carta e o cálculo estimado no voo VFR?`,
 alts:[
  {t:`Porque ele depende de energia elétrica, de recepção de sinal e de base de dados atualizada — e o piloto precisa ser capaz de continuar navegando se qualquer um dos três falhar.`, ok:true,
   pq:`Correta. A carta, o relógio e a bússola não dependem de nada. Além disso, o GPS informa onde você está, mas não avalia relevo, espaço aéreo e combustível por você — o planejamento continua sendo trabalho do piloto.`},
  {t:`Porque o GPS é proibido em voo VFR.`, ok:false,
   pq:`Errada. Não há proibição; o GPS é auxílio legítimo e amplamente usado.`},
  {t:`Porque o GPS não informa a posição da aeronave.`, ok:false,
   pq:`Errada na premissa: informar posição é exatamente o que ele faz melhor.`},
  {t:`Porque o GPS só funciona acima de 10.000 ft.`, ok:false,
   pq:`Errada. Não há tal limitação de altitude para a recepção do sinal.`}
 ]},

{id:`NAV-40`, m:`NAV`, dif:2,
 obj:`Identificar os instrumentos básicos de navegação aérea.`,
 p:`O que é a DERIVA e como ela se relaciona com o ângulo de correção aplicado pelo piloto?`,
 alts:[
  {t:`Deriva é a diferença entre a velocidade indicada e a verdadeira.`, ok:false,
   pq:`Errada. Essa diferença decorre da densidade do ar e não tem relação com o vento lateral.`},
  {t:`Deriva é o ângulo entre a proa e a rota efetiva, causado pelo vento; o ângulo de correção é aplicado no sentido OPOSTO ao da deriva, apontando o nariz para o lado de onde o vento vem.`, ok:true,
   pq:`Correta. Os dois ângulos têm a mesma magnitude e sinais opostos. Se o vento tende a levar a aeronave 8° para a direita da rota, corrige-se 8° para a esquerda — e o resultado é voar de nariz torto, mas sobre a linha desejada.`},
  {t:`Deriva é o erro da bússola causado pela estrutura da aeronave.`, ok:false,
   pq:`Errada. Isso é o desvio da bússola, corrigido pelo cartão de compensação.`},
  {t:`Deriva é a perda de altitude durante uma curva.`, ok:false,
   pq:`Errada. Perda de altitude em curva é consequência de sustentação vertical insuficiente, não de deriva.`}
 ]}
];
/* =====================================================================
   NAV — NAVEGAÇÃO, ênfase VFR
   Objetivos: Apêndice D da IS 00-003H, seção
   "NAV - NAVEGAÇÃO - EXAMES: PPA, PPL E CPA"
   Matéria com o DOBRO do tempo de prova (60 min) — por isso é a mais
   representada neste banco.
   Questões ORIGINAIS. Nenhuma copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_NAV = [
{id:`NAV-01`, m:`NAV`, dif:1,
 obj:`Enumerar os diferentes métodos de navegação.`,
 p:`Um piloto privado voa VFR acompanhando rios, estradas e cidades na carta, sem uso de rádio-auxílio nem cálculo prévio de proas. Que método de navegação ele está empregando?`,
 alts:[
  {t:`Navegação estimada, baseada em proa, velocidade e tempo decorrido.`, ok:false,
   pq:`Errada. A navegação estimada calcula a posição a partir de proa, velocidade, vento e tempo — sem depender de ver o solo. No enunciado o piloto está justamente olhando para fora, não calculando.`},
  {t:`Radionavegação, baseada em auxílios de solo como VOR e NDB.`, ok:false,
   pq:`Errada. O enunciado diz explicitamente que não há uso de rádio-auxílio. Radionavegação exige equipamento embarcado e estações de solo.`},
  {t:`Navegação observada (pilotagem), baseada na comparação entre a carta e os acidentes geográficos visíveis.`, ok:true,
   pq:`Correta. A navegação observada, ou pilotagem, usa referências visuais no terreno confrontadas com a carta. É o método básico do VFR e o primeiro que o aluno domina.`},
  {t:`Navegação astronômica, baseada na observação de corpos celestes.`, ok:false,
   pq:`Errada. A navegação astronômica usa sextante e efemérides para obter posição a partir de astros. Não tem relação com seguir rios e estradas.`}
 ]},

{id:`NAV-02`, m:`NAV`, dif:2,
 obj:`Enumerar os diferentes métodos de navegação.`,
 p:`Qual é a principal limitação da navegação ESTIMADA quando usada isoladamente em um voo longo?`,
 alts:[
  {t:`Ela só funciona sobre o mar, onde não há acidentes geográficos.`, ok:false,
   pq:`Errada. A estimada funciona sobre qualquer terreno; sobre o mar ela é mais NECESSÁRIA por falta de referências, mas isso não é limitação, é aplicação.`},
  {t:`Ela exige equipamento de rádio embarcado que muitos monomotores não têm.`, ok:false,
   pq:`Errada. A estimada é feita com carta, computador de voo, relógio e bússola. Justamente por não depender de rádio é que ela continua sendo ensinada.`},
  {t:`Ela não permite calcular o consumo de combustível.`, ok:false,
   pq:`Errada, e ao contrário: como a estimada trabalha com tempo de voo em cada perna, ela é exatamente a base do cálculo de combustível no plano de voo.`},
  {t:`O erro se acumula ao longo do tempo, porque qualquer imprecisão na estimativa de vento, proa ou velocidade se propaga e cresce.`, ok:true,
   pq:`Correta. A estimada calcula cada posição a partir da anterior. Um erro de 5° na proa ou de 10 kt no vento não se corrige sozinho: ele vai somando quilômetro após quilômetro. Por isso a estimada precisa ser periodicamente reancorada por observação do terreno ou por rádio-auxílio.`}
 ]},

{id:`NAV-03`, m:`NAV`, dif:2,
 obj:`Reconhecer as nomenclaturas convencionadas e utilizadas pela geografia para fins de localização e deslocamento sobre o globo terrestre.`,
 p:`Sobre meridianos e paralelos, qual afirmação está correta?`,
 alts:[
  {t:`Todos os meridianos são círculos máximos e convergem nos polos; entre os paralelos, apenas o Equador é círculo máximo.`, ok:true,
   pq:`Correta. Um círculo máximo tem seu centro no centro da Terra. Todo meridiano (com seu antimeridiano) satisfaz isso. Entre os paralelos, só o Equador; os demais são círculos menores, cada vez mais curtos em direção aos polos.`},
  {t:`Todos os paralelos são círculos máximos e os meridianos são círculos menores.`, ok:false,
   pq:`Errada, é a inversão completa. Basta pensar no paralelo de 89° de latitude: um circulozinho em torno do polo, evidentemente não um círculo máximo.`},
  {t:`Meridianos e paralelos são todos círculos máximos, por isso formam a grade de coordenadas.`, ok:false,
   pq:`Errada. A grade funciona independentemente disso; o que define círculo máximo é passar pelo centro da Terra, o que os paralelos, salvo o Equador, não fazem.`},
  {t:`Os meridianos são paralelos entre si e nunca se encontram.`, ok:false,
   pq:`Errada. Meridianos convergem e se encontram nos dois polos. Quem nunca se encontra são os paralelos.`}
 ]},

{id:`NAV-04`, m:`NAV`, dif:2,
 obj:`Identificar as unidades de medidas de distância e de velocidade adotadas pela OACI.`,
 p:`A milha náutica, unidade de distância adotada na aviação, corresponde a qual medida e a que grandeza geográfica ela está associada?`,
 alts:[
  {t:`1.609 metros, correspondendo a um minuto de longitude.`, ok:false,
   pq:`Errada duas vezes. 1.609 m é a milha terrestre (statute mile), e o minuto de longitude só vale 1 NM sobre o Equador, encurtando conforme se afasta dele.`},
  {t:`1.852 metros, correspondendo ao comprimento de um minuto de arco de círculo máximo — por exemplo, um minuto de latitude.`, ok:true,
   pq:`Correta. É por causa dessa associação que se pode medir distância diretamente na escala de latitude da carta: 1 minuto de latitude = 1 NM. Note que a mesma regra NÃO vale para longitude, cujos minutos encurtam com a latitude.`},
  {t:`1.000 metros, por definição do sistema métrico.`, ok:false,
   pq:`Errada. Mil metros é o quilômetro. A milha náutica é maior, com 1.852 m, e não pertence ao sistema métrico.`},
  {t:`1.852 metros, correspondendo a um grau de latitude.`, ok:false,
   pq:`Errada na grandeza. Um GRAU de latitude corresponde a 60 NM, porque tem 60 minutos. A milha náutica equivale a um MINUTO.`}
 ]},

{id:`NAV-05`, m:`NAV`, dif:2,
 obj:`Efetuar cálculos e conversões aplicáveis à navegação.`,
 p:`Uma aeronave percorre 135 NM em 45 minutos. Qual é a sua velocidade em relação ao solo?`,
 alts:[
  {t:`135 kt`, ok:false,
   pq:`Errada. Repetiu-se a distância como se o tempo fosse uma hora cheia. O voo durou 45 minutos, então a velocidade horária é necessariamente maior que 135.`},
  {t:`101 kt`, ok:false,
   pq:`Errada. Esse valor sai de multiplicar 135 por 0,75 em vez de dividir — a operação foi invertida. Multiplicar reduziria a velocidade, o que não faz sentido para um trecho voado em menos de uma hora.`},
  {t:`180 kt`, ok:true,
   pq:`Correta. GS = distância ÷ tempo. 45 min = 0,75 h; 135 ÷ 0,75 = 180 kt. Outra forma: em 45 min percorreu 135 NM, logo em 15 min percorre 45 NM, e em 60 min percorre 180 NM.`},
  {t:`3 kt`, ok:false,
   pq:`Errada. Aqui se dividiu 135 por 45 tratando os minutos como se fossem horas. O resultado, 3 NM por minuto, está certo como taxa por minuto — mas a resposta pede a velocidade horária, que é 3 × 60 = 180 kt.`}
 ]},

{id:`NAV-06`, m:`NAV`, dif:2,
 obj:`Efetuar cálculos e conversões aplicáveis à navegação.`,
 p:`Um voo tem 240 NM e a velocidade no solo estimada é de 96 kt. Qual o tempo de voo previsto?`,
 alts:[
  {t:`2 h 05 min`, ok:false,
   pq:`Errada. É exatamente o erro de ler o resultado decimal 2,5 como duas horas e cinco minutos. Meia hora são 30 minutos, não 5.`},
  {t:`2 h 40 min`, ok:false,
   pq:`Errada. Corresponderia a 2,67 h, o que daria uma GS de cerca de 90 kt. Não bate com os dados.`},
  {t:`4 h 00 min`, ok:false,
   pq:`Errada. Esse tempo sai de dividir por 60 em vez de dividir pela velocidade no solo. Confundir a base de tempo com a velocidade é armadilha frequente no computador de voo.`},
  {t:`2 h 30 min`, ok:true,
   pq:`Correta. Tempo = distância ÷ GS = 240 ÷ 96 = 2,5 h, ou seja, 2 h 30 min. Cuidado clássico: 2,5 h não é 2 h 5 min — a parte decimal precisa ser convertida (0,5 × 60 = 30 min).`}
 ]},

{id:`NAV-07`, m:`NAV`, dif:2,
 obj:`Descrever a teoria das projeções e os tipos comumente utilizados para a confecção de cartas e mapas terrestres para fins aeronáuticos.`,
 p:`Na projeção de MERCATOR, qual é a propriedade que a tornou tradicionalmente útil para navegação, e qual sua principal distorção?`,
 alts:[
  {t:`A loxodromia é representada por uma linha reta, o que facilita traçar rumo constante; em compensação, as distâncias e áreas ficam cada vez mais exageradas conforme se afasta do Equador.`, ok:true,
   pq:`Correta. Mercator é cilíndrica e conforme: preserva ângulos, e por isso a linha de rumo constante vira reta. O preço é o esticamento crescente com a latitude, que torna as medidas de distância pouco confiáveis longe do Equador.`},
  {t:`A ortodromia é representada por uma linha reta, permitindo medir a menor distância diretamente com a régua.`, ok:false,
   pq:`Errada — essa propriedade é aproximadamente a da projeção cônica conforme de LAMBERT, não da Mercator. Na Mercator a ortodromia aparece curvada.`},
  {t:`Ela preserva simultaneamente áreas, ângulos e distâncias, sem distorção.`, ok:false,
   pq:`Errada, e impossível. Nenhuma projeção plana de uma superfície esférica preserva tudo ao mesmo tempo; toda projeção escolhe o que sacrificar.`},
  {t:`Ela é a projeção padrão das cartas de navegação visual brasileiras em baixa altitude.`, ok:false,
   pq:`Errada. As cartas aeronáuticas de rota e visuais usadas em latitudes médias baseiam-se tipicamente na cônica conforme de Lambert, justamente por manter escala mais constante.`}
 ]},

{id:`NAV-08`, m:`NAV`, dif:2,
 obj:`Ortodromia e loxodromia – caracterização e aplicação.`,
 p:`Qual é a diferença essencial entre ORTODROMIA e LOXODROMIA?`,
 alts:[
  {t:`A loxodromia é o menor caminho e a ortodromia é a linha de rumo constante.`, ok:false,
   pq:`Errada — os conceitos estão trocados. Menor caminho é sempre a ortodromia.`},
  {t:`A ortodromia é o menor caminho entre dois pontos sobre a esfera, mas cruza os meridianos com ângulos variáveis; a loxodromia cruza todos os meridianos com o mesmo ângulo, sendo mais longa.`, ok:true,
   pq:`Correta. A ortodromia é o arco de círculo máximo — menor distância, porém exige alterar a proa continuamente. A loxodromia mantém rumo constante, é mais simples de voar, e paga isso com distância maior. Em pernas curtas de voo VFR a diferença é desprezível.`},
  {t:`Ortodromia é a rota sobre o mar e loxodromia é a rota sobre o continente.`, ok:false,
   pq:`Errada. Os termos são geométricos, não geográficos; ambos se aplicam sobre qualquer superfície.`},
  {t:`As duas coincidem sempre, mudando apenas o nome conforme a projeção usada.`, ok:false,
   pq:`Errada em geral. Elas coincidem apenas em dois casos particulares: ao longo do Equador e ao longo de um meridiano. Em qualquer outra direção são linhas distintas.`}
 ]},

{id:`NAV-09`, m:`NAV`, dif:2,
 obj:`Conceituar magnetismo e descrever seus efeitos e sua influência na navegação aérea.`,
 p:`O que é a DECLINAÇÃO MAGNÉTICA (variação magnética, ou Dmg) e como ela é representada na carta?`,
 alts:[
  {t:`É o erro da bússola causado pelos campos magnéticos da própria aeronave.`, ok:false,
   pq:`Errada — isso é o DESVIO da bússola, que é específico daquela aeronave, muda conforme a proa e é compensado por um cartão de correção afixado junto ao instrumento.`},
  {t:`É a inclinação da agulha em relação ao plano horizontal, maior perto dos polos.`, ok:false,
   pq:`Errada — esse fenômeno é a inclinação magnética (dip), que causa os erros de aceleração e de curva da bússola, mas não é a declinação.`},
  {t:`É o ângulo entre o norte verdadeiro e o norte magnético em um dado ponto, representado na carta por linhas isogônicas.`, ok:true,
   pq:`Correta. O polo magnético não coincide com o geográfico, e a diferença varia de lugar para lugar e ao longo dos anos. As linhas que unem pontos de mesma declinação são as isogônicas; a linha de declinação zero é a agônica.`},
  {t:`É a diferença entre a proa e a rota efetiva sobre o solo, causada pelo vento.`, ok:false,
   pq:`Errada — isso é a DERIVA, fenômeno aerodinâmico ligado ao vento, sem nenhuma relação com magnetismo.`}
 ]},

{id:`NAV-10`, m:`NAV`, dif:3,
 obj:`Aplicar os conhecimentos sobre Dmg e desvio de bússola na determinação de proas e rumos.`,
 p:`Uma rota verdadeira medida na carta é 090°. A declinação magnética local é 20° Oeste. Qual é a rota magnética?`,
 alts:[
  {t:`070°`, ok:false,
   pq:`Errada — a declinação foi subtraída, o que seria correto apenas se ela fosse Leste. Com declinação Oeste, o valor magnético é maior que o verdadeiro.`},
  {t:`090°, porque a declinação só afeta a proa, não a rota.`, ok:false,
   pq:`Errada. A declinação afeta igualmente proas e rotas: ela decorre da referência de norte utilizada, e não do fato de haver ou não vento.`},
  {t:`020°`, ok:false,
   pq:`Errada. Aqui se usou o valor da declinação como se fosse a própria resposta, ignorando a rota verdadeira de partida.`},
  {t:`110°`, ok:true,
   pq:`Correta. Na conversão de verdadeiro para magnético, declinação Oeste se SOMA e declinação Leste se SUBTRAI. Logo 090° + 20° = 110°. Boa parte do território brasileiro tem declinação oeste, então esse é o caso comum aqui.`}
 ]},

{id:`NAV-11`, m:`NAV`, dif:3,
 obj:`Aplicar os conhecimentos sobre Dmg e desvio de bússola na determinação de proas e rumos.`,
 p:`A proa magnética calculada é 250°. O cartão de correção da bússola indica, para essa região do mostrador, desvio de −3°. Qual proa deve ser lida na bússola?`,
 alts:[
  {t:`253°`, ok:true,
   pq:`Correta. O desvio converte magnético em bússola. Com desvio negativo de 3°, a bússola indica 3° a MENOS que o magnético real; para efetivamente voar 250° magnéticos, é preciso ler 253° no instrumento. A sequência completa é verdadeiro → magnético (declinação) → bússola (desvio).`},
  {t:`247°`, ok:false,
   pq:`Errada — o sinal foi aplicado no sentido contrário. Subtrair o desvio negativo faria a aeronave voar uma proa magnética diferente da pretendida.`},
  {t:`250°, porque o desvio da bússola só é considerado em voo por instrumentos.`, ok:false,
   pq:`Errada. O desvio é uma característica física da instalação e existe em qualquer regra de voo. É justamente no VFR, com navegação por bússola e cronômetro, que ele mais importa.`},
  {t:`3°, que é o próprio valor do desvio.`, ok:false,
   pq:`Errada. O desvio é uma correção a aplicar sobre a proa, não uma proa em si.`}
 ]},

{id:`NAV-12`, m:`NAV`, dif:2,
 obj:`Conceituar os indicadores de direção aplicada à navegação aérea.`,
 p:`Qual é a diferença entre PROA e ROTA (rumo efetivo sobre o solo)?`,
 alts:[
  {t:`São sinônimos; a diferença é apenas se a referência é o norte verdadeiro ou o magnético.`, ok:false,
   pq:`Errada. A referência de norte gera os qualificativos verdadeiro/magnético, que se aplicam tanto a proas quanto a rotas. A distinção entre proa e rota é outra: aponta versus percorre.`},
  {t:`Proa é a direção para onde aponta o eixo longitudinal da aeronave; rota é a trajetória efetivamente percorrida sobre o solo. O ângulo entre elas é a deriva, causada pelo vento.`, ok:true,
   pq:`Correta. Com vento de través, a aeronave voa "de lado": o nariz aponta para um lado (proa) e ela se desloca para outro (rota). Corrigir a deriva é ajustar a proa de modo que a rota resultante seja a desejada.`},
  {t:`Proa é medida em graus e rota é medida em milhas náuticas.`, ok:false,
   pq:`Errada. Ambas são direções, medidas em graus. Milha náutica é unidade de distância.`},
  {t:`Proa se usa no VFR e rota se usa no IFR.`, ok:false,
   pq:`Errada. Os dois conceitos são usados em qualquer regra de voo; nada os vincula a VFR ou IFR.`}
 ]},

{id:`NAV-13`, m:`NAV`, dif:3,
 obj:`Processar informações sobre o vento e seus efeitos imediatos no deslocamento da aeronave, em relação à manutenção da rota pretendida.`,
 p:`Uma aeronave voa com TAS de 100 kt em rota de 360°, com vento de 090° a 20 kt. Qualitativamente, o que acontece com a rota e a velocidade no solo se o piloto mantiver a proa em 360°?`,
 alts:[
  {t:`A aeronave será empurrada para leste e a velocidade no solo cairá para cerca de 80 kt.`, ok:false,
   pq:`Errada nas duas partes. Vento é sempre nomeado pela direção DE ONDE sopra: 090° vem do leste, portanto empurra para oeste. E, sendo de través, quase não altera a GS.`},
  {t:`A velocidade no solo subirá para cerca de 120 kt, por causa do vento de cauda.`, ok:false,
   pq:`Errada. Vento de cauda para uma rota 360° viria de 180°, do sul. Vento de 090° é de través, não de cauda.`},
  {t:`A aeronave será empurrada para oeste, e a velocidade no solo ficará praticamente igual à TAS, porque o vento é essencialmente de través.`, ok:true,
   pq:`Correta. Vento de 090° sopra DE leste PARA oeste, empurrando a aeronave para a esquerda de quem voa rumo ao norte. Como o vento é perpendicular à rota, a componente de proa/cauda é próxima de zero, e a GS fica quase igual à TAS. Para manter a rota 360° seria necessário corrigir a proa alguns graus para a direita, na direção de onde o vento vem.`},
  {t:`Nada muda: com a proa mantida, a aeronave continuará exatamente sobre a rota 360°.`, ok:false,
   pq:`Errada. Manter a proa não mantém a rota quando há vento de través — é exatamente esse o efeito da deriva, e ignorá-lo é a causa clássica de se chegar deslocado do destino.`}
 ]},

{id:`NAV-14`, m:`NAV`, dif:2,
 obj:`Demonstrar a correta utilização de computadores de voo na obtenção de dados e na resolução de problemas de aeronavegação.`,
 p:`No computador de voo circular (tipo E6-B), qual é a função do lado do disco que possui a janela deslizante e a grade de vento?`,
 alts:[
  {t:`Converter unidades de temperatura entre Celsius e Fahrenheit.`, ok:false,
   pq:`Errada. As conversões de temperatura e unidades ficam no lado circular de cálculo, não na grade de vento.`},
  {t:`Calcular peso e balanceamento da aeronave.`, ok:false,
   pq:`Errada. Peso e balanceamento se resolvem com os gráficos e tabelas do manual da aeronave, não com o computador de voo.`},
  {t:`Determinar a declinação magnética local.`, ok:false,
   pq:`Errada. A declinação é lida na carta, nas linhas isogônicas. Nenhum computador de voo a calcula.`},
  {t:`Resolver o triângulo de velocidades: a partir de rota, TAS e vento, obter proa a manter, deriva e velocidade no solo.`, ok:true,
   pq:`Correta. Esse é o lado do vento. O outro lado, o das escalas circulares, é uma régua de cálculo para proporções: tempo, distância, velocidade, consumo e conversões de unidade.`}
 ]},

{id:`NAV-15`, m:`NAV`, dif:2,
 obj:`Identificar as diferentes formas de se obter a velocidade de deslocamento de uma aeronave no ar.`,
 p:`Qual é a relação correta entre as velocidades IAS, CAS, TAS e GS?`,
 alts:[
  {t:`IAS é a leitura do instrumento; CAS é a IAS corrigida dos erros de instalação e instrumento; TAS é a CAS corrigida de densidade (altitude e temperatura); GS é a TAS combinada com o vento.`, ok:true,
   pq:`Correta. Essa é a cadeia completa. Note a consequência prática: em altitude a TAS é maior que a IAS, e a GS pode ser maior ou menor que a TAS conforme o vento seja de cauda ou de proa.`},
  {t:`Todas são iguais em voo nivelado; só diferem durante subida e descida.`, ok:false,
   pq:`Errada. As diferenças vêm de erros de instalação, densidade do ar e vento — nenhum deles depende de a aeronave estar subindo ou nivelada.`},
  {t:`A TAS é sempre menor que a IAS, porque o ar em altitude oferece menos resistência.`, ok:false,
   pq:`Errada, e invertida. Justamente porque o ar é menos denso, o anemômetro subestima: a TAS fica MAIOR que a IAS, cerca de 2% a mais por 1.000 ft de altitude.`},
  {t:`A GS é obtida diretamente no anemômetro da aeronave.`, ok:false,
   pq:`Errada. O anemômetro mede pressão dinâmica do ar, e portanto entrega IAS. A GS depende do vento e se obtém por cálculo, por GPS ou por cronometragem entre pontos conhecidos.`}
 ]},

{id:`NAV-16`, m:`NAV`, dif:3,
 obj:`Identificar as diferentes formas de se obter a velocidade de deslocamento de uma aeronave no ar.`,
 p:`Uma aeronave voa a 8.000 ft com IAS de 110 kt, em condições próximas da ISA. Qual é a estimativa mais razoável da TAS?`,
 alts:[
  {t:`Aproximadamente 110 kt, porque IAS e TAS coincidem abaixo de 10.000 ft.`, ok:false,
   pq:`Errada. Não existe esse limiar. IAS e TAS só coincidem ao nível do mar em condições padrão; a partir dali a diferença cresce continuamente com a altitude.`},
  {t:`Aproximadamente 128 kt`, ok:true,
   pq:`Correta pela regra prática de 2% por 1.000 ft: 8 × 2% = 16% de acréscimo. 110 × 1,16 ≈ 128 kt. É aproximação, mas suficiente para planejamento VFR e para conferir o resultado do computador de voo.`},
  {t:`Aproximadamente 92 kt`, ok:false,
   pq:`Errada, e no sentido contrário: aplicou-se o desconto de 16% em vez do acréscimo. Em altitude a TAS é sempre maior que a IAS, nunca menor.`},
  {t:`Aproximadamente 176 kt`, ok:false,
   pq:`Errada. Esse valor corresponderia a um acréscimo de 60%, o que exigiria altitudes muito superiores às de operação de um monomotor leve.`}
 ]},

{id:`NAV-17`, m:`NAV`, dif:2,
 obj:`Citar os diferentes nominativos de altitude e as respectivas maneiras de se obtê-los.`,
 p:`Qual é a definição de ALTITUDE-DENSIDADE e por que ela importa para o piloto?`,
 alts:[
  {t:`É a altitude indicada no altímetro com o ajuste QNH do aeródromo.`, ok:false,
   pq:`Errada — essa é a altitude indicada. A altitude-densidade não é lida em nenhum instrumento; é calculada.`},
  {t:`É a distância vertical entre a aeronave e o terreno logo abaixo.`, ok:false,
   pq:`Errada — isso é a altitude absoluta, ou altura AGL, obtida por radioaltímetro ou por comparação com a elevação do terreno.`},
  {t:`É a altitude-pressão corrigida pelo desvio de temperatura em relação à ISA; é ela que determina o desempenho real da aeronave em decolagem, subida e pouso.`, ok:true,
   pq:`Correta. Em dia quente, um aeródromo de 2.000 ft pode ter altitude-densidade de 4.500 ft: a aeronave desempenha como se estivesse muito mais alto. Corrida de decolagem mais longa e razão de subida menor — causa recorrente de acidentes em pistas curtas e dias quentes.`},
  {t:`É a altitude em que a densidade do ar é máxima, sempre ao nível do mar.`, ok:false,
   pq:`Errada. A altitude-densidade não designa um lugar onde a densidade é máxima; é uma altitude equivalente na atmosfera padrão que reproduz a densidade que se tem ali, naquele momento.`}
 ]},

{id:`NAV-18`, m:`NAV`, dif:2,
 obj:`Interpretar e descrever as indicações dos instrumentos básicos de navegação.`,
 p:`Qual instrumento básico é alimentado pelo sistema de pressão ESTÁTICA apenas, sem uso da pressão dinâmica do tubo de Pitot?`,
 alts:[
  {t:`O anemômetro, apenas.`, ok:false,
   pq:`Errada. O anemômetro é justamente o instrumento que depende das DUAS fontes. Obstruir só o Pitot já basta para inutilizá-lo.`},
  {t:`O horizonte artificial e o giro direcional.`, ok:false,
   pq:`Errada. Esses são instrumentos giroscópicos, acionados por vácuo ou eletricidade, e não pertencem ao sistema Pitot-estático.`},
  {t:`A bússola magnética.`, ok:false,
   pq:`Errada. A bússola é um instrumento magnético autônomo, sem qualquer ligação com o sistema de pressão.`},
  {t:`O altímetro e o climb (indicador de razão de subida).`, ok:true,
   pq:`Correta. Altímetro e climb usam somente a estática. O anemômetro é o único dos três que precisa das duas fontes: ele compara a pressão total do Pitot com a estática, e essa diferença é a pressão dinâmica que se traduz em velocidade.`}
 ]},

{id:`NAV-19`, m:`NAV`, dif:3,
 obj:`Interpretar e descrever as indicações dos instrumentos básicos de navegação.`,
 p:`Em voo, o orifício ESTÁTICO é obstruído por gelo, permanecendo a estática travada na pressão do momento do bloqueio. O que passa a acontecer com o altímetro durante uma descida?`,
 alts:[
  {t:`O altímetro congela na indicação do momento do bloqueio e deixa de acompanhar a descida.`, ok:true,
   pq:`Correta. O altímetro só lê a estática. Travada a fonte, a indicação para de mudar. É por isso que aeronaves têm fonte estática alternada: abrindo-a, o instrumento volta a funcionar, com pequeno erro por usar a pressão da cabine.`},
  {t:`O altímetro passa a indicar altitude crescente durante a descida.`, ok:false,
   pq:`Errada. Indicação invertida desse tipo é comportamento do ANEMÔMETRO com estática bloqueada, não do altímetro, que simplesmente congela.`},
  {t:`O altímetro passa a indicar zero.`, ok:false,
   pq:`Errada. Não há nada que force a indicação a zero; ela apenas deixa de variar, permanecendo no valor em que estava.`},
  {t:`Nada acontece, porque o altímetro é alimentado pelo tubo de Pitot.`, ok:false,
   pq:`Errada na premissa. O altímetro não usa o Pitot — usa exclusivamente a estática.`}
 ]},

{id:`NAV-20`, m:`NAV`, dif:2,
 obj:`Identificar e interpretar as simbologias convencionadas nas cartas aeronáuticas.`,
 p:`Nas cartas aeronáuticas visuais, o que representa a MEF (Maximum Elevation Figure) publicada dentro de cada quadrícula?`,
 alts:[
  {t:`A altitude mínima autorizada para voo VFR naquela região.`, ok:false,
   pq:`Errada. Altitude mínima de voo é matéria de regra do ar e de publicação específica; a MEF é apenas informação de relevo e obstáculos, sem margem embutida.`},
  {t:`A elevação do obstáculo mais alto conhecido dentro daquela quadrícula, arredondada para cima, servindo de referência para escolher altitudes seguras.`, ok:true,
   pq:`Correta. A MEF resume, num número, o pior caso de relevo e obstáculos da quadrícula. Ela não é uma altitude mínima autorizada nem inclui margem de separação — é insumo para o piloto definir a sua altitude com folga própria.`},
  {t:`A elevação média do terreno na quadrícula.`, ok:false,
   pq:`Errada, e perigosa se acreditada. A MEF é o valor MÁXIMO, não a média. Voar pela média do terreno é voar dentro do relevo.`},
  {t:`O teto de serviço recomendado para aeronaves leves na área.`, ok:false,
   pq:`Errada. Teto de serviço é característica de desempenho da aeronave, publicada no manual, e nada tem a ver com a carta.`}
 ]},

{id:`NAV-21`, m:`NAV`, dif:2,
 obj:`Efetuar traçados e segmentos, bem como determinar a direção e medir distâncias em cartas aeronáuticas.`,
 p:`Ao medir distância diretamente na carta usando a graduação das coordenadas, qual escala deve ser usada e por quê?`,
 alts:[
  {t:`A escala de LONGITUDE, no topo da carta, porque é a que acompanha o sentido do voo.`, ok:false,
   pq:`Errada. Os minutos de longitude encurtam à medida que se afasta do Equador, então medir por eles introduz erro que cresce com a latitude. E a escolha não tem relação com o sentido do voo.`},
  {t:`Qualquer uma das duas, já que a carta é conforme e preserva distâncias.`, ok:false,
   pq:`Errada. Cartas conformes preservam ÂNGULOS, não distâncias. E, de qualquer modo, as duas escalas não são equivalentes.`},
  {t:`A escala de LATITUDE, na lateral da carta, porque 1 minuto de latitude equivale sempre a 1 NM.`, ok:true,
   pq:`Correta. A latitude é medida ao longo de meridianos, que são círculos máximos, então seus minutos têm comprimento constante. É por isso que a régua natural da carta é a borda lateral.`},
  {t:`Nenhuma: distância em carta só pode ser obtida por cálculo de coordenadas.`, ok:false,
   pq:`Errada. Medir com régua ou compasso na escala de latitude é procedimento normal e suficientemente preciso para planejamento VFR.`}
 ]},

{id:`NAV-22`, m:`NAV`, dif:2,
 obj:`Descrever os elementos básicos da geografia matemática ou astronômica, aplicáveis à navegação aérea.`,
 p:`Quantos graus de longitude correspondem a uma hora de diferença de tempo, e por quê?`,
 alts:[
  {t:`30°, porque existem 12 fusos horários no mundo.`, ok:false,
   pq:`Errada na premissa e no resultado. São 24 fusos de referência, não 12, e a divisão correta dá 15°.`},
  {t:`10°, por convenção da OACI.`, ok:false,
   pq:`Errada. O valor não é convenção arbitrária: decorre diretamente da rotação da Terra.`},
  {t:`60°, porque a hora tem 60 minutos.`, ok:false,
   pq:`Errada. Confundiu-se a subdivisão da hora com a divisão do globo. São coisas independentes.`},
  {t:`15°, porque a Terra completa 360° de rotação em 24 horas.`, ok:true,
   pq:`Correta. 360 ÷ 24 = 15° por hora. Daí decorrem também 1° por 4 minutos e 15 minutos de arco por minuto de tempo — relações úteis para converter longitude em hora local.`}
 ]},

{id:`NAV-23`, m:`NAV`, dif:2,
 obj:`Aplicar corretamente conhecimentos sobre cálculos de tempo relacionados a longitude e aos fusos horários nos planejamentos de voo.`,
 p:`Um voo decola às 14h30 do horário de Brasília (UTC−3). Qual é o horário de decolagem em UTC, usado nas comunicações e no plano de voo?`,
 alts:[
  {t:`17h30 UTC`, ok:true,
   pq:`Correta. Para converter hora local em UTC num fuso a oeste, soma-se o valor do fuso: 14h30 + 3h = 17h30 UTC. Toda a aviação trabalha em UTC (Zulu) justamente para eliminar ambiguidade entre fusos.`},
  {t:`11h30 UTC`, ok:false,
   pq:`Errada — o sinal foi invertido. Subtrair 3 horas converteria UTC em hora local, não o contrário.`},
  {t:`14h30 UTC`, ok:false,
   pq:`Errada. Só coincidiria se o fuso fosse UTC−0. O horário de Brasília está três horas atrás do UTC.`},
  {t:`20h30 UTC`, ok:false,
   pq:`Errada. Somaram-se 6 horas, valor que não corresponde ao fuso informado.`}
 ]},

{id:`NAV-24`, m:`NAV`, dif:2,
 obj:`Aplicar os conhecimentos básicos de navegação estimada em planejamentos de voo em rota.`,
 p:`Durante um voo VFR, o piloto cronometra a passagem entre dois pontos conhecidos e obtém uma velocidade no solo menor que a planejada. Qual é a consequência mais importante a verificar imediatamente?`,
 alts:[
  {t:`A altitude indicada estará errada e o altímetro deve ser reajustado.`, ok:false,
   pq:`Errada. Velocidade no solo não tem relação com o ajuste do altímetro, que depende de pressão e temperatura.`},
  {t:`O tempo total de voo aumentará, logo é preciso recalcular o combustível necessário e a autonomia restante em relação à reserva.`, ok:true,
   pq:`Correta. GS menor significa mais tempo no ar para a mesma distância, e combustível se consome por tempo, não por distância. Recalcular cedo é o que permite decidir por uma escala antes que a reserva vire problema.`},
  {t:`A proa magnética deve ser imediatamente aumentada em 10°.`, ok:false,
   pq:`Errada. Uma GS menor sugere componente de vento de proa maior que o previsto; isso pode vir acompanhado de deriva, mas corrigir a proa por um valor arbitrário, sem verificar a posição em relação à rota, é chute.`},
  {t:`Nada precisa ser feito: a navegação estimada já prevê variações de velocidade.`, ok:false,
   pq:`Errada. A estimada prevê que se façam verificações e correções em rota; é o contrário de ignorar o desvio observado.`}
 ]},

{id:`NAV-25`, m:`NAV`, dif:2,
 obj:`Identificar e/ou relacionar os elementos básicos para a elaboração de um plano de voo VFR.`,
 p:`Qual conjunto de informações é essencial no planejamento de uma perna de navegação VFR?`,
 alts:[
  {t:`Apenas a rota e a distância, já que o restante se resolve em voo observando o terreno.`, ok:false,
   pq:`Errada. Sem tempo estimado não há como calcular combustível, e sem combustível calculado não há decisão de alternativa. Observar o terreno complementa o plano, não o substitui.`},
  {t:`Apenas o combustível a bordo, porque a autonomia determina tudo.`, ok:false,
   pq:`Errada. Autonomia sozinha não informa se ela é suficiente para aquela rota, com aquele vento, naquele dia.`},
  {t:`Rota e distância medidas na carta, proa magnética corrigida da deriva, velocidade no solo estimada, tempo previsto e combustível necessário, mais as altitudes seguras em relação ao relevo.`, ok:true,
   pq:`Correta. É o núcleo do plano: para onde, quanto tempo, com quanto combustível e a que altitude. Sem qualquer um desses itens o voo deixa de ser planejado e passa a ser improvisado.`},
  {t:`Apenas as frequências de rádio dos órgãos ATS ao longo da rota.`, ok:false,
   pq:`Errada. As frequências são parte importante da preparação, mas não substituem os cálculos de navegação e de combustível.`}
 ]},

{id:`NAV-26`, m:`NAV`, dif:2,
 obj:`Identificar as características de um transceptor de VHF.`,
 p:`Qual é a característica de propagação que define o alcance das comunicações em VHF na aviação?`,
 alts:[
  {t:`Propagação por onda terrestre, acompanhando a curvatura do planeta por centenas de milhas.`, ok:false,
   pq:`Errada. Onda terrestre é característica de frequências mais baixas, como as usadas em NDB. Em VHF esse efeito é desprezível.`},
  {t:`Propagação por reflexão na ionosfera, permitindo contato transcontinental.`, ok:false,
   pq:`Errada. Reflexão ionosférica é o que dá alcance intercontinental ao HF. O VHF atravessa a ionosfera em vez de ser refletido por ela.`},
  {t:`O alcance é fixo em 200 NM, independentemente da altitude.`, ok:false,
   pq:`Errada. Não existe alcance fixo: no solo pode ser de poucas milhas, e em altitude elevada, de mais de uma centena.`},
  {t:`Propagação por linha de visada: o alcance depende da altitude da aeronave e do relevo entre ela e a estação.`, ok:true,
   pq:`Correta. VHF não acompanha a curvatura da Terra nem contorna montanhas de forma significativa. Por isso o alcance cresce com a altitude — subir é a primeira providência quando não se consegue contato — e por isso o relevo bloqueia a comunicação.`}
 ]},

{id:`NAV-27`, m:`NAV`, dif:1,
 obj:`Descrever os princípios básicos de comunicação através de radiotelefonia.`,
 p:`Em radiotelefonia aeronáutica, qual é a estrutura correta de uma chamada inicial?`,
 alts:[
  {t:`Identificação da estação chamada, seguida da identificação da aeronave que chama, e depois a mensagem.`, ok:true,
   pq:`Correta. Primeiro se diz para quem, depois quem fala, depois o quê. Essa ordem existe para que o destinatário reconheça que a mensagem é para ele antes de precisar reter o resto.`},
  {t:`Identificação da aeronave, seguida da mensagem, e ao final a estação chamada.`, ok:false,
   pq:`Errada. Deixar o destinatário para o fim faz com que várias estações prestem atenção à mensagem inteira sem saber a quem ela se destina — exatamente o que a fraseologia procura evitar.`},
  {t:`Somente a mensagem, já que o órgão identifica a aeronave pelo transponder.`, ok:false,
   pq:`Errada. A identificação verbal é obrigatória e independe de haver ou não vigilância radar. Sem ela não há como saber quem transmitiu.`},
  {t:`Identificação da aeronave repetida três vezes, seguida da mensagem.`, ok:false,
   pq:`Errada. Repetição tripla não é procedimento normal de chamada; ela aparece apenas em prefixos de emergência, como o MAYDAY.`}
 ]},

{id:`NAV-28`, m:`NAV`, dif:2,
 obj:`Utilizar corretamente os elementos básicos de orientação para determinar a posição e a direção da aeronave em relação à superfície da Terra.`,
 p:`Voando VFR sobre região de poucas referências, o piloto percebe que está incerto quanto à sua posição. Qual é a conduta inicial mais adequada?`,
 alts:[
  {t:`Descer imediatamente para baixa altitude para tentar ler placas e nomes de cidades.`, ok:false,
   pq:`Errada e perigosa. Descer reduz o alcance da vista, reduz o alcance do rádio, aproxima do relevo e dos obstáculos, e consome tempo e combustível.`},
  {t:`Manter o controle da aeronave e a altitude segura, anotar a hora, estabelecer uma proa conhecida e estimar a posição pelo último ponto certo, buscando referências marcantes e, se necessário, pedir auxílio ao órgão ATS.`, ok:true,
   pq:`Correta. A sequência é sempre voar primeiro, depois navegar. Ancorar-se no último ponto de posição confirmada e no tempo decorrido reduz a área de busca; pedir auxílio cedo é sinal de bom julgamento, não de fracasso.`},
  {t:`Iniciar curvas em busca de referência conhecida, sem controlar tempo nem proa.`, ok:false,
   pq:`Errada. Curvas aleatórias destroem a única informação que ainda resta: a estimativa a partir do último ponto conhecido, que depende de proa e tempo.`},
  {t:`Desligar o rádio para se concentrar na navegação.`, ok:false,
   pq:`Errada. O rádio é justamente um dos recursos disponíveis: os órgãos ATS podem prestar auxílio e, quando há vigilância, informar a posição.`}
 ]},

{id:`NAV-29`, m:`NAV`, dif:2,
 obj:`Efetuar plotagens pela aplicação de sistema de coordenadas geográficas.`,
 p:`Como se escreve corretamente uma posição em coordenadas geográficas no Brasil, e o que indicam os sinais ou letras?`,
 alts:[
  {t:`Longitude primeiro e latitude depois, seguindo a ordem de leitura da carta.`, ok:false,
   pq:`Errada. A convenção internacional é latitude antes de longitude, e inverter pode gerar uma posição em outro continente.`},
  {t:`Apenas os graus, sem minutos, já que a precisão de um grau basta para o VFR.`, ok:false,
   pq:`Errada. Um grau de latitude equivale a 60 NM — precisão inaceitável para localizar um aeródromo.`},
  {t:`Latitude primeiro, com indicação Sul ou Norte, e depois longitude, com indicação Oeste ou Leste — por exemplo, 23°33'S 046°38'W.`, ok:true,
   pq:`Correta. A ordem convencional é latitude e depois longitude. No Brasil quase todo o território fica em latitude Sul e longitude Oeste. A longitude é escrita com três dígitos de grau justamente para não ser confundida com latitude.`},
  {t:`Latitude e longitude sempre positivas, porque no Brasil não há ambiguidade.`, ok:false,
   pq:`Errada. Omitir hemisfério é omitir informação essencial, e há território brasileiro no Hemisfério Norte. A indicação S/N e W/E não é opcional.`}
 ]},

{id:`NAV-30`, m:`NAV`, dif:3,
 obj:`Processar informações sobre o vento e seus efeitos imediatos no deslocamento da aeronave, em relação à manutenção da rota pretendida.`,
 p:`Voando com vento de través vindo da esquerda, para manter a rota desejada, para onde o piloto deve corrigir a proa?`,
 alts:[
  {t:`Para a direita, acompanhando o sentido em que o vento empurra a aeronave.`, ok:false,
   pq:`Errada, e piora o desvio: corrigir para o mesmo lado em que se está sendo empurrado afasta ainda mais da rota.`},
  {t:`Não deve corrigir a proa; deve apenas aumentar a potência.`, ok:false,
   pq:`Errada. Potência altera velocidade, não a direção do deslocamento. Vento de través exige correção angular.`},
  {t:`Deve corrigir sempre 10°, independentemente da intensidade do vento.`, ok:false,
   pq:`Errada. O ângulo de correção depende da relação entre a componente de través e a TAS; valores fixos só coincidem por acaso.`},
  {t:`Para a esquerda, ou seja, na direção DE ONDE o vento sopra.`, ok:true,
   pq:`Correta. A correção de deriva sempre aponta o nariz para o lado do qual o vento vem. Se o vento empurra a aeronave para a direita, apontar o nariz um pouco à esquerda faz a resultante coincidir com a rota desejada.`}
 ]},

{id:`NAV-31`, m:`NAV`, dif:2,
 obj:`Identificar rotas plotadas nas cartas aeronáuticas segundo as projeções Lambert e Mercator.`,
 p:`Por que a projeção cônica conforme de LAMBERT é preferida nas cartas aeronáuticas de latitudes médias?`,
 alts:[
  {t:`Porque a escala se mantem praticamente constante em toda a carta e a ortodromia é representada aproximadamente por uma reta, o que facilita medir distâncias e traçar rotas.`, ok:true,
   pq:`Correta. Ao usar dois paralelos padrão, a Lambert distribui a distorção e mantém a escala quase uniforme na folha. Isso permite medir distância com régua em qualquer parte da carta e traçar rotas próximas do círculo máximo com uma linha reta.`},
  {t:`Porque ela preserva as áreas exatamente, o que é essencial para calcular combustível.`, ok:false,
   pq:`Errada. A Lambert é conforme, isto é, preserva ângulos, não áreas. E combustível se calcula com distância e tempo, não com área.`},
  {t:`Porque nela a loxodromia é uma reta, permitindo voar rumo constante.`, ok:false,
   pq:`Errada — essa é a propriedade da Mercator. Na Lambert a loxodromia aparece levemente curvada.`},
  {t:`Porque ela é a única projeção que representa os polos corretamente.`, ok:false,
   pq:`Errada. Representação polar adequada é característica das projeções polares estereográficas, e não é o motivo do uso da Lambert em latitudes médias.`}
 ]},

{id:`NAV-32`, m:`NAV`, dif:2,
 obj:`Conceituar pressão atmosférica e as formas convencionadas de medi-la para fins aeronáuticos.`,
 p:`Acima da altitude de transição, qual ajuste todos os altímetros devem apresentar e qual a razão dessa convenção?`,
 alts:[
  {t:`O QNH do aeródromo de destino, para facilitar a descida.`, ok:false,
   pq:`Errada. O QNH do destino só passa a ser usado ao descer abaixo do nível de transição. Mantê-lo em cruzeiro faria cada aeronave voar sobre uma referência diferente.`},
  {t:`1013,25 hPa (pressão padrão), para que todas as aeronaves voem sobre a mesma referência e a separação vertical entre elas fique garantida.`, ok:true,
   pq:`Correta. Acima da altitude de transição as posições verticais são expressas em níveis de voo, todos referidos à mesma superfície isobárica padrão. O que importa ali não é a altura sobre o terreno, mas a separação entre aeronaves — e separação só existe se todos usarem a mesma régua.`},
  {t:`O QFE do aeródromo de partida, para manter referência com a pista de origem.`, ok:false,
   pq:`Errada. O QFE dá altura sobre o aeródromo e perde qualquer sentido assim que a aeronave se afasta dele.`},
  {t:`Qualquer ajuste, desde que informado ao controle.`, ok:false,
   pq:`Errada. A padronização é obrigatória e não negociável; sem ela, a expressão em níveis de voo perde significado.`}
 ]}
];
/* =====================================================================
   TV — TEORIA DE VOO
   Objetivos: Apêndice D da IS 00-003H, seção
   "TV - TEORIA DE VOO - EXAMES: PPA, PPL E CPA"
   Questões ORIGINAIS. Nenhuma copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_TV = [
{id:`TV-01`, m:`TV`, dif:2,
 obj:`Enunciar as leis de Newton e suas aplicações.`,
 p:`Qual lei de Newton explica diretamente por que a hélice, ao acelerar uma massa de ar para trás, produz tração para a frente?`,
 alts:[
  {t:`A primeira lei — inércia.`, ok:false,
   pq:`Errada quanto à pergunta. A inércia explica por que um corpo mantém seu estado de movimento na ausência de força resultante — é o que se observa, por exemplo, ao nivelar tarde uma subida. Não explica a origem da tração.`},
  {t:`A segunda lei — força igual a massa vezes aceleração.`, ok:false,
   pq:`Errada como resposta direta. A segunda lei quantifica quanta força resulta de acelerar aquela massa de ar, e é útil no cálculo — mas o mecanismo de aparecimento da força para a frente é a terceira lei.`},
  {t:`A terceira lei — ação e reação.`, ok:true,
   pq:`Correta. A hélice empurra ar para trás (ação) e recebe, do ar, uma força igual e oposta para a frente (reação), que é a tração. O mesmo raciocínio vale para o jato e para o rotor do helicóptero.`},
  {t:`A lei da gravitação universal.`, ok:false,
   pq:`Errada. A gravitação explica o peso da aeronave, não a produção de tração.`}
 ]},

{id:`TV-02`, m:`TV`, dif:2,
 obj:`Identificar as forças que atuam sobre uma aeronave em voo, bem como os fatores que nelas influem.`,
 p:`Em voo reto, nivelado e com velocidade constante, qual é a relação entre as quatro forças?`,
 alts:[
  {t:`A sustentação é sempre maior que o peso, senão a aeronave não voaria.`, ok:false,
   pq:`Errada, e é o mal-entendido mais comum da matéria. Sustentação maior que o peso produz aceleração vertical, ou seja, a aeronave estaria subindo. Para manter o nivelado ela precisa ser exatamente igual.`},
  {t:`A tração é sempre maior que o arrasto em qualquer condição de voo.`, ok:false,
   pq:`Errada. Tração maior que arrasto significa aceleração. Em cruzeiro estabilizado elas se igualam, e em descida com potência reduzida a tração é menor.`},
  {t:`O peso desaparece em voo, sendo substituído pela sustentação.`, ok:false,
   pq:`Errada. O peso continua atuando o tempo todo; a sustentação apenas o equilibra.`},
  {t:`Sustentação equilibra o peso e a tração equilibra o arrasto: a resultante de forças é nula.`, ok:true,
   pq:`Correta. Velocidade constante em trajetória retilínea significa aceleração nula e, pela segunda lei, força resultante nula. Os pares se anulam. Se a tração superasse o arrasto a aeronave estaria acelerando, e não é o caso descrito.`}
 ]},

{id:`TV-03`, m:`TV`, dif:2,
 obj:`Identificar as forças que agem sobre um corpo no ar.`,
 p:`O que é o ARRASTO INDUZIDO e como ele varia com a velocidade?`,
 alts:[
  {t:`É o arrasto que surge como subproduto da geração de sustentação, ligado aos vórtices de ponta de asa; ele AUMENTA quando a velocidade diminui.`, ok:true,
   pq:`Correta. Em baixa velocidade é preciso ângulo de ataque alto para sustentar o mesmo peso, o que intensifica os vórtices de ponta e o arrasto induzido. É por isso que o induzido domina na aproximação e no voo lento, e é a causa da chamada região de comando reverso.`},
  {t:`É o arrasto causado pelo atrito do ar com a superfície da aeronave; aumenta com a velocidade.`, ok:false,
   pq:`Errada — essa descrição é do arrasto parasita, que de fato cresce com o quadrado da velocidade. Induzido e parasita variam em sentidos opostos.`},
  {t:`É o arrasto gerado por antenas, trem de pouso e irregularidades; independe do ângulo de ataque.`, ok:false,
   pq:`Errada. Isso é arrasto de forma e de interferência, componentes do parasita. O induzido depende diretamente do ângulo de ataque.`},
  {t:`É um arrasto que só existe em voo supersônico.`, ok:false,
   pq:`Errada. Arrasto de onda é que aparece em regime transônico e supersônico. O induzido existe em qualquer velocidade em que haja sustentação.`}
 ]},

{id:`TV-04`, m:`TV`, dif:3,
 obj:`Interpretar as informações indicadas no velocímetro.`,
 p:`No velocímetro de um avião leve, o que delimita o ARCO VERDE e o ARCO AMARELO?`,
 alts:[
  {t:`O arco verde indica a faixa de operação com flaps estendidos, e o amarelo, a faixa sem flaps.`, ok:false,
   pq:`Errada. A faixa de operação com flaps é o arco BRANCO, que vai da velocidade de estol na configuração de pouso até a Vfe.`},
  {t:`O arco verde vai da velocidade de estol com flaps recolhidos até a velocidade máxima de cruzeiro estrutural; o arco amarelo vai dali até a velocidade nunca a exceder, e só pode ser usado em ar liso.`, ok:true,
   pq:`Correta. O verde é a faixa normal de operação. O amarelo é a faixa de cautela: a estrutura suporta, desde que sem rajadas nem manobras bruscas. A linha vermelha no fim do amarelo é a Vne, que não deve ser excedida em nenhuma circunstância.`},
  {t:`O arco verde é a faixa de decolagem e o amarelo, a de pouso.`, ok:false,
   pq:`Errada. Os arcos são faixas estruturais e aerodinâmicas, não fases de voo.`},
  {t:`O arco amarelo indica a faixa em que o motor opera com melhor rendimento.`, ok:false,
   pq:`Errada. Rendimento de motor é assunto do tacômetro e das tabelas de potência, não do velocímetro.`}
 ]},

{id:`TV-05`, m:`TV`, dif:3,
 obj:`Descrever os efeitos dos esforços estruturais que sofrem as aeronaves e as manobras correspondentes aos problemas deles derivados.`,
 p:`Numa curva nivelada e coordenada com 60° de inclinação, qual é o fator de carga suportado pela aeronave?`,
 alts:[
  {t:`1 G, porque a curva é nivelada.`, ok:false,
   pq:`Errada. 1 G só ocorre em voo reto e nivelado. Curvar exige sustentação adicional para gerar a componente horizontal, e isso carrega a estrutura.`},
  {t:`1,41 G`, ok:false,
   pq:`Errada para 60°: esse é o fator de carga de uma curva com 45° de inclinação. A relação não é linear — o crescimento acelera muito depois dos 45°.`},
  {t:`2 G`, ok:true,
   pq:`Correta. Em curva nivelada o fator de carga é 1 dividido pelo cosseno da inclinação. Cosseno de 60° é 0,5, então n = 1 ÷ 0,5 = 2. A aeronave e os ocupantes pesam o dobro, e a velocidade de estol sobe pela raiz de 2, cerca de 41%.`},
  {t:`6 G, proporcional aos 60° de inclinação.`, ok:false,
   pq:`Errada. Não há proporção direta entre graus de inclinação e G. A relação é trigonométrica.`}
 ]},

{id:`TV-06`, m:`TV`, dif:3,
 obj:`Descrever as peculiaridades do voo em função dos diversos fatores que influenciam a realização das manobras de: decolagem, subida, voo cruzeiro, curvas, descida e pouso.`,
 p:`O que acontece com a velocidade de estol indicada quando a aeronave executa uma curva com fator de carga de 2 G?`,
 alts:[
  {t:`Dobra, acompanhando linearmente o fator de carga.`, ok:false,
   pq:`Errada. A relação é com a raiz quadrada, não linear. Dobrar a velocidade de estol exigiria 4 G.`},
  {t:`Diminui, porque a maior sustentação afasta a asa do estol.`, ok:false,
   pq:`Errada, e inverte o raciocínio. Para curvar é preciso MAIS sustentação, obtida com maior ângulo de ataque — o que aproxima do ângulo crítico, não afasta.`},
  {t:`Não muda: a velocidade de estol é uma constante da aeronave.`, ok:false,
   pq:`Errada. A velocidade de estol varia com peso, fator de carga, configuração de flaps e posição do CG. Só o ÂNGULO de ataque crítico é constante.`},
  {t:`Aumenta cerca de 41%, porque a velocidade de estol cresce com a raiz quadrada do fator de carga.`, ok:true,
   pq:`Correta. Raiz de 2 é aproximadamente 1,41. Um avião que estola a 50 kt em voo nivelado estolará a cerca de 71 kt numa curva de 60°. É por isso que curvas acentuadas em baixa velocidade, como no tráfego, são tão perigosas.`}
 ]},

{id:`TV-07`, m:`TV`, dif:2,
 obj:`Descrever as características das atitudes anormais, em especial, os “parafusos”.`,
 p:`Qual afirmação sobre o ângulo de ataque de estol está correta?`,
 alts:[
  {t:`A asa estola sempre no mesmo ângulo de ataque crítico, independentemente da velocidade, do peso e da atitude da aeronave.`, ok:true,
   pq:`Correta. É o conceito central da matéria. Pode-se estolar em mergulho, em subida, rápido ou devagar — o que define o estol é exceder o ângulo crítico, não atingir uma velocidade. A velocidade de estol muda; o ângulo crítico, não.`},
  {t:`A asa estola sempre na mesma velocidade indicada, marcada no início do arco verde.`, ok:false,
   pq:`Errada. Aquele valor vale para uma condição específica: peso máximo, voo nivelado, 1 G. Mude o fator de carga ou o peso e a velocidade de estol muda junto.`},
  {t:`A asa só pode estolar com o nariz acima do horizonte.`, ok:false,
   pq:`Errada, e é uma crença perigosa. Estol acelerado em curva descendente ocorre com o nariz abaixo do horizonte. O que importa é o ângulo entre a asa e o vento relativo.`},
  {t:`O ângulo de ataque crítico aumenta quando a aeronave está mais pesada.`, ok:false,
   pq:`Errada. Peso maior exige mais sustentação e portanto maior VELOCIDADE de estol, mas o ângulo crítico é uma característica do perfil e permanece o mesmo.`}
 ]},

{id:`TV-08`, m:`TV`, dif:3,
 obj:`Descrever as características das atitudes anormais, em especial, os “parafusos”.`,
 p:`Qual é a condição necessária para que uma aeronave entre em PARAFUSO?`,
 alts:[
  {t:`Velocidade excessiva em mergulho acentuado.`, ok:false,
   pq:`Errada. Isso é o quadro de mergulho em espiral, que se confunde com parafuso mas tem causa e recuperação diferentes: no espiral a velocidade cresce rapidamente e a asa não está estolada.`},
  {t:`Estol acompanhado de guinada ou descoordenação, fazendo uma asa estolar mais que a outra.`, ok:true,
   pq:`Correta. Parafuso é estol assimétrico com autorrotação. Sem estol não há parafuso, e sem descoordenação o estol tende a ser simétrico e reto. Daí a insistência em manter a bola centrada nas manobras de baixa velocidade, sobretudo na curva de base para final.`},
  {t:`Uso de flaps acima da Vfe.`, ok:false,
   pq:`Errada. Exceder a Vfe é um problema estrutural do sistema de flapes, sem relação direta com autorrotação.`},
  {t:`Centro de gravidade adiantado além do limite dianteiro.`, ok:false,
   pq:`Errada quanto à causa do parafuso. CG dianteiro em excesso dificulta o controle de arfagem e o flare; é o CG ATRASADO que agrava o parafuso, podendo torná-lo irrecuperável.`}
 ]},

{id:`TV-09`, m:`TV`, dif:2,
 obj:`Identificar os efeitos da hélice nas manobras das aeronaves.`,
 p:`Num monomotor com hélice girando no sentido horário visto da cabine, qual é o efeito conhecido como FATOR P e quando ele é mais notado?`,
 alts:[
  {t:`É a tendência de a aeronave rolar para a direita por reação ao giro da hélice.`, ok:false,
   pq:`Errada. Isso descreve o TORQUE, e ele produz rolagem para a esquerda, não para a direita, quando a hélice gira no sentido horário.`},
  {t:`É o efeito do fluxo helicoidal da hélice atingindo o estabilizador vertical.`, ok:false,
   pq:`Errada. Esse é o efeito da esteira helicoidal (slipstream), outra das tendências de guinada — mas não é o fator P.`},
  {t:`Com ângulo de ataque alto, a pá descendente ataca o ar com maior ângulo e produz mais tração que a ascendente, gerando guinada para a esquerda — mais notado na decolagem e na subida com potência alta.`, ok:true,
   pq:`Correta. Com o nariz alto, o disco da hélice fica inclinado em relação ao vento relativo e as pás deixam de trabalhar simetricamente. O fator P é uma das quatro tendências de guinada à esquerda, junto com torque, esteira helicoidal e precessão giroscópica.`},
  {t:`É a força que aparece quando se altera o passo da hélice em voo.`, ok:false,
