<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b0f">
<title>Estudo PP — Banca ANAC (PPA)</title>
<style>
/* =====================================================================
   ESTUDO PP — EFB de bolso para a prova teórica da ANAC
   Mesma linguagem visual do Guided Training: escuro, tipografia de
   instrumento, feito para o celular.
   ===================================================================== */
:root{
  color-scheme: dark;
  --fundo:#070b0f; --painel:#0e151c; --painel2:#131d26; --linha:#1e2b38;
  --texto:#cfe3f2; --apagado:#7d97aa;
  --verde:#24e07a; --ambar:#ffb020; --vermelho:#ff4d4d; --ciano:#35c4ff; --roxo:#7a5cff;
  --mono: ui-monospace,"Cascadia Mono","Roboto Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--fundo);min-height:100%}
body{
  font-family:var(--mono); color:var(--texto); font-size:15px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  background:radial-gradient(900px 420px at 50% -8%,#10202c 0%,transparent 62%),var(--fundo);
}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:var(--mono);cursor:pointer}

/* ---------- topo ---------- */
.topo{
  position:sticky;top:0;z-index:20;background:rgba(14,21,28,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);padding:10px 14px;
}
.topo-l1{display:flex;align-items:center;gap:10px}
.marca{font-size:13px;letter-spacing:2.5px;color:var(--ciano);font-weight:700}
.marca span{color:var(--apagado)}
.nuvem{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--apagado);
  border:1px solid var(--linha);border-radius:20px;padding:4px 10px;background:var(--painel2)}
.led{width:7px;height:7px;border-radius:50%;background:var(--ambar)}
.nuvem.ok .led{background:var(--verde)} .nuvem.off .led{background:var(--vermelho)}
.streak{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ambar);
  border:1px solid #5a4310;border-radius:20px;padding:4px 10px;background:#1d1704}

/* ---------- abas inferiores ---------- */
.abas{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(14,21,28,.98);border-top:1px solid var(--linha);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);
}
.abas button{
  background:none;border:0;color:var(--apagado);padding:13px 4px 15px;font-size:11px;
  letter-spacing:1.5px;border-top:2px solid transparent;
}
.abas button.on{color:var(--ciano);border-top-color:var(--ciano);background:rgba(53,196,255,.06)}
.abas b{display:block;font-size:17px;margin-bottom:3px;font-weight:400}

/* ---------- blocos ---------- */
.tela{padding:14px;display:none} .tela.on{display:block}
.card{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:15px;margin-bottom:12px}
.rot{font-size:10px;letter-spacing:2px;color:var(--apagado);margin-bottom:9px}
.sub{color:var(--apagado);font-size:13px}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:12px;
  background:var(--painel2);border:1px solid var(--linha);color:var(--apagado);margin:2px 4px 2px 0}
.tag.mat{color:var(--ciano);border-color:#1d4b63}
.tag.dif{color:var(--ambar);border-color:#5a4310}

.aviso-box{border-left:3px solid var(--ambar);background:#1d1704;color:#ffd684;
  padding:11px 13px;border-radius:8px;font-size:13px;margin-top:12px}
.nota-fonte{border-left:3px solid var(--ciano);background:#08202b;color:#a9d9ef;
  padding:11px 13px;border-radius:8px;font-size:12px;margin-top:12px}
.perigo{border-left:3px solid var(--vermelho);background:#230b0b;color:#ffc0c0;
  padding:11px 13px;border-radius:8px;font-size:13px;margin-top:12px}

.btn{width:100%;padding:15px;border-radius:10px;border:1px solid var(--linha);
  background:var(--painel2);color:var(--texto);font-size:14px;margin-top:10px}
.btn.pri{background:var(--ciano);color:#04121b;border-color:var(--ciano);font-weight:700}
.btn.alerta{background:#2a1e04;color:var(--ambar);border-color:#5a4310}
.btn:disabled{opacity:.45}

/* ---------- potinho / cobertura ---------- */
.pot{margin-bottom:12px}
.pot-cab{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.pot-cab b{font-size:13px;font-weight:600;letter-spacing:1px}
.pot-cab i{font-style:normal;margin-left:auto;font-size:12px;color:var(--apagado)}
.pot-barra{height:9px;background:var(--painel2);border:1px solid var(--linha);border-radius:5px;overflow:hidden}
.pot-barra div{height:100%;background:linear-gradient(90deg,#1d7fa8,var(--ciano));transition:width .5s}
.grade{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.cel{width:13px;height:13px;border-radius:3px;background:var(--painel2);border:1px solid var(--linha)}
.cel.c1{background:#12384a;border-color:#1d5a75}
.cel.c2{background:#1a6d90;border-color:#2b8fb8}
.cel.c3{background:var(--ciano);border-color:var(--ciano)}
.cel.decai{box-shadow:inset 0 0 0 1px var(--ambar)}

.sem{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--linha)}
.sem:last-child{border-bottom:0}
.sem .luz{width:11px;height:11px;border-radius:50%;flex:none}
.luz.r{background:var(--vermelho)} .luz.a{background:var(--ambar)}
.luz.c{background:var(--ciano)} .luz.v{background:var(--verde)}
.sem .lb{flex:1;min-width:0}
.sem .lb b{display:block;font-size:13px;font-weight:600}
.sem .lb small{color:var(--apagado);font-size:11px;display:block;line-height:1.45}
.sem .st{font-size:10px;letter-spacing:1px;white-space:nowrap;color:var(--apagado)}

.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.resumo div{background:var(--painel2);border:1px solid var(--linha);border-radius:10px;padding:13px 6px;text-align:center}
.resumo b{display:block;font-size:24px;color:var(--ciano)}
.resumo span{font-size:9px;letter-spacing:1px;color:var(--apagado)}

/* ---------- questão ---------- */
.qcab{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qcab .prog{flex:1;height:5px;background:var(--painel2);border-radius:3px;overflow:hidden}
.qcab .prog div{height:100%;background:var(--ciano);transition:width .3s}
.qcab .rel{font-size:13px;color:var(--apagado);white-space:nowrap}
.qcab .rel.urg{color:var(--vermelho)}
.enun{font-size:16px;line-height:1.55;margin:4px 0 14px}
.obj{font-size:10px;color:var(--apagado);border-left:2px solid var(--linha);padding-left:8px;margin-bottom:12px;line-height:1.4}
.alt{display:block;width:100%;text-align:left;background:var(--painel2);border:1px solid var(--linha);
  color:var(--texto);border-radius:10px;padding:13px 13px;margin-bottom:9px;font-size:14px;line-height:1.45}
.alt .ltr{display:inline-block;width:20px;color:var(--apagado);font-weight:700}
.alt.sel{border-color:var(--ciano)}
.alt.ok{border-color:var(--verde);background:rgba(36,224,122,.10)}
.alt.ok .ltr{color:var(--verde)}
.alt.mau{border-color:var(--vermelho);background:rgba(255,77,77,.09)}
.alt.mau .ltr{color:var(--vermelho)}
.alt.pale{opacity:.55}
.pq{font-size:12.5px;line-height:1.5;margin-top:9px;padding-top:9px;border-top:1px solid var(--linha);color:#b6cddd}
.pq b{color:var(--texto)}
.veredito{font-size:13px;letter-spacing:1px;padding:9px 12px;border-radius:8px;margin-bottom:12px}
.veredito.ok{background:rgba(36,224,122,.13);color:var(--verde)}
.veredito.mau{background:rgba(255,77,77,.12);color:var(--vermelho)}

/* ---------- listas de desempenho ---------- */
.lin{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--linha)}
.lin:last-child{border-bottom:0}
.lin .lb{flex:1;min-width:0;font-size:12.5px;line-height:1.4}
.lin .vl{font-size:14px;white-space:nowrap;font-weight:600}
.vl.bom{color:var(--verde)} .vl.med{color:var(--ambar)} .vl.mau{color:var(--vermelho)}
.mini{height:6px;background:var(--painel2);border-radius:3px;overflow:hidden;margin-top:5px}
.mini div{height:100%;background:var(--ciano)}
.barras{display:flex;align-items:flex-end;gap:4px;height:52px;margin:10px 0 6px}
.barras i{flex:1;max-width:26px;background:var(--ciano);border-radius:3px 3px 0 0;min-height:3px;opacity:.85;position:relative}
.barras i.mau{background:var(--vermelho)}
.vazio{text-align:center;color:var(--apagado);padding:38px 16px;font-size:13px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;
  background:var(--painel2);border:1px solid var(--ciano);border-radius:9px;padding:11px 18px;
  font-size:13px;max-width:88vw;text-align:center;display:none}
details{margin-top:10px}
summary{cursor:pointer;font-size:11px;letter-spacing:1px;color:var(--apagado);padding:6px 0}
details[open] summary{color:var(--ciano)}
.expl{font-size:12px;color:#a9c2d3;line-height:1.6}
.expl b{color:var(--texto)}
.expl ul{padding-left:18px;margin:6px 0}
.expl li{margin-bottom:5px}
table.blk{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.blk td,table.blk th{border-bottom:1px solid var(--linha);padding:7px 4px;text-align:left}
table.blk th{color:var(--apagado);font-weight:400;font-size:10px;letter-spacing:1px}
table.blk td.n{text-align:right;white-space:nowrap}
</style>
</head>
<body>

<div class="topo">
  <div class="topo-l1">
    <div class="marca">ESTUDO<span>PP</span></div>
    <div class="streak" id="streak">— dias</div>
    <div class="nuvem" id="nuvem"><i class="led"></i><span id="nuvem-txt">verificando</span></div>
  </div>
</div>

<div class="tela on" id="tela-diario"></div>
<div class="tela" id="tela-simulado"></div>
<div class="tela" id="tela-desempenho"></div>

<nav class="abas">
  <button class="on" data-t="diario"><b>◈</b>DIÁRIO</button>
  <button data-t="simulado"><b>▣</b>SIMULADO</button>
  <button data-t="desempenho"><b>▤</b>DESEMPENHO</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   REG — REGULAMENTOS, ênfase VFR
   Objetivos: Apêndice D da IS 00-003H, seção
   "REG E AAREG - REGULAMENTOS - EXAMES: TODOS EXCETO PBL, PLA E PLH"

   ATENÇÃO: essa seção do Apêndice D é compartilhada por quase todos os
   exames da ANAC e tem cerca de 74 mil caracteres — inclui PANS-OPS,
   Doc 4444, Anexo 14 e licenças de PLA, muito além do escopo VFR de um
   piloto privado. Este banco prioriza deliberadamente o NÚCLEO VFR,
   conforme o levantamento feito sobre a própria IS.

   Questões ORIGINAIS. Nenhuma copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_REG = [
{id:`REG-01`, m:`REG`, dif:2,
 obj:`Descreva a aplicação dos seguintes termos na aviação civil: soberania; território, alto mar, de acordo com a Convenção das Nações Unidas sobre o alto mar.`,
 p:`Qual é o princípio fundamental estabelecido logo no início da Convenção de Chicago (1944) a respeito do espaço aéreo?`,
 alts:[
  {t:`Cada Estado tem soberania completa e exclusiva sobre o espaço aéreo acima de seu território.`, ok:true,
   pq:`Correta. É o artigo 1º da Convenção e a pedra fundamental de todo o direito aeronáutico: nenhum voo internacional ocorre sem consentimento do Estado sobrevoado, e é dessa soberania que decorrem os acordos bilaterais e as liberdades do ar.`},
  {t:`O espaço aéreo é patrimônio comum da humanidade, de livre circulação para todos os Estados.`, ok:false,
   pq:`Errada. Esse regime de liberdade se aproxima do que vale para o alto mar e o espaço exterior, não para o espaço aéreo sobre território de um Estado.`},
  {t:`A OACI é a proprietária do espaço aéreo internacional e concede autorizações de sobrevoo.`, ok:false,
   pq:`Errada. A OACI é um organismo de padronização e cooperação; não detém soberania nem concede direitos de tráfego, que são negociados entre Estados.`},
  {t:`A soberania se limita a 12 milhas náuticas a partir da costa, como no mar territorial.`, ok:false,
   pq:`Errada quanto ao alcance. O espaço aéreo soberano acompanha todo o território do Estado, incluindo suas águas territoriais — não se restringe a uma faixa costeira.`}
 ]},

{id:`REG-02`, m:`REG`, dif:2,
 obj:`Descreva os deveres dos Estados Contratantes em relação a: documentos transportados a bordo da aeronave.`,
 p:`Quais documentos a Convenção de Chicago exige que sejam mantidos a bordo de uma aeronave em voo internacional?`,
 alts:[
  {t:`Apenas o certificado de aeronavegabilidade, já que ele é o mais importante.`, ok:false,
   pq:`Errada. Aeronavegabilidade atesta a condição da aeronave, mas não substitui a prova de nacionalidade e matrícula nem a habilitação de quem a opera.`},
  {t:`Certificado de matrícula (registro), certificado de aeronavegabilidade e as licenças da tripulação, entre outros.`, ok:true,
   pq:`Correta. O trio matrícula, aeronavegabilidade e licenças é o núcleo. A lógica é simples: um documento prova de quem é a aeronave, outro prova que ela está apta a voar, e o terceiro prova que quem a opera está habilitado.`},
  {t:`Apenas as licenças da tripulação, pois a aeronave já é identificada pelas marcas externas.`, ok:false,
   pq:`Errada. As marcas externas identificam, mas não substituem o certificado de matrícula, que é o documento que comprova o registro.`},
  {t:`Nenhum documento precisa estar a bordo, bastando que estejam registrados na autoridade de aviação civil.`, ok:false,
   pq:`Errada. A exigência é de porte a bordo, justamente para permitir verificação por autoridades de qualquer Estado sobrevoado.`}
 ]},

{id:`REG-03`, m:`REG`, dif:2,
 obj:`Explique os requisitos para atuar como membro da tripulação de voo de uma aeronave civil registrada em um Estado membro.`,
 p:`Quais são as prerrogativas do titular de uma licença de PILOTO PRIVADO, conforme o RBAC 61?`,
 alts:[
  {t:`Atuar como piloto em comando em voos de transporte aéreo público de passageiros, desde que em aeronave monomotora.`, ok:false,
   pq:`Errada. Transporte aéreo público é atividade comercial e está fora das prerrogativas do PP, independentemente do porte ou do número de motores da aeronave.`},
  {t:`Atuar como instrutor de voo, desde que sem cobrar pelas aulas.`, ok:false,
   pq:`Errada. Instrução de voo exige habilitação de instrutor (INV), que tem requisitos próprios de exame teórico, experiência e proficiência. A gratuidade não dispensa a habilitação.`},
  {t:`Atuar, SEM REMUNERAÇÃO, como piloto em comando ou segundo em comando de aeronave da categoria apropriada, em voos não remunerados e sem qualquer aproveitamento comercial.`, ok:true,
   pq:`Correta. É o traço que define a licença: a ausência de remuneração e de finalidade comercial. Qualquer voo remunerado exige, no mínimo, licença de piloto comercial. Dividir custos com passageiros é assunto tratado à parte e com restrições.`},
  {t:`Atuar como piloto em comando em voos remunerados de fretamento, desde que dentro do território nacional.`, ok:false,
   pq:`Errada. Fretamento remunerado é operação comercial; a limitação do PP é quanto à remuneração e ao aproveitamento comercial, não quanto à fronteira.`}
 ]},

{id:`REG-04`, m:`REG`, dif:2,
 obj:`Explique a estrutura do RBAC 61.`,
 p:`Segundo o RBAC 61, quais são os requisitos GERAIS para a concessão da licença de piloto privado?`,
 alts:[
  {t:`Ter completado 21 anos e ter concluído o ensino superior.`, ok:false,
   pq:`Errada em ambos os requisitos. Não há exigência de ensino superior em nenhuma licença de piloto, e a idade mínima para o PP é 18 anos.`},
  {t:`Ter completado 16 anos e estar cursando o ensino médio.`, ok:false,
   pq:`Errada para a LICENÇA de piloto privado. Esses são, aproximadamente, os requisitos da licença de ALUNO piloto — que é etapa anterior e tem prerrogativas bem mais restritas.`},
  {t:`Ter completado 18 anos, sem qualquer exigência de escolaridade.`, ok:false,
   pq:`Errada. A conclusão do ensino médio é requisito expresso, e a comprovação precisa constar dos registros da ANAC.`},
  {t:`Ter completado 18 anos e ter concluído o ensino médio.`, ok:true,
   pq:`Correta, conforme a seção 61.73. Atenção à diferença: para se INSCREVER no exame teórico basta estar cursando o ensino médio; para receber a LICENÇA é preciso tê-lo concluído. E a licença de aluno piloto pode ser concedida a partir dos 16 anos, com termo de responsabilidade assinado pelo responsável.`}
 ]},

{id:`REG-05`, m:`REG`, dif:3,
 obj:`Explique a estrutura do RBAC 61.`,
 p:`Qual é a experiência mínima de voo exigida pelo RBAC 61 para a concessão da licença de piloto privado na categoria AVIÃO?`,
 alts:[
  {t:`40 horas de instrução e voo solo, ou 35 horas se todas forem realizadas dentro de um curso de PP-A aprovado pela ANAC, cumprido de forma completa e ininterrupta.`, ok:true,
   pq:`Correta, conforme a seção 61.81. Dentro desse total há mínimos específicos: 20 h de duplo comando, 10 h de solo diurno (com 5 h de navegação), um voo de navegação de pelo menos 150 NM com dois pousos em aeródromos diferentes, 3 h de voo noturno com 10 decolagens e 10 pousos, e no máximo 5 h aproveitáveis em simulador.`},
  {t:`20 horas em qualquer situação.`, ok:false,
   pq:`Errada. Vinte horas é o mínimo de INSTRUÇÃO EM DUPLO COMANDO dentro do total, não o total exigido.`},
  {t:`60 horas, das quais 30 em voo solo.`, ok:false,
   pq:`Errada. Esses valores não correspondem ao RBAC 61 para piloto privado de avião.`},
  {t:`35 horas em qualquer situação, com ou sem curso aprovado.`, ok:false,
   pq:`Errada. A redução para 35 h é condicionada: só vale se a totalidade das horas for feita durante um curso aprovado pela ANAC, cumprido de forma completa, ininterrupta e com aproveitamento. Fora disso, o mínimo é 40 h.`}
 ]},

{id:`REG-06`, m:`REG`, dif:2,
 obj:`Declare os requisitos para um CMA.`,
 p:`Qual classe de Certificado Médico Aeronáutico é exigida do piloto privado, e em que momento da formação ele deve ser obtido?`,
 alts:[
  {t:`CMA de 1ª classe, obtido somente ao final do curso, junto com o exame de proficiência.`, ok:false,
   pq:`Errada nos dois pontos. A 1ª classe é exigida de piloto comercial, de linha aérea e de tripulação múltipla. E o certificado é pré-requisito para a instrução de voo, não etapa final.`},
  {t:`CMA de 2ª classe, que deve ser obtido antes de o aluno iniciar a parte prática do curso, ou seja, o treinamento de voo.`, ok:true,
   pq:`Correta. O CMA de 2ª classe cobre piloto privado, piloto privado com habilitação IFR e piloto de balão livre. Ele precede o voo porque não faz sentido investir em instrução prática sem antes verificar a aptidão psicofísica.`},
  {t:`CMA de 4ª classe, a mesma do piloto aerodesportivo.`, ok:false,
   pq:`Errada. A 4ª classe se aplica ao piloto aerodesportivo e ao piloto de planador, não ao piloto privado.`},
  {t:`CMA de 5ª classe, exigida de todos os pilotos de aeronaves civis.`, ok:false,
   pq:`Errada. A 5ª classe se destina ao piloto remoto de aeronave remotamente pilotada.`}
 ]},

{id:`REG-07`, m:`REG`, dif:2,
 obj:`O estado que a bordo de uma aeronave é o principal responsável pela operação da aeronave, de acordo com as Regras do Ar.`,
 p:`De acordo com as Regras do Ar (Anexo 2 da OACI), quem é o responsável final pela operação da aeronave e pela decisão quanto à sua disposição?`,
 alts:[
  {t:`O órgão de controle de tráfego aéreo que emitiu a autorização em vigor.`, ok:false,
   pq:`Errada. O ATC provê separação e autorizações, mas não assume a responsabilidade pela condução da aeronave, que permanece com o comandante.`},
  {t:`O operador (empresa ou proprietário), que responde por todas as decisões de voo.`, ok:false,
   pq:`Errada. O operador tem obrigações próprias de manutenção, documentação e organização, mas a autoridade sobre a operação em curso é do PIC.`},
  {t:`O piloto em comando, que responde pela operação em conformidade com as Regras do Ar e tem a autoridade final sobre a aeronave.`, ok:true,
   pq:`Correta. A autoridade é do PIC, e ela é indelegável. Uma autorização do ATC não transfere essa responsabilidade: se a autorização não for satisfatória ou segura, cabe ao PIC recusá-la e solicitar outra.`},
  {t:`O despachante operacional de voo, quando houver.`, ok:false,
   pq:`Errada. O DOV divide com o comandante a responsabilidade pelo planejamento em certas operações, mas a autoridade final a bordo é sempre do PIC.`}
 ]},

{id:`REG-08`, m:`REG`, dif:3,
 obj:`Indique os requisitos básicos de altura mínima para o voo sobre áreas congestionadas de cidades, vilas ou povoações, ou sobre uma reunião de pessoas ao ar livre.`,
 p:`Segundo as Regras do Ar (Anexo 2), qual é a altura mínima para sobrevoar áreas congestionadas de cidades, vilas ou povoações, ou aglomerações de pessoas ao ar livre — salvo decolagem e pouso?`,
 alts:[
  {t:`150 m (500 ft) acima do solo, em qualquer situação.`, ok:false,
   pq:`Errada para área congestionada. Esse é o mínimo aplicável FORA das áreas congestionadas, e a referência lá é o solo ou a água.`},
  {t:`600 m (2.000 ft) acima do obstáculo mais alto num raio de 300 m.`, ok:false,
   pq:`Errada. Os números 600 e 300 foram trocados de lugar: 300 m é a altura, 600 m é o raio.`},
  {t:`Não há altura mínima para voo VFR diurno.`, ok:false,
   pq:`Errada. As alturas mínimas se aplicam independentemente da regra de voo; existem justamente para proteger pessoas e bens no solo.`},
  {t:`300 m (1.000 ft) acima do obstáculo mais alto situado num raio de 600 m em torno da aeronave.`, ok:true,
   pq:`Correta. A referência não é o solo, e sim o obstáculo mais alto dentro do raio de 600 m. Fora de áreas congestionadas, o mínimo cai para 150 m (500 ft) acima do solo ou da água. Verifique sempre as regras nacionais aplicáveis, que podem ser mais restritivas.`}
 ]},

{id:`REG-09`, m:`REG`, dif:3,
 obj:`Explique a limitação de proximidade a outras aeronaves e as regras de direito de passagem, incluindo posições de espera na pista e barras de parada iluminadas.`,
 p:`Duas aeronaves se aproximam de frente, aproximadamente no mesmo nível, com risco de colisão. Qual é o procedimento correto?`,
 alts:[
  {t:`Ambas alteram o rumo para a DIREITA.`, ok:true,
   pq:`Correta. Na aproximação frontal não há preferência: as duas manobram, e sempre para a direita. Se apenas uma manobrasse, ou se cada uma escolhesse um lado, a manobra poderia se anular.`},
  {t:`Ambas alteram o rumo para a esquerda.`, ok:false,
   pq:`Errada. A convenção é para a direita, e é universal justamente para que a manobra de uma seja previsível para a outra.`},
  {t:`A aeronave mais rápida mantém rumo e a mais lenta desvia.`, ok:false,
   pq:`Errada. Velocidade não estabelece prioridade nas Regras do Ar.`},
  {t:`A aeronave que estiver mais alta desce e a mais baixa sobe.`, ok:false,
   pq:`Errada, e perigosa. Manobra vertical não coordenada em rota de colisão frontal é justamente o que pode transformar um quase-encontro em colisão.`}
 ]},

{id:`REG-10`, m:`REG`, dif:2,
 obj:`Explique a limitação de proximidade a outras aeronaves e as regras de direito de passagem, incluindo posições de espera na pista e barras de parada iluminadas.`,
 p:`Segundo as Regras do Ar, qual é a ordem de prioridade (direito de passagem) entre as categorias de aeronaves?`,
 alts:[
  {t:`Balões cedem passagem a aviões, porque estes são mais rápidos.`, ok:false,
   pq:`Errada, e inverte a lógica. Velocidade não dá prioridade; capacidade de manobra é que define, e o balão é o menos capaz de desviar.`},
  {t:`Aeronaves motorizadas mais pesadas que o ar cedem passagem a dirigíveis, planadores e balões; dirigíveis cedem a planadores e balões; planadores cedem a balões.`, ok:true,
   pq:`Correta. A lógica da hierarquia é a capacidade de manobra: quanto menos a aeronave pode manobrar para evitar, mais prioridade ela tem. O balão, que praticamente não controla sua trajetória horizontal, está no topo.`},
  {t:`A prioridade é sempre da aeronave de maior peso máximo de decolagem.`, ok:false,
   pq:`Errada. Peso não é critério de direito de passagem nas Regras do Ar.`},
  {t:`Não há hierarquia entre categorias; vale sempre quem tiver a outra à sua direita.`, ok:false,
   pq:`Errada. A regra de ceder passagem a quem está à direita se aplica entre aeronaves convergindo aproximadamente no mesmo nível e da mesma categoria — mas a hierarquia entre categorias existe e prevalece.`}
 ]},

{id:`REG-11`, m:`REG`, dif:3,
 obj:`Descreva as Regras de Voo Visual conforme consta no Capítulo 4 do Anexo 2 da ICAO.`,
 p:`Nas Regras de Voo Visual do Anexo 2, em baixos níveis (em ou abaixo de 900 m / 3.000 ft AMSL, ou 300 m / 1.000 ft acima do terreno, o que for mais alto), qual é a condição de afastamento das nuvens aplicável a determinadas classes de espaço aéreo?`,
 alts:[
  {t:`Manter 1.500 m na horizontal e 300 m (1.000 ft) na vertical em relação às nuvens, em qualquer altitude.`, ok:false,
   pq:`Errada como regra universal. Esses são os afastamentos aplicáveis nos níveis mais altos; em baixos níveis o critério muda justamente para livre de nuvens e superfície à vista.`},
  {t:`Não há exigência de afastamento das nuvens em voo VFR; basta a visibilidade.`, ok:false,
   pq:`Errada. Afastamento das nuvens é parte integrante das condições meteorológicas de voo visual, junto com a visibilidade.`},
  {t:`Voar livre de nuvens e com a superfície à vista, mantendo a visibilidade mínima aplicável.`, ok:true,
   pq:`Correta. Em baixos níveis o critério deixa de ser uma distância numérica das nuvens e passa a ser "livre de nuvens e com a superfície à vista", que é o que garante referência visual para navegar e evitar o terreno. ATENÇÃO: no Brasil os valores e as classes aplicáveis são detalhados pelo DECEA (ICA 100-12) e publicados no AIP — confira sempre a regra nacional vigente antes de voar.`},
  {t:`É permitido atravessar nuvens em VFR desde que por menos de 30 segundos.`, ok:false,
   pq:`Errada, e não existe tal tolerância. Entrar em nuvem sem estar em IFR e sem habilitação e equipamento adequados é uma das causas mais frequentes de acidente fatal na aviação geral.`}
 ]},

{id:`REG-12`, m:`REG`, dif:3,
 obj:`Defina quando os níveis de cruzeiro devem ser expressos em termos de níveis de voo (FL).`,
 p:`Pela tabela de níveis de cruzeiro do Anexo 2, qual é o critério que determina os níveis apropriados a um voo?`,
 alts:[
  {t:`A velocidade de cruzeiro: aeronaves mais rápidas voam nos níveis mais altos.`, ok:false,
   pq:`Errada. Velocidade não entra na tabela de níveis de cruzeiro.`},
  {t:`A categoria da aeronave: monomotores em níveis ímpares e multimotores em pares.`, ok:false,
   pq:`Errada. Número de motores não é critério da regra semicircular.`},
  {t:`A hora do voo: níveis pares pela manhã e ímpares à tarde.`, ok:false,
   pq:`Errada. Não existe critério horário para escolha de nível de cruzeiro.`},
  {t:`A rota (derrota) MAGNÉTICA: de 000° a 179° usam-se níveis de uma série, e de 180° a 359°, os da outra série; voos VFR acrescentam 500 ft aos níveis do IFR.`, ok:true,
   pq:`Correta. É a regra semicircular. Ela separa verticalmente tráfegos que voam em sentidos opostos, e o acréscimo de 500 ft mantém o VFR afastado dos níveis usados pelo IFR. A referência é a derrota magnética, não a proa.`}
 ]},

{id:`REG-13`, m:`REG`, dif:2,
 obj:`Descreva o significado dos sinais de luz exibidos para e pela aeronave.`,
 p:`Uma aeronave em voo, sem rádio, recebe da torre de controle um sinal luminoso VERMELHO CONTÍNUO. O que ele significa?`,
 alts:[
  {t:`Ceda passagem a outra aeronave e continue circulando.`, ok:true,
   pq:`Correta. Para aeronave em voo, o vermelho contínuo determina ceder passagem e prosseguir no circuito. Para aeronave no solo, o mesmo sinal significa parar. É por isso que o significado dos sinais luminosos precisa ser memorizado em duas colunas: em voo e no solo.`},
  {t:`Autorizado a pousar.`, ok:false,
   pq:`Errada. Autorização de pouso, para aeronave em voo, é o VERDE contínuo.`},
  {t:`Aeródromo inseguro, não pouse.`, ok:false,
   pq:`Errada. Esse é o significado do vermelho INTERMITENTE, não do contínuo.`},
  {t:`Retorne para pouso.`, ok:false,
   pq:`Errada. Retornar para pouso é indicado por lampejos VERDES.`}
 ]},

{id:`REG-14`, m:`REG`, dif:2,
 obj:`Explique os procedimentos para fechar um plano de voo.`,
 p:`Por que o encerramento (fechamento) do plano de voo após o pouso é obrigatório e importante?`,
 alts:[
  {t:`Porque o encerramento é o que registra as horas de voo na caderneta do piloto.`, ok:false,
   pq:`Errada. O registro de horas é feito na CIV Digital, por responsabilidade do piloto, sem relação com o encerramento do plano.`},
  {t:`Porque a ausência de encerramento faz o sistema presumir que a aeronave pode estar em dificuldade, disparando as fases de emergência e a mobilização de busca e salvamento.`, ok:true,
   pq:`Correta. O plano de voo é também um mecanismo de proteção: se a aeronave não se reporta no tempo esperado, o serviço de alerta inicia as fases INCERFA, ALERFA e DETRESFA. Esquecer de encerrar aciona uma operação de busca desnecessária e cara.`},
  {t:`Porque sem o encerramento a aeronave não pode ser reabastecida.`, ok:false,
   pq:`Errada. Não há vínculo entre encerramento de plano de voo e abastecimento.`},
  {t:`Porque o encerramento gera a cobrança das tarifas de navegação aérea.`, ok:false,
   pq:`Errada quanto à finalidade. Ainda que haja processos administrativos associados ao voo, a razão do encerramento é a segurança, não a cobrança.`}
 ]},

{id:`REG-15`, m:`REG`, dif:3,
 obj:`Defina o termo ‘altitude de transição’.`,
 p:`Qual é a diferença entre ALTITUDE DE TRANSIÇÃO, NÍVEL DE TRANSIÇÃO e CAMADA DE TRANSIÇÃO?`,
 alts:[
  {t:`São três nomes para a mesma coisa, usados conforme o país.`, ok:false,
   pq:`Errada. São três conceitos distintos e complementares, e confundi-los leva a erro de ajuste de altímetro.`},
  {t:`Altitude de transição é fixa em 18.000 ft no mundo inteiro.`, ok:false,
   pq:`Errada. Esse valor é característico do espaço aéreo dos Estados Unidos. A altitude de transição é publicada por Estado e por região, e no Brasil deve ser consultada no AIP e nas cartas.`},
  {t:`Altitude de transição é a altitude na qual, ou abaixo da qual, a posição vertical é expressa em altitude; nível de transição é o nível de voo mais baixo utilizável acima dela; camada de transição é o espaço entre os dois.`, ok:true,
   pq:`Correta. Na prática: subindo, ao passar a altitude de transição, ajusta-se 1013,25 hPa e passa-se a falar em níveis de voo. Descendo, ao passar o nível de transição, ajusta-se o QNH e volta-se a falar em altitude. A camada entre eles é apenas de passagem — não se voa nivelado nela.`},
  {t:`Nível de transição é sempre 1.000 ft acima da altitude de transição.`, ok:false,
   pq:`Errada. A diferença não é fixa: o nível de transição varia com o QNH do momento, podendo se afastar mais ou menos da altitude de transição.`}
 ]},

{id:`REG-16`, m:`REG`, dif:2,
 obj:`Indique o modo e o código do transponder para indicar: um estado de emergência; uma falha de comunicação; interferência ilegal.`,
 p:`Quais códigos de transponder correspondem, respectivamente, a emergência, falha de comunicação e interferência ilícita?`,
 alts:[
  {t:`7500, 7600 e 7700.`, ok:false,
   pq:`Errada. Emergência e interferência ilícita estão trocadas: 7500 é interferência ilícita e 7700 é emergência.`},
  {t:`7000, 7100 e 7200.`, ok:false,
   pq:`Errada. Esses não são códigos de emergência. O 7000 é, em várias regiões, o código convencional para voo VFR sem código específico atribuído.`},
  {t:`1200, 1300 e 1400.`, ok:false,
   pq:`Errada. Não são códigos de emergência internacionais; 1200 é o código VFR usado nos Estados Unidos.`},
  {t:`7700, 7600 e 7500.`, ok:true,
   pq:`Correta. Vale memorizar por ordem decrescente com a gravidade percebida pelo controle: 7700 emergência, 7600 rádio mudo, 7500 sequestro ou interferência ilícita. Um mnemônico comum: sete-sete cai do céu, sete-seis não ouço, sete-cinco fui levado.`}
 ]},

{id:`REG-17`, m:`REG`, dif:2,
 obj:`Cite todas as classes de espaço aéreo em que o ATC será fornecido.`,
 p:`O que caracteriza o espaço aéreo CLASSE G quanto aos serviços prestados?`,
 alts:[
  {t:`É espaço aéreo não controlado: não se presta serviço de controle de tráfego aéreo, apenas serviço de informação de voo e de alerta, e não é necessária autorização do ATC para voar nele.`, ok:true,
   pq:`Correta. Classe G é o espaço aéreo não controlado. Sem controle não há separação provida por terceiros: a responsabilidade de ver e evitar é integralmente da tripulação. O serviço de informação de voo continua disponível e deve ser usado.`},
  {t:`É o espaço aéreo mais restritivo, onde só é permitido voo IFR com autorização.`, ok:false,
   pq:`Errada. Essa descrição corresponde à classe A, onde apenas o voo IFR é permitido e a separação é provida a todos.`},
  {t:`É espaço aéreo controlado em que o VFR é proibido.`, ok:false,
   pq:`Errada. Classe G não é controlado, e o VFR é justamente o tipo de operação mais comum nele.`},
  {t:`É o espaço aéreo em que a separação entre todas as aeronaves é garantida pelo controle.`, ok:false,
   pq:`Errada. Separação provida a todos é característica das classes controladas mais restritivas, não da G.`}
 ]},

{id:`REG-18`, m:`REG`, dif:2,
 obj:`Forneça o significado da sigla ATIS em linguagem simples.`,
 p:`O que é o ATIS e qual sua finalidade?`,
 alts:[
  {t:`É a frequência de emergência internacional para aeronaves em dificuldade.`, ok:false,
   pq:`Errada. A frequência internacional de emergência em VHF é 121,5 MHz, e não tem relação com o ATIS.`},
  {t:`É o serviço automático de informação terminal: uma transmissão gravada e repetitiva com informações essenciais e rotineiras do aeródromo, que reduz a carga de comunicação nas frequências operacionais.`, ok:true,
   pq:`Correta. Ao ouvir o ATIS antes de chamar o órgão, o piloto já sabe a pista em uso, o vento, as condições meteorológicas e os avisos vigentes — e informa a letra da mensagem recebida para confirmar que está atualizado.`},
  {t:`É o serviço de controle de aproximação por radar.`, ok:false,
   pq:`Errada. Controle de aproximação é serviço prestado por controlador em tempo real; o ATIS é gravado e unidirecional.`},
  {t:`É o boletim meteorológico de área emitido pelos centros meteorológicos, válido por 24 horas.`, ok:false,
   pq:`Errada. O ATIS é local e do aeródromo; boletins de área são produtos meteorológicos distintos.`}
 ]},

{id:`REG-19`, m:`REG`, dif:3,
 obj:`Demonstrar conhecimento do significado das expressões INCERFA, ALERFA e DETRESFA.`,
 p:`Qual é a ordem correta das fases de emergência do serviço de alerta, da menos para a mais grave?`,
 alts:[
  {t:`DETRESFA, ALERFA e INCERFA.`, ok:false,
   pq:`Errada — a ordem está invertida. DETRESFA é a fase mais grave, não a inicial.`},
  {t:`ALERFA, INCERFA e DETRESFA.`, ok:false,
   pq:`Errada. As duas primeiras estão trocadas: a incerteza precede o alerta.`},
  {t:`INCERFA (incerteza), ALERFA (alerta) e DETRESFA (perigo ou socorro).`, ok:true,
   pq:`Correta. A escalada é progressiva: começa quando há dúvida sobre a segurança da aeronave, avança quando há apreensão fundamentada, e chega ao perigo quando há razoável certeza de ameaça grave e iminente. A falta de encerramento do plano de voo é uma das causas típicas de disparo da primeira fase.`},
  {t:`INCERFA, DETRESFA e ALERFA.`, ok:false,
   pq:`Errada. DETRESFA é sempre a última fase da escalada, não a intermediária.`}
 ]},

{id:`REG-20`, m:`REG`, dif:2,
 obj:`Resuma as informações essenciais que levam à emissão de um NOTAM.`,
 p:`O que é um NOTAM e que tipo de informação ele veicula?`,
 alts:[
  {t:`É a previsão meteorológica de aeródromo válida por 24 ou 30 horas.`, ok:false,
   pq:`Errada. Essa é a definição do TAF, produto meteorológico. NOTAM é informação aeronáutica, não meteorológica.`},
  {t:`É o relatório de acidente aeronáutico publicado ao final da investigação.`, ok:false,
   pq:`Errada. Relatórios de investigação são publicados pelo órgão de investigação (no Brasil, o SIPAER) e não têm relação com o NOTAM.`},
  {t:`É a autorização de voo emitida pelo órgão de controle antes da decolagem.`, ok:false,
   pq:`Errada. Autorização ATC é comunicação dirigida a uma aeronave específica; NOTAM é publicação de alcance geral.`},
  {t:`É um aviso distribuído por meio de telecomunicações com informação sobre o estabelecimento, condição ou alteração de instalação, serviço, procedimento ou perigo aeronáutico, cujo conhecimento oportuno é essencial ao pessoal de operações de voo.`, ok:true,
   pq:`Correta. O NOTAM existe para o que é temporário, urgente ou de curta antecedência — pista interditada, auxílio fora de serviço, área temporariamente restrita. O que é permanente e previsível vai para o AIP ou para uma emenda AIP.`}
 ]},

{id:`REG-21`, m:`REG`, dif:3,
 obj:`Informar a sequência de emissão dos AIRAC e quantos dias antes da data de entrada em vigor a informação será distribuída pelo AIS.`,
 p:`Qual é a finalidade do sistema AIRAC na publicação de informação aeronáutica?`,
 alts:[
  {t:`Padronizar as datas de entrada em vigor de alterações operacionalmente significativas, distribuindo a informação com bastante antecedência (pelo menos 42 dias antes da data efetiva) para que operadores e sistemas possam se preparar.`, ok:true,
   pq:`Correta. O AIRAC trabalha com um calendário fixo de datas efetivas espaçadas de 28 dias. A antecedência mínima de 42 dias existe para que a informação chegue às mãos de quem opera com pelo menos 28 dias de folga, permitindo atualizar cartas, bancos de dados de navegação e procedimentos.`},
  {t:`Publicar informações de última hora, com efeito imediato, sobre perigos à navegação.`, ok:false,
   pq:`Errada. Informação urgente e de curto prazo é veiculada por NOTAM. O AIRAC é justamente o contrário: mudança planejada, com antecedência.`},
  {t:`Registrar as ocorrências de tráfego aéreo para fins estatísticos.`, ok:false,
   pq:`Errada. O AIRAC não tem função estatística; é um regime de publicação e controle de informação aeronáutica.`},
  {t:`Definir as datas de validade dos certificados médicos aeronáuticos.`, ok:false,
   pq:`Errada. Validade de CMA é matéria do RBAC 67, sem relação alguma com o ciclo AIRAC.`}
 ]},

{id:`REG-22`, m:`REG`, dif:3,
 obj:`Determine se uma determinada ocorrência deve ser definida como um incidente sério ou um acidente.`,
 p:`Segundo o Anexo 13 da OACI, o que distingue um ACIDENTE de um INCIDENTE GRAVE?`,
 alts:[
  {t:`O acidente ocorre em voo e o incidente grave ocorre no solo.`, ok:false,
   pq:`Errada. Ambos podem ocorrer no solo ou em voo. O período considerado vai do embarque da primeira pessoa com intenção de voo até o desembarque de todas.`},
  {t:`No acidente houve lesão grave ou fatal a pessoa, dano estrutural significativo à aeronave ou aeronave desaparecida ou inacessível; no incidente grave, as circunstâncias indicam que houve alta probabilidade de acidente, mas ele não ocorreu.`, ok:true,
   pq:`Correta. A diferença é o resultado, não a gravidade do risco. Um quase-choque em rota, uma decolagem de pista errada ou uma pane que quase levou à perda da aeronave podem constituir incidente grave — a consequência não se materializou, mas esteve perto.`},
  {t:`O acidente envolve aeronave comercial e o incidente grave, aeronave particular.`, ok:false,
   pq:`Errada. A classificação independe da natureza da operação.`},
  {t:`O incidente grave é aquele em que não houve investigação.`, ok:false,
   pq:`Errada. Incidentes graves são justamente ocorrências que devem ser investigadas, pelo valor preventivo que carregam.`}
 ]},

{id:`REG-23`, m:`REG`, dif:2,
 obj:`Explique a aplicabilidade da Lei nº 7.565/1986 e da Lei nº 11.182/2005.`,
 p:`Qual é o objeto de cada uma dessas duas leis do marco regulatório brasileiro?`,
 alts:[
  {t:`A Lei nº 7.565/1986 criou a ANAC e a Lei nº 11.182/2005 é o Código Brasileiro de Aeronáutica.`, ok:false,
   pq:`Errada — os objetos estão invertidos. Basta lembrar das datas: a ANAC foi criada em 2005, e o CBA é de 1986, quando ainda não existia agência reguladora.`},
  {t:`Ambas tratam exclusivamente da profissão de aeronauta.`, ok:false,
   pq:`Errada. A profissão de aeronauta é disciplinada pela Lei nº 13.475/2017.`},
  {t:`A Lei nº 7.565/1986 é o Código Brasileiro de Aeronáutica, que disciplina a aviação civil no país; a Lei nº 11.182/2005 criou a ANAC e definiu suas competências.`, ok:true,
   pq:`Correta. O CBA é a lei geral e antiga, que trata de aeronaves, aeródromos, tripulantes, responsabilidade civil e infrações. A Lei 11.182/2005 é posterior e institucional: criou a agência reguladora que hoje edita os RBAC e as IS.`},
  {t:`A Lei nº 11.182/2005 é o regulamento de tráfego aéreo brasileiro.`, ok:false,
   pq:`Errada. Regras de tráfego aéreo no Brasil são disciplinadas por normas do DECEA/Comando da Aeronáutica, e não por essa lei.`}
 ]},

{id:`REG-24`, m:`REG`, dif:2,
 obj:`Nomeie as definições feitas pela Lei nº 13.475/2017.`,
 p:`O que disciplina a Lei nº 13.475/2017?`,
 alts:[
  {t:`A criação da Agência Nacional de Aviação Civil.`, ok:false,
   pq:`Errada. A ANAC foi criada pela Lei nº 11.182/2005.`},
  {t:`As regras de investigação de acidentes aeronáuticos.`, ok:false,
   pq:`Errada. O sistema de investigação e prevenção de acidentes aeronáuticos é disciplinado pelo Decreto nº 9.540/2018 e pelas normas do SIPAER.`},
  {t:`Os requisitos de aeronavegabilidade das aeronaves civis.`, ok:false,
   pq:`Errada. Aeronavegabilidade é matéria dos RBAC específicos e do Anexo 8 da OACI.`},
  {t:`O exercício da profissão de tripulante de aeronave, o chamado aeronauta.`, ok:true,
   pq:`Correta. Ela define quem é aeronauta, quais são as funções a bordo e regula jornada, tempo de voo, repousos e demais condições de trabalho da tripulação. Substituiu a antiga Lei do Aeronauta.`}
 ]},

{id:`REG-25`, m:`REG`, dif:2, nota:`Regra atual conforme a IS 00-003, Revisão H, em vigor desde 01/03/2025. Material anterior a essa data pode trazer critérios diferentes.`,
 obj:`Entenda a diferença entre o RBAC 61 e os meios aceitáveis de atendimento (Instrução Suplementar – IS) e de materiais de orientação em relação ao RBAC 61.`,
 p:`Pela regra em vigor dos exames teóricos da ANAC, qual é o critério de aprovação no exame de piloto privado de avião?`,
 alts:[
  {t:`No mínimo 70% de acertos em CADA uma das cinco provas, avaliadas separadamente — não existe média entre matérias.`, ok:true,
   pq:`Correta. Como cada prova tem 20 questões, são necessários pelo menos 14 acertos em cada uma. Ir muito bem em Meteorologia não compensa ficar em 13 acertos em Navegação: a matéria é avaliada isoladamente.`},
  {t:`No mínimo 70% de acertos na média das cinco provas, ou seja, 70 acertos no total de 100 questões.`, ok:false,
   pq:`Errada, e é o mal-entendido mais caro dessa prova. Não há média. Um candidato com 90 acertos no total pode ser reprovado se numa única matéria ficou abaixo de 14.`},
  {t:`No mínimo 60% de acertos em cada prova.`, ok:false,
   pq:`Errada. O critério é 70%, e não 60%.`},
  {t:`No mínimo 50% no total, desde que nenhuma matéria fique zerada.`, ok:false,
   pq:`Errada. Não existe critério de 50% nem de mínimo por zeramento nos exames teóricos da ANAC.`}
 ]},

{id:`REG-26`, m:`REG`, dif:3, nota:`Regra atual conforme a IS 00-003, Revisão H, em vigor desde 01/03/2025. Material anterior a essa data pode trazer critérios diferentes.`,
 obj:`Entenda a diferença entre o RBAC 61 e os meios aceitáveis de atendimento (Instrução Suplementar – IS) e de materiais de orientação em relação ao RBAC 61.`,
 p:`No exame teórico de piloto privado de avião (5 provas), em que condição o candidato recebe o resultado SEGUNDA ÉPOCA (2EP) em vez de reprovado?`,
 alts:[
  {t:`Quando fica abaixo de 70% em até 4 provas, desde que tenha sido aprovado em pelo menos uma.`, ok:false,
   pq:`Errada. Com 5 provas o limite é 2, e não 4. Reprovar em 3 ou mais significa refazer o exame completo.`},
  {t:`Quando fica abaixo de 70% em no máximo 2 provas, tendo atingido pelo menos 30% de acertos em cada uma dessas provas.`, ok:true,
   pq:`Correta. A IS define o limite como um número inteiro de provas menor ou igual a (N−1)/2, onde N é o total de provas. Com N = 5, o limite é 2. E em cada prova não aprovada é preciso ter atingido o piso mínimo. Na segunda época o candidato repete apenas as matérias reprovadas, uma única vez, com prazo de inscrição de até 90 dias corridos contados do primeiro exame.`},
  {t:`Sempre que reprovar, independentemente do número de matérias e da nota obtida nelas.`, ok:false,
   pq:`Errada. A segunda época é um benefício condicionado; fora das condições, o resultado é reprovação e o exame completo precisa ser refeito.`},
  {t:`Quando o candidato solicita formalmente à ANAC a revisão de seu resultado.`, ok:false,
   pq:`Errada. A segunda época decorre automaticamente do desempenho, não de requerimento. Pedido de revisão é matéria de recurso, que segue rito próprio e prazos distintos.`}
 ]}
];
/* =====================================================================
   REG — LOTE 2: Direito internacional, aeronavegabilidade, marcas,
   licenciamento (RBAC 61) e certificação médica.
   Objetivos: Apêndice D da IS 00-003H, seção REG E AAREG.
   Questões ORIGINAIS. Nenhuma copiada ou reconstruída de prova real.
   ===================================================================== */
const Q_REG2 = [
{id:`REG-27`, m:`REG`, dif:2,
 obj:`Familiarize-se com a hierarquia das publicações da ICAO (SARP, Doc).`,
 p:`O que são os ANEXOS à Convenção de Chicago e qual seu valor normativo para um Estado contratante?`,
 alts:[
  {t:`São tratados autônomos que substituem a legislação nacional do Estado.`, ok:false,
   pq:`Errada. Os Anexos não revogam nem substituem lei interna; eles são incorporados ao ordenamento de cada Estado pela via que aquele Estado escolher — no Brasil, tipicamente por RBAC e por normas do Comando da Aeronáutica.`},
  {t:`São recomendações sem qualquer efeito, servindo apenas de referência acadêmica.`, ok:false,
   pq:`Errada. Ignora a distinção central: dentro dos Anexos há Normas (Standards), cujo cumprimento é obrigatório, e Práticas Recomendadas, cuja adoção é desejável. Nenhuma delas é meramente acadêmica.`},
  {t:`São conjuntos de Normas e Práticas Recomendadas (SARP) que os Estados devem aplicar, notificando à OACI qualquer diferença que mantenham em relação a elas.`, ok:true,
   pq:`Correta. A obrigação central não é a uniformidade absoluta, e sim a TRANSPARÊNCIA: o Estado que não puder cumprir uma Norma deve notificar a diferença, que é então publicada no AIP. É por isso que o AIP brasileiro traz uma seção de diferenças em relação aos Anexos.`},
  {t:`São documentos internos da OACI, sem publicação para os Estados.`, ok:false,
   pq:`Errada. Os Anexos são públicos e são a base sobre a qual cada autoridade constrói sua regulamentação nacional.`}
 ]},

{id:`REG-28`, m:`REG`, dif:2,
 obj:`Descreva os objetivos da OACI.`,
 p:`Qual é o papel da OACI (ICAO) em relação à aviação civil internacional?`,
 alts:[
  {t:`Operar o controle de tráfego aéreo internacional em rotas oceânicas.`, ok:false,
   pq:`Errada. Controle de tráfego aéreo é sempre prestado por órgãos dos Estados ou por entidades por eles designadas — no Brasil, o DECEA. A OACI não opera tráfego.`},
  {t:`Emitir licenças de piloto válidas em todos os Estados contratantes.`, ok:false,
   pq:`Errada. Licenças são emitidas pelo Estado de registro ou pelo Estado do titular. O que a Convenção prevê é o RECONHECIMENTO mútuo de licenças emitidas conforme os padrões, não a emissão pela OACI.`},
  {t:`Certificar aeronaves e conceder certificados de aeronavegabilidade.`, ok:false,
   pq:`Errada. Certificado de aeronavegabilidade é emitido pelo Estado de registro da aeronave, seguindo padrões do Anexo 8. A OACI estabelece os padrões, não os certificados.`},
  {t:`Desenvolver princípios e técnicas da navegação aérea internacional e fomentar o planejamento e o desenvolvimento do transporte aéreo, padronizando por meio de SARP.`, ok:true,
   pq:`Correta. A OACI é órgão de padronização e cooperação entre Estados. Ela não fiscaliza operadores nem emite licenças: quem faz isso é a autoridade de aviação civil de cada país — no Brasil, a ANAC.`}
 ]},

{id:`REG-29`, m:`REG`, dif:2,
 obj:`Explique a combinação de nacionalidade e marcas de registro (sequência, uso de hífen).`,
 p:`As marcas de nacionalidade e matrícula de uma aeronave civil brasileira seguem qual formato?`,
 alts:[
  {t:`A marca de nacionalidade seguida da marca de matrícula, separadas por hífen — por exemplo, PP-XXX ou PR-XXX.`, ok:true,
   pq:`Correta. A marca de nacionalidade identifica o Estado de registro; a de matrícula identifica a aeronave individualmente dentro daquele Estado. O hífen entre as duas é parte do padrão do Anexo 7.`},
  {t:`Uma sequência única de cinco letras sem hífen, atribuída pela OACI.`, ok:false,
   pq:`Errada em dois pontos: o hífen separa a marca de nacionalidade da de matrícula, e a atribuição é feita pelo Estado de registro, não pela OACI.`},
  {t:`Apenas números, precedidos da sigla do Estado.`, ok:false,
   pq:`Errada. A marca de matrícula brasileira é alfabética. Marcas puramente numéricas existem em outros Estados, mas não é o caso do Brasil.`},
  {t:`A marca é livre, escolhida pelo proprietário, desde que não se repita.`, ok:false,
   pq:`Errada. A atribuição é feita pela autoridade de aviação civil no ato do registro, ainda que em alguns casos haja possibilidade de solicitar uma sequência específica disponível.`}
 ]},

{id:`REG-30`, m:`REG`, dif:2,
 obj:`Descreva como um certificado de aeronavegabilidade pode ser renovado ou permanecer válido.`,
 p:`O que mantém válido o Certificado de Aeronavegabilidade de uma aeronave?`,
 alts:[
  {t:`O pagamento anual da taxa de registro da aeronave.`, ok:false,
   pq:`Errada. Obrigações de registro e obrigações de aeronavegabilidade são independentes; nenhuma taxa substitui manutenção.`},
  {t:`O cumprimento do programa de manutenção aplicável, das diretrizes de aeronavegabilidade e das demais condições estabelecidas pela autoridade — ou seja, a manutenção da aeronavegabilidade continuada.`, ok:true,
   pq:`Correta. O certificado atesta que a aeronave está em condição segura de voo; ele deixa de produzir efeito se a aeronave sai dessa condição. Não basta o papel estar dentro do prazo: inspeções vencidas ou diretriz de aeronavegabilidade não cumprida tornam a aeronave inaeronavegável.`},
  {t:`A simples apresentação do documento a bordo em cada voo.`, ok:false,
   pq:`Errada. Portar o documento é obrigação, mas não é o que o mantém válido.`},
  {t:`A realização de um voo de verificação a cada 12 meses pelo proprietário.`, ok:false,
   pq:`Errada. Voo de verificação existe em situações específicas de manutenção ou certificação, mas não é o mecanismo geral de manutenção da validade.`}
 ]},

{id:`REG-31`, m:`REG`, dif:2,
 obj:`Descreva a obrigação de transportar e apresentar documentos (por exemplo, uma licença de tripulação de voo) sob o RBAC 61.`,
 p:`Um piloto privado é abordado numa inspeção em solo. Além dos documentos da aeronave, o que ele precisa poder apresentar quanto à sua própria habilitação?`,
 alts:[
  {t:`Apenas o comprovante de matrícula no aeroclube onde se formou.`, ok:false,
   pq:`Errada. Vínculo com escola não é documento de habilitação e não substitui licença nem certificado médico.`},
  {t:`Somente o certificado de conclusão do curso teórico.`, ok:false,
   pq:`Errada. O curso é etapa da formação; o que autoriza a voar é a licença concedida pela ANAC.`},
  {t:`Sua licença/CHT com as habilitações vigentes e o CMA válido e adequado à licença.`, ok:true,
   pq:`Correta. Conforme a seção 61.17 do RBAC 61, as prerrogativas da licença só podem ser exercidas com CMA válido e adequado, habilitações vigentes e experiência recente. A CHT Digital e a Consulta ao CMA no portal da ANAC são as formas de comprovar.`},
  {t:`Nada, porque a ANAC consulta os próprios sistemas.`, ok:false,
   pq:`Errada. Ainda que a ANAC consulte sua base, a obrigação de portar e apresentar documentação permanece com o piloto.`}
 ]},

{id:`REG-32`, m:`REG`, dif:3,
 obj:`Liste os dois fatores que são relevantes para o exercício dos privilégios de uma licença.`,
 p:`Segundo o RBAC 61, a licença de piloto privado tem prazo de validade?`,
 alts:[
  {t:`Sim, vence a cada 24 meses e precisa ser renovada com novo exame teórico.`, ok:false,
   pq:`Errada. Não há revalidação de licença por novo exame teórico. Os 24 meses aparecem em outro contexto: é a vigência da habilitação de CLASSE, e também o prazo em que a licença de aluno piloto perde validade.`},
  {t:`Sim, vence junto com o CMA.`, ok:false,
   pq:`Errada quanto ao mecanismo, embora o efeito prático se pareça. A licença não vence; o que acontece é que, com o CMA vencido, as prerrogativas não podem ser exercidas. Renovado o CMA, a licença volta a produzir efeitos sem precisar ser reemitida.`},
  {t:`Não, e uma vez concedida ela pode ser usada sem nenhuma outra condição.`, ok:false,
   pq:`Errada. A permanência da licença não elimina as três condições do 61.17: CMA, habilitações e experiência recente.`},
  {t:`Não. A licença de piloto é permanente, mas suas prerrogativas só podem ser exercidas com CMA válido, habilitações vigentes e experiência recente.`, ok:true,
   pq:`Correta, conforme 61.17. A distinção importa: a licença é um documento permanente; o que caduca são as condições para usá-la. A exceção é a licença de ALUNO piloto, que perde validade ao fim do vínculo com a escola ou 24 meses após a concessão.`}
 ]},

{id:`REG-33`, m:`REG`, dif:3,
 obj:`Explique os requisitos para as classificações de classe, sua validade e privilégios.`,
 p:`Qual é o prazo máximo de vigência da habilitação de CLASSE de um piloto, conforme o RBAC 61?`,
 alts:[
  {t:`24 meses, contados a partir do mês de aprovação no último exame de proficiência.`, ok:true,
   pq:`Correta, conforme 61.19(b)(1). Para o piloto privado de avião essa é a habilitação do dia a dia — MNTE, por exemplo. A contagem parte do mês da aprovação no último exame de proficiência, não da data de emissão do documento.`},
  {t:`12 meses.`, ok:false,
   pq:`Errada para a habilitação de classe. Doze meses é o prazo da habilitação de TIPO, da habilitação de voo por instrumentos e da de instrutor de voo.`},
  {t:`36 meses.`, ok:false,
   pq:`Errada. Trinta e seis meses é o prazo das habilitações relativas ao CPA, de planador e de balão livre — não da habilitação de classe comum.`},
  {t:`60 meses.`, ok:false,
   pq:`Errada. Esse prazo não aparece na seção 61.19 para nenhuma habilitação.`}
 ]},

{id:`REG-34`, m:`REG`, dif:3,
 obj:`Liste os dois fatores que são relevantes para o exercício dos privilégios de uma licença.`,
 p:`Para atuar como piloto em comando em voo DIURNO num avião monomotor terrestre, qual é o requisito de experiência recente do RBAC 61?`,
 alts:[
  {t:`Ter realizado, nos 30 dias precedentes, 1 decolagem e 1 aterrissagem.`, ok:false,
   pq:`Errada. O prazo é de 90 dias, e o número mínimo é 3 e 3. Uma decolagem e uma aterrissagem é o requisito de balão livre e planador.`},
  {t:`Ter realizado, nos 90 dias precedentes, no mínimo 3 decolagens e 3 aterrissagens em aeronave da mesma categoria e classe/tipo, tendo efetivamente operado os comandos.`, ok:true,
   pq:`Correta, conforme 61.21(a)(1)(ii). Dois detalhes que costumam passar batido: as decolagens e pousos podem ter sido feitos de dia ou de noite para cumprir o requisito diurno, e é preciso ter operado os comandos — voar como passageiro no assento da direita não conta.`},
  {t:`Ter voado no mínimo 10 horas nos últimos 6 meses.`, ok:false,
   pq:`Errada. A experiência recente do 61.21 é contada em decolagens e aterrissagens, não em horas.`},
  {t:`Nenhum, desde que a habilitação de classe esteja vigente.`, ok:false,
   pq:`Errada. Vigência da habilitação e experiência recente são requisitos independentes, ambos exigidos pela seção 61.17 para o exercício das prerrogativas.`}
 ]},

{id:`REG-35`, m:`REG`, dif:3,
 obj:`Liste os dois fatores que são relevantes para o exercício dos privilégios de uma licença.`,
 p:`Um piloto fez 5 decolagens e 5 pousos diurnos há 20 dias. Ele pode atuar como piloto em comando em um voo NOTURNO?`,
 alts:[
  {t:`Sim, porque cumpriu o mínimo de 3 e 3 dentro dos 90 dias.`, ok:false,
   pq:`Errada. O requisito diurno foi cumprido, mas o noturno é um requisito SEPARADO e mais específico.`},
  {t:`Sim, desde que leve outro piloto a bordo.`, ok:false,
   pq:`Errada. Levar outro piloto não supre requisito de experiência recente do piloto em comando.`},
  {t:`Não. Para voo noturno são exigidas, nos 90 dias precedentes, no mínimo 3 decolagens e 3 aterrissagens realizadas no PERÍODO NOTURNO.`, ok:true,
   pq:`Correta, conforme 61.21(a)(2). É uma pegadinha frequente: pousos diurnos satisfazem o requisito diurno, mas apenas pousos noturnos satisfazem o noturno. A lógica é óbvia em voo — pousar de noite é outra habilidade.`},
  {t:`Não, porque voo noturno exige habilitação de voo por instrumentos.`, ok:false,
   pq:`Errada quanto ao motivo. O voo noturno VFR não exige, por si só, habilitação IFR; o que falta no caso é a experiência recente noturna.`}
 ]},

{id:`REG-36`, m:`REG`, dif:2,
 obj:`Indique as circunstâncias em que é necessário um endosso de proficiência na língua.`,
 p:`Quando o piloto privado brasileiro precisa comprovar proficiência linguística em inglês?`,
 alts:[
  {t:`Sempre, para qualquer voo, inclusive local.`, ok:false,
   pq:`Errada. Em voos domésticos com fraseologia em português a exigência não se aplica. O requisito é ligado à operação internacional.`},
  {t:`Nunca, porque a licença brasileira não exige inglês.`, ok:false,
   pq:`Errada. A exigência existe e está no próprio RBAC 61, com apêndice específico sobre o exame de proficiência linguística.`},
  {t:`Apenas para pilotos de linha aérea.`, ok:false,
   pq:`Errada. A exigência é vinculada à operação internacional, não ao grau da licença — um piloto privado que voe para o exterior está sujeito a ela.`},
  {t:`Para exercer as prerrogativas da licença em voos fora da jurisdição do espaço aéreo brasileiro, conforme a seção 61.10 do RBAC 61.`, ok:true,
   pq:`Correta. A regra segue o Anexo 1 da OACI: comunicações radiotelefônicas internacionais exigem nível mínimo de proficiência na língua inglesa. Em voo doméstico, com fraseologia em português, o requisito não se impõe.`}
 ]},

{id:`REG-37`, m:`REG`, dif:2,
 obj:`Defina o seguinte: categoria de aeronave, cross-country, tempo de instrução dupla, tempo de voo, piloto estudante em comando, tempo de instrumento, tempo de voo por instrumento, tempo de solo do instrumento, multi crew cooperation (MCC), aeronave multipiloto, noturno, piloto particular, verificação de proficiência, renovação, revalidação, teste de habilidade, tempo de voo individual, tipo de aeronave.`,
 p:`No vocabulário do RBAC 61, o que significa TEMPO DE VOO SOLO?`,
 alts:[
  {t:`O tempo de voo durante o qual o piloto é o ÚNICO ocupante da aeronave.`, ok:true,
   pq:`Correta. É definição literal do RBAC 61. Importa para os mínimos de experiência do piloto privado: das 40 (ou 35) horas, pelo menos 10 devem ser de voo solo diurno, com 5 delas em navegação.`},
  {t:`O tempo em que o piloto voa sem instrutor, ainda que com passageiros a bordo.`, ok:false,
   pq:`Errada. A presença de qualquer outro ocupante descaracteriza o voo solo, mesmo que não seja instrutor.`},
  {t:`O tempo de voo em que o piloto opera os comandos, mesmo com instrutor ao lado.`, ok:false,
   pq:`Errada. Com instrutor a bordo o tempo é de instrução em duplo comando, não solo.`},
  {t:`O tempo de voo registrado sem plano de voo apresentado.`, ok:false,
   pq:`Errada. Apresentação de plano de voo não tem relação com a classificação do tempo de voo.`}
 ]},

{id:`REG-38`, m:`REG`, dif:2,
 obj:`Descreva a relação e as diferenças entre o anexo 1 da OACI e o regulamento das tripulações aéreas.`,
 p:`O que é a CIV Digital e para que serve?`,
 alts:[
  {t:`É o certificado médico aeronáutico em formato eletrônico.`, ok:false,
   pq:`Errada. O certificado médico é o CMA, consultado em sistema próprio da ANAC. A CIV é registro de voo, não de saúde.`},
  {t:`É a Caderneta Individual de Voo Digital: o documento legal eletrônico em que se registram as horas de voo e os endossos do piloto.`, ok:true,
   pq:`Correta. É nela que a experiência é comprovada — inclusive as horas exigidas para a concessão da licença e o endosso do instrutor atestando aptidão para o exame de proficiência, endosso esse que vale 30 dias a partir do último voo de preparação.`},
  {t:`É a autorização eletrônica de voo emitida pelo órgão de controle.`, ok:false,
   pq:`Errada. Autorização de voo é emitida pelo ATC no momento da operação e nada tem a ver com a caderneta.`},
  {t:`É a licença digital do piloto, que substituiu a CHT em papel.`, ok:false,
   pq:`Errada. Quem substituiu a habilitação em papel foi a CHT Digital. A CIV é a caderneta individual de voo.`}
 ]},

{id:`REG-39`, m:`REG`, dif:2,
 obj:`Declare as ações a serem tomadas em caso de diminuição da aptidão médica.`,
 p:`Um piloto privado passa por uma cirurgia e está em uso de medicação que pode afetar sua atenção. Qual é a conduta correta?`,
 alts:[
  {t:`Continuar voando normalmente, já que o CMA está dentro do prazo de validade.`, ok:false,
   pq:`Errada. O CMA atesta a aptidão na data do exame. Condição médica superveniente ou medicação com efeito sobre o desempenho suspendem, de fato, a aptidão.`},
  {t:`Voar apenas em voos locais e de curta duração.`, ok:false,
   pq:`Errada. A limitação não é de duração ou distância: se a aptidão está comprometida, não se voa.`},
  {t:`Não exercer as prerrogativas da licença enquanto persistir a condição, e procurar orientação de médico examinador credenciado sobre sua aptidão.`, ok:true,
   pq:`Correta. A obrigação de autoavaliação é permanente e independe da data de validade impressa no CMA: um certificado dentro do prazo não atesta aptidão hoje. Voar sabendo de condição incapacitante é infração e, antes disso, é risco.`},
  {t:`Voar levando outro piloto habilitado como segurança.`, ok:false,
   pq:`Errada. Um piloto sem aptidão psicofísica não pode exercer as prerrogativas, ainda que haja outro piloto a bordo.`}
 ]},

{id:`REG-40`, m:`REG`, dif:2,
 obj:`Descreva o conteúdo relevante do RBAC 67 (partes administrativas e requisitos relacionados apenas ao concessão do CMA).`,
 p:`Quem pode realizar o exame de saúde pericial para a concessão do CMA de 2ª classe, exigido do piloto privado?`,
 alts:[
  {t:`Qualquer médico com registro no CRM.`, ok:false,
   pq:`Errada. É indispensável o credenciamento junto à ANAC; registro no CRM, sozinho, não habilita a realizar exame de saúde pericial aeronáutico.`},
  {t:`Somente clínicas credenciadas, nunca médicos individuais.`, ok:false,
   pq:`Errada. Médicos credenciados individualmente podem realizar exames de 2ª, 4ª e 5ª classes. A exclusividade das clínicas é para a 1ª classe.`},
  {t:`O próprio piloto pode apresentar exames de rotina do seu plano de saúde.`, ok:false,
   pq:`Errada. Exames particulares não substituem o exame de saúde pericial, que segue protocolo próprio do RBAC 67 e é lançado no sistema da ANAC pelo examinador.`},
  {t:`Médicos credenciados pela ANAC ou clínicas credenciadas — sendo que a 1ª classe só pode ser feita em clínica credenciada.`, ok:true,
   pq:`Correta. Médicos credenciados fazem 2ª, 4ª e 5ª classes; clínicas credenciadas fazem todas. Como o piloto privado precisa de CMA de 2ª classe, ele pode recorrer a qualquer das duas opções.`}
 ]},

{id:`REG-41`, m:`REG`, dif:2,
 obj:`Declare os requisitos para a emissão de uma licença de PC.`,
 p:`Quais são os requisitos gerais para a concessão da licença de PILOTO COMERCIAL, e em que eles diferem dos do piloto privado?`,
 alts:[
  {t:`Ter 18 anos, ensino médio concluído e ser titular de licença de piloto privado na categoria pretendida.`, ok:true,
   pq:`Correta, conforme 61.93. A diferença em relação ao PP é o terceiro requisito: o piloto comercial precisa já ser piloto privado. Além disso, o PC exige curso teórico homologado concluído, o que o PP-A não exige.`},
  {t:`Ter 21 anos, ensino superior e licença de piloto privado.`, ok:false,
   pq:`Errada. Não há exigência de ensino superior em nenhuma licença de piloto, e a idade mínima é 18 anos.`},
  {t:`Ter 18 anos e ensino médio, sem necessidade de licença anterior.`, ok:false,
   pq:`Errada. A licença de piloto privado na mesma categoria é pré-requisito expresso para o comercial.`},
  {t:`Apenas ser aprovado no exame teórico de piloto comercial.`, ok:false,
   pq:`Errada. O exame teórico é um dos requisitos, ao lado de idade, escolaridade, licença anterior, curso homologado, instrução de voo, experiência e proficiência.`}
 ]},

{id:`REG-42`, m:`REG`, dif:2,
 obj:`Explique os requisitos para as classificações de instrumentos, sua validade e privilégios.`,
 p:`Um piloto privado com habilitação de voo por instrumentos (IFR) vigente pode operar comercialmente?`,
 alts:[
  {t:`Sim, a habilitação IFR amplia as prerrogativas para voo remunerado.`, ok:false,
   pq:`Errada. Habilitação e licença são coisas distintas: a habilitação diz o QUE se pode operar, a licença diz EM QUE CONDIÇÕES. Nenhuma habilitação transforma um piloto privado em comercial.`},
  {t:`Não. A habilitação IFR permite voar sob regras de voo por instrumentos, mas a limitação de não remuneração é da LICENÇA de piloto privado e permanece.`, ok:true,
   pq:`Correta. É a distinção mais importante do licenciamento: prerrogativa comercial vem da licença de piloto comercial. O IFR apenas acrescenta a capacidade de operar sob regras de voo por instrumentos.`},
  {t:`Sim, desde que o voo seja doméstico.`, ok:false,
   pq:`Errada. A fronteira não altera a limitação de remuneração do piloto privado.`},
  {t:`Não, porque piloto privado não pode obter habilitação IFR.`, ok:false,
   pq:`Errada na premissa. O piloto privado pode, sim, obter habilitação de voo por instrumentos — inclusive existe classe de CMA prevista para essa combinação.`}
 ]},

{id:`REG-43`, m:`REG`, dif:2,
 obj:`Explique os requisitos para as classificações de tipo, sua validade e privilégios.`,
 p:`Qual é a diferença entre habilitação de CLASSE e habilitação de TIPO?`,
 alts:[
  {t:`Classe é para aviões e tipo é para helicópteros.`, ok:false,
   pq:`Errada. Essa distinção é de CATEGORIA (avião, helicóptero, planador, balão, dirigível), e não de classe versus tipo.`},
  {t:`Classe é permanente e tipo vence a cada 5 anos.`, ok:false,
   pq:`Errada. Nenhuma das duas é permanente: classe tem 24 meses e tipo, 12 meses, conforme a seção 61.19.`},
  {t:`Classe agrupa aeronaves de características semelhantes (por exemplo, monomotor terrestre); tipo é específica de um modelo que, por sua complexidade ou porte, exige habilitação própria.`, ok:true,
   pq:`Correta. Por isso os prazos de vigência diferem: 24 meses para classe e 12 meses para tipo — aeronaves que exigem habilitação de tipo demandam recorrência mais frequente.`},
  {t:`Classe é emitida pela escola e tipo pela ANAC.`, ok:false,
   pq:`Errada. Ambas são averbadas pela ANAC na licença do piloto; escolas ministram treinamento, não concedem habilitação.`}
 ]},

{id:`REG-44`, m:`REG`, dif:2,
 obj:`Explique os requisitos para atuar como membro da tripulação de voo de uma aeronave civil registrada em um Estado membro.`,
 p:`O que caracteriza a licença de ALUNO PILOTO e quais suas limitações?`,
 alts:[
  {t:`É a licença que permite voar levando passageiros durante a instrução.`, ok:false,
   pq:`Errada, e perigosa. O aluno piloto não transporta passageiros; o voo solo, por definição, tem apenas ele a bordo.`},
  {t:`É uma licença permanente, como as demais licenças de piloto.`, ok:false,
   pq:`Errada. É a única exceção à permanência: as demais licenças de piloto não vencem, mas a de aluno piloto sim.`},
  {t:`É concedida somente após a aprovação no exame teórico da ANAC.`, ok:false,
   pq:`Errada. O exame teórico é requisito para a licença de piloto privado, não para a de aluno piloto.`},
  {t:`É a etapa inicial da formação, concedida a partir de 18 anos — ou aos 16, com termo de responsabilidade do responsável — e que perde validade ao fim do vínculo com a instituição de ensino ou 24 meses após a concessão.`, ok:true,
   pq:`Correta, conforme 61.53 e 61.17. Note que o requisito de escolaridade também é mais brando: basta estar cursando o ensino médio, enquanto a licença de piloto privado exige tê-lo concluído.`}
 ]},

{id:`REG-45`, m:`REG`, dif:3,
 obj:`Explique os requisitos para as classificações de classe, sua validade e privilégios.`,
 p:`Um piloto privado está com a habilitação de classe vencida há 3 meses. O que isso significa na prática?`,
 alts:[
  {t:`Ele não pode exercer as prerrogativas naquela classe até restabelecer a vigência, na forma prevista pelo RBAC 61.`, ok:true,
   pq:`Correta. A seção 61.17 condiciona o exercício das prerrogativas às habilitações vigentes, e o RBAC 61 traz seção específica sobre prazos, tolerância e restabelecimento de vigência.`},
  {t:`Nada muda, desde que o CMA esteja válido.`, ok:false,
   pq:`Errada. As três condições do 61.17 são cumulativas: CMA válido, habilitações vigentes E experiência recente. Falhar em qualquer uma impede o exercício das prerrogativas.`},
  {t:`A licença foi cassada e precisa ser requerida novamente.`, ok:false,
   pq:`Errada. Habilitação vencida não cassa licença. A licença permanece; apenas não pode ser exercida naquela classe até o restabelecimento da vigência.`},
  {t:`Ele pode voar, mas apenas em voos locais.`, ok:false,
   pq:`Errada. Não existe essa flexibilização por tipo de voo: sem habilitação vigente, não se atua como piloto em comando naquela classe.`}
 ]},

{id:`REG-46`, m:`REG`, dif:2,
 obj:`Explique o termo "autoridade competente".`,
 p:`No Brasil, qual órgão é a autoridade de aviação civil responsável por conceder licenças e habilitações de piloto, e qual responde pelo controle do espaço aéreo?`,
 alts:[
  {t:`A ANAC responde por tudo, inclusive pelo controle de tráfego aéreo.`, ok:false,
   pq:`Errada. O controle do espaço aéreo brasileiro é atribuição do Comando da Aeronáutica, por meio do DECEA e dos órgãos regionais.`},
  {t:`A ANAC concede licenças e habilitações; o DECEA, do Comando da Aeronáutica, responde pelo controle do espaço aéreo.`, ok:true,
   pq:`Correta, e essa divisão explica muita coisa da prova. Regras de licenciamento e aeronavegabilidade estão em RBAC (ANAC); regras de tráfego aéreo, fraseologia, mínimos VFR e cartas estão em ICA e AIP (DECEA). Quem estuda só um dos lados fica com metade da matéria.`},
  {t:`O DECEA concede licenças e a ANAC controla o tráfego aéreo.`, ok:false,
   pq:`Errada — as atribuições estão invertidas.`},
  {t:`A OACI concede licenças no Brasil e o DECEA controla o tráfego.`, ok:false,
   pq:`Errada. A OACI não emite licenças em nenhum Estado; ela padroniza.`}
 ]},

{id:`REG-47`, m:`REG`, dif:2,
 obj:`Declare os privilégios de uma licença de PC.`,
 p:`Um piloto privado divide com os passageiros o custo do combustível de um voo de lazer. Isso configura remuneração?`,
 alts:[
  {t:`Sim, qualquer valor recebido de passageiro é remuneração e é vedado ao piloto privado.`, ok:false,
   pq:`Errada como afirmação absoluta. O conceito relevante é o de aproveitamento comercial e de lucro, não o de qualquer troca de dinheiro. Ainda assim, a matéria tem limites e condições — ver a resposta correta.`},
  {t:`Não, e o piloto privado pode organizar voos com rateio de custos como atividade regular.`, ok:false,
   pq:`Errada. Rateio como atividade regular, com oferta ao público, descaracteriza o voo privado e invade a esfera do transporte aéreo, que exige licença comercial e certificação do operador.`},
  {t:`O tema é delicado: a prerrogativa do PP é atuar sem remuneração e sem qualquer aproveitamento comercial, e o rateio de custos só é admissível dentro das condições e limites previstos na regulamentação aplicável — que devem ser consultados antes de qualquer combinação.`, ok:true,
   pq:`Correta, e a resposta honesta. O RBAC 61 fixa a prerrogativa em termos de ausência de remuneração e de aproveitamento comercial. Existe tratamento regulatório específico para divisão de despesas, com condições. Diante de dúvida concreta, a conduta certa é consultar a norma vigente e a ANAC — não presumir.`},
  {t:`Não há regra sobre isso; é combinação particular entre amigos.`, ok:false,
   pq:`Errada. Há regra, e o descumprimento expõe o piloto a sanção administrativa e pode afetar a cobertura de seguro em caso de ocorrência.`}
 ]},

{id:`REG-48`, m:`REG`, dif:2,
 obj:`Explique os requisitos para atuar como membro da tripulação de voo de uma aeronave civil registrada em um Estado membro.`,
 p:`O que é o Código ANAC (CANAC) e para que serve?`,
 alts:[
  {t:`É o número da licença de piloto, impresso na CHT.`, ok:false,
   pq:`Errada. O CANAC identifica a PESSOA no cadastro, e não um documento específico. A licença tem sua própria identificação.`},
  {t:`É o código do aeródromo onde o piloto realizou sua formação.`, ok:false,
   pq:`Errada. Aeródromos têm indicadores de localidade OACI (quatro letras, como SBGR) e códigos IATA — nada a ver com o CANAC.`},
  {t:`É a matrícula da aeronave usada na instrução.`, ok:false,
   pq:`Errada. Matrícula de aeronave é a marca do tipo PP-XXX ou PR-XXX.`},
  {t:`É o número único de 6 dígitos que identifica o aspirante ou titular de licença no Cadastro Brasileiro do Pessoal da Aviação Civil.`, ok:true,
   pq:`Correta. É a chave de tudo: sem CANAC não se inscreve em exame teórico, não se faz o CMA, não se registra horas na CIV Digital. É o primeiro passo administrativo de quem quer voar no Brasil.`}
 ]},

{id:`REG-49`, m:`REG`, dif:2,
 obj:`Estar familiarizado com o conteúdo geral de partes relevantes dos seguintes capítulos: princípios gerais e aplicação da Convenção.`,
 p:`A Convenção de Chicago aplica-se a que tipo de aeronave?`,
 alts:[
  {t:`Às aeronaves civis. Aeronaves de Estado — militares, de alfândega e de polícia — estão fora de seu âmbito, salvo autorização específica para sobrevoo.`, ok:true,
   pq:`Correta. Aeronaves de Estado não gozam dos direitos de sobrevoo previstos na Convenção: precisam de autorização especial do Estado sobrevoado, o que é matéria diplomática, não aeronáutica.`},
  {t:`A todas as aeronaves, civis e de Estado, sem distinção.`, ok:false,
   pq:`Errada. A Convenção distingue expressamente as duas categorias e se aplica às civis.`},
  {t:`Somente a aeronaves de transporte aéreo regular.`, ok:false,
   pq:`Errada. Ela alcança a aviação civil como um todo, inclusive a aviação geral e os voos não regulares.`},
  {t:`Somente a aeronaves com mais de 5.700 kg.`, ok:false,
   pq:`Errada. Não há corte por peso na aplicabilidade da Convenção; limites de massa aparecem em outros contextos, como classificação de aeronaves e requisitos de certificação.`}
 ]},

{id:`REG-50`, m:`REG`, dif:2,
 obj:`Descreva a organização e os objetivos gerais da IATA.`,
 p:`Qual é a diferença entre OACI (ICAO) e IATA?`,
 alts:[
  {t:`OACI é associação de empresas aéreas; IATA é organismo formado por Estados.`, ok:false,
   pq:`Errada — os papéis estão invertidos.`},
  {t:`OACI é organismo internacional formado por Estados; IATA é associação de empresas aéreas.`, ok:true,
   pq:`Correta. Essa é a distinção que importa: a OACI padroniza por SARP que os Estados incorporam ao direito interno; a IATA representa interesses comerciais das companhias e produz padrões de mercado — como os códigos de aeroporto de três letras, que convivem com os de quatro letras da OACI.`},
  {t:`São o mesmo organismo, com nomes diferentes em inglês e francês.`, ok:false,
   pq:`Errada. São entidades distintas, com natureza jurídica, membros e finalidades diferentes.`},
  {t:`OACI regula a aviação civil e a IATA regula a aviação militar.`, ok:false,
   pq:`Errada. Aviação militar não é regulada por nenhuma das duas; ela está fora do âmbito da Convenção de Chicago.`}
 ]},

{id:`REG-51`, m:`REG`, dif:2,
 obj:`Descreva a organização geral e os objetivos do SRVSOP.`,
 p:`O que é o SRVSOP e qual sua relevância para a aviação civil brasileira?`,
 alts:[
  {t:`É o órgão de investigação de acidentes aeronáuticos da América do Sul.`, ok:false,
   pq:`Errada. Investigação de acidentes no Brasil é atribuição do SIPAER, e cada Estado mantém sua própria autoridade de investigação.`},
  {t:`É a associação sul-americana de pilotos de linha aérea.`, ok:false,
   pq:`Errada. Associação de pilotos em nível internacional é a IFALPA; o SRVSOP é cooperação entre autoridades, não entre profissionais.`},
  {t:`É o Sistema Regional de Cooperação para a Supervisão da Segurança Operacional: uma cooperação entre autoridades de aviação civil sul-americanas para harmonizar requisitos e apoiar a supervisão da segurança.`, ok:true,
   pq:`Correta. O SRVSOP produz os LAR (Regulamentos Aeronáuticos Latino-Americanos), que servem de referência de harmonização regional. É por isso que ele aparece na ementa de Regulamentos.`},
  {t:`É o sistema de controle de tráfego aéreo compartilhado do Mercosul.`, ok:false,
   pq:`Errada. Controle de tráfego permanece nacional; o SRVSOP trata de supervisão da segurança operacional, não de prestação de serviços ATS.`}
 ]},

{id:`REG-52`, m:`REG`, dif:2,
 obj:`Explique os requisitos de entrada para a tripulação.`,
 p:`Segundo o Anexo 9 da OACI (Facilitação), qual é a finalidade do Crew Member Certificate (CMC)?`,
 alts:[
  {t:`Comprovar a habilitação técnica do tripulante perante a autoridade de aviação civil.`, ok:false,
   pq:`Errada. Habilitação técnica é comprovada pela licença e pelas habilitações averbadas, não pelo CMC.`},
  {t:`Substituir o certificado médico aeronáutico em voos internacionais.`, ok:false,
   pq:`Errada. O CMC não tem qualquer relação com aptidão psicofísica.`},
  {t:`Autorizar o tripulante a pilotar aeronaves de matrícula estrangeira.`, ok:false,
   pq:`Errada. Operar aeronave de outro Estado depende de licença reconhecida ou convalidada, não do CMC.`},
  {t:`Servir como documento de identidade do tripulante em serviço, facilitando entrada e saída em Estados contratantes, em substituição a passaporte ou visto em determinadas situações.`, ok:true,
   pq:`Correta. É um documento de facilitação, e não de habilitação: existe para agilizar o trânsito de tripulações em serviço nas fronteiras, dentro das condições que cada Estado aceita.`}
 ]},

{id:`REG-53`, m:`REG`, dif:3, nota:`Regra atual conforme a IS 00-003, Revisão H, em vigor desde 01/03/2025. A revisão H reescreveu a IS inteira — material anterior a março de 2025 pode trazer procedimento diferente.`,
 obj:`Entenda a diferença entre o RBAC 61 e os meios aceitáveis de atendimento (Instrução Suplementar – IS) e de materiais de orientação em relação ao RBAC 61.`,
 p:`Pela IS 00-003H, como e quando o candidato pode interpor recurso contra uma questão do exame teórico?`,
 alts:[
  {t:`Em primeira instância, apenas no momento imediatamente após o encerramento do exame, no próprio sistema de provas, dispondo de 30 minutos para redigir os argumentos.`, ok:true,
   pq:`Correta. Marcar a questão durante a prova não basta: sem os argumentos escritos naquele campo, o recurso é desconsiderado. Só em caso de indeferimento é que cabe segunda instância, por protocolo eletrônico no SEI, decidida pelo Coordenador de Exames da ANAC.`},
  {t:`Por e-mail à ANAC, em até 5 dias úteis após a divulgação do resultado.`, ok:false,
   pq:`Errada. A IS é expressa em não aceitar recursos por correio eletrônico, correio físico ou qualquer outro meio que não o previsto.`},
  {t:`A qualquer momento, enquanto o resultado não for homologado.`, ok:false,
   pq:`Errada. A janela de primeira instância é única e imediata: encerrou o exame, começam os 30 minutos.`},
  {t:`Somente por meio do Centro de Instrução onde o candidato estudou.`, ok:false,
