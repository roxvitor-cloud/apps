   pq:`Errada. Mudança de passo altera tração e RPM, mas não é o que se chama de fator P.`}
 ]},

{id:`TV-10`, m:`TV`, dif:2,
 obj:`Identificar as funções dos dispositivos hipersustentadores nas manobras das aeronaves.`,
 p:`Qual é o efeito da extensão dos FLAPES sobre a aerodinâmica da asa?`,
 alts:[
  {t:`Aumenta a sustentação sem aumentar o arrasto, por isso é usado também em cruzeiro.`, ok:false,
   pq:`Errada. O aumento de arrasto é inevitável e, nos estágios maiores, é justamente o efeito dominante. Por isso flape não é usado em cruzeiro.`},
  {t:`Aumenta o ângulo de ataque crítico da asa, retardando o estol.`, ok:false,
   pq:`Errada. O flape aumenta o coeficiente de sustentação, mas em geral REDUZ o ângulo de ataque crítico. O estol passa a ocorrer com o nariz mais baixo.`},
  {t:`Reduz o arrasto na decolagem, encurtando a corrida no solo em qualquer aeronave.`, ok:false,
   pq:`Errada. Flape de decolagem, quando previsto, encurta a corrida por aumentar a sustentação, não por reduzir arrasto — e estágios grandes prejudicam a decolagem em vez de ajudar.`},
  {t:`Aumenta o coeficiente de sustentação máximo e o arrasto, reduzindo a velocidade de estol e permitindo aproximação mais inclinada com melhor visão à frente.`, ok:true,
   pq:`Correta. O flape aumenta a curvatura e, em alguns tipos, a área da asa. Mais sustentação disponível em baixa velocidade significa estol mais lento; e o arrasto adicional permite descer mais íngreme sem acelerar, com o nariz mais baixo.`}
 ]},

{id:`TV-11`, m:`TV`, dif:2,
 obj:`Descrever os diferentes tipos de estabilidade de uma aeronave e os efeitos provocados por cada um de seus elementos ou componentes.`,
 p:`Qual componente é o principal responsável pela estabilidade LONGITUDINAL de um avião convencional?`,
 alts:[
  {t:`O estabilizador horizontal, atuando em conjunto com a posição do centro de gravidade em relação ao centro de pressão.`, ok:true,
   pq:`Correta. Estabilidade longitudinal é a tendência de a aeronave voltar sozinha à atitude de arfagem original. O estabilizador horizontal fornece o momento restaurador, e a posição do CG determina o braço de alavanca — por isso CG adiantado dá mais estabilidade longitudinal.`},
  {t:`O diedro das asas.`, ok:false,
   pq:`Errada. O diedro é o principal contribuinte da estabilidade LATERAL, isto é, em rolagem.`},
  {t:`O estabilizador vertical.`, ok:false,
   pq:`Errada. O estabilizador vertical governa a estabilidade DIRECIONAL, em torno do eixo vertical, ou seja, em guinada.`},
  {t:`Os flapes.`, ok:false,
   pq:`Errada. Flapes são dispositivos hipersustentadores; alteram sustentação e arrasto, e não são elementos de estabilidade.`}
 ]},

{id:`TV-12`, m:`TV`, dif:2,
 obj:`Identificar os diferentes tipos de equilíbrio estático e dinâmico, descrevendo os respectivos efeitos.`,
 p:`Uma aeronave é perturbada em arfagem e passa a oscilar, com as oscilações diminuindo de amplitude até ela voltar à atitude original. Como se classifica esse comportamento?`,
 alts:[
  {t:`Estaticamente instável e dinamicamente estável.`, ok:false,
   pq:`Errada, e é uma combinação impossível na prática: sem tendência inicial de retorno não há oscilação em torno da posição original para amortecer.`},
  {t:`Estaticamente estável e dinamicamente estável.`, ok:true,
   pq:`Correta. A tendência inicial de retornar caracteriza a estabilidade estática positiva; o amortecimento progressivo das oscilações caracteriza a estabilidade dinâmica positiva. É o comportamento desejável e o de projeto das aeronaves de treinamento.`},
  {t:`Estaticamente estável e dinamicamente instável.`, ok:false,
   pq:`Errada para o caso descrito. Nessa combinação as oscilações CRESCEM de amplitude a cada ciclo, em vez de diminuir.`},
  {t:`Neutro nos dois aspectos.`, ok:false,
   pq:`Errada. Neutralidade seria a aeronave permanecer na nova atitude, sem retornar nem se afastar mais.`}
 ]},

{id:`TV-13`, m:`TV`, dif:3,
 obj:`Reconhecer a importância do CG na estabilidade da aeronave e os limites do CG que uma aeronave pode suportar.`,
 p:`Quais são as consequências de operar com o centro de gravidade ATRASADO além do limite traseiro?`,
 alts:[
  {t:`Aumento da estabilidade longitudinal e maior esforço no manche.`, ok:false,
   pq:`Errada — isso descreve o CG ADIANTADO além do limite: mais estável, mais pesado no comando, com dificuldade no flare e maior velocidade de estol.`},
  {t:`Redução da velocidade de cruzeiro e aumento do consumo.`, ok:false,
   pq:`Errada quanto ao efeito relevante. CG atrasado costuma até reduzir levemente o arrasto de compensação; o problema é de controlabilidade e segurança, não de economia.`},
  {t:`Redução da estabilidade longitudinal, resposta excessivamente sensível em arfagem e maior dificuldade — podendo chegar à impossibilidade — de recuperar de estol e parafuso.`, ok:true,
   pq:`Correta. Com o CG atrás do limite, o braço de alavanca do estabilizador diminui e o momento restaurador enfraquece. A aeronave fica "solta" em arfagem e pode não conseguir baixar o nariz para sair do estol — o cenário do parafuso irrecuperável.`},
  {t:`Nenhuma consequência, desde que o peso total esteja dentro do limite.`, ok:false,
   pq:`Errada, e é um erro grave. Peso e balanceamento são dois limites independentes: estar dentro do peso máximo não autoriza estar fora do envelope de CG.`}
 ]},

{id:`TV-14`, m:`TV`, dif:3,
 obj:`Efetuar os cálculos de peso e balanceamento para o planejamento de voo.`,
 p:`Uma aeronave tem peso básico vazio de 1.680 lb e peso máximo de decolagem de 2.450 lb. Serão embarcados dois ocupantes somando 350 lb, 40 lb de bagagem e combustível a 6 lb por galão. Qual a quantidade MÁXIMA de combustível que pode ser embarcada?`,
 alts:[
  {t:`128 galões`, ok:false,
   pq:`Errada. Esse número sai de dividir os 770 lb de carga útil total por 6, esquecendo de descontar ocupantes e bagagem.`},
  {t:`58 galões`, ok:false,
   pq:`Errada. Corresponderia a 348 lb de combustível — mais conservador, mas não é o que os dados fornecem. O cálculo exato dá 380 lb.`},
  {t:`Não é possível calcular sem saber o braço de cada item.`, ok:false,
   pq:`Errada para a pergunta feita. O braço é indispensável para verificar o CG, que é a outra metade do problema — mas a quantidade máxima por LIMITE DE PESO se calcula apenas com os pesos.`},
  {t:`63 galões`, ok:true,
   pq:`Correta. Carga útil disponível = 2.450 − 1.680 = 770 lb. Descontando 350 de ocupantes e 40 de bagagem sobram 380 lb para combustível. 380 ÷ 6 = 63,3, ou seja, 63 galões cheios. Na prática o limite físico do tanque costuma ser menor que isso, e vale o menor dos dois.`}
 ]},

{id:`TV-15`, m:`TV`, dif:2,
 obj:`Enunciar os diversos pesos atribuídos às aeronaves em função do combustível, da carga e dos equipamentos de voo de uso regulamentar.`,
 p:`O que é o PESO BÁSICO VAZIO de uma aeronave?`,
 alts:[
  {t:`O peso da estrutura, motor, equipamentos instalados, fluidos operacionais não consumíveis e o óleo do motor, sem tripulação, passageiros, carga e combustível utilizável.`, ok:true,
   pq:`Correta. É o ponto de partida de todo cálculo de peso e balanceamento, e consta da ficha de peso e balanceamento específica daquela aeronave — que muda a cada modificação ou instalação de equipamento.`},
  {t:`O peso da aeronave com os tanques completamente cheios, mas sem ocupantes.`, ok:false,
   pq:`Errada. Combustível utilizável não entra no peso básico vazio; ele é carga variável, somada depois.`},
  {t:`O peso máximo autorizado para a decolagem.`, ok:false,
   pq:`Errada — esse é o peso máximo de decolagem, um limite certificado, e não uma medida da aeronave descarregada.`},
  {t:`O peso médio das aeronaves do mesmo modelo, publicado pelo fabricante.`, ok:false,
   pq:`Errada. O peso básico vazio é individual, obtido por pesagem daquela aeronave específica. Duas células do mesmo modelo têm valores diferentes.`}
 ]},

{id:`TV-16`, m:`TV`, dif:2,
 obj:`Enumerar as leis e os princípios da Física que são básicos para o estudo da aerodinâmica.`,
 p:`Segundo o teorema de Bernoulli aplicado a um escoamento, o que ocorre com a pressão estática quando a velocidade do fluido aumenta?`,
 alts:[
  {t:`A pressão estática aumenta proporcionalmente à velocidade.`, ok:false,
   pq:`Errada, e inverte a relação. Se pressão estática e velocidade crescessem juntas, a energia total do escoamento aumentaria sozinha.`},
  {t:`A pressão estática diminui, porque a soma da pressão estática com a dinâmica permanece constante ao longo do escoamento.`, ok:true,
   pq:`Correta. Esse é o conteúdo do teorema: energia total constante, redistribuída entre as parcelas. É o que sustenta a explicação clássica da diferença de pressão entre extradorso e intradorso da asa, e é também o princípio do tubo de Venturi.`},
  {t:`A pressão estática permanece constante, pois só a temperatura varia.`, ok:false,
   pq:`Errada. Em escoamento incompressível de baixa velocidade a variação relevante é a de pressão, não a de temperatura.`},
  {t:`A pressão total diminui, e a estática permanece igual.`, ok:false,
   pq:`Errada. É justamente a pressão TOTAL que se mantém constante no escoamento ideal; a estática é que varia.`}
 ]},

{id:`TV-17`, m:`TV`, dif:2,
 obj:`Identificar os princípios de funcionamento dos comandos (ou controles) de voo nas manobras das aeronaves.`,
 p:`Ao aplicar aileron para rolar para a esquerda, a aeronave tende a guinar para a direita. Como se chama esse efeito e como se corrige?`,
 alts:[
  {t:`Precessão giroscópica, causada pelo motor; corrige-se reduzindo a potência.`, ok:false,
   pq:`Errada. Precessão giroscópica é efeito da massa girante da hélice quando o eixo é deslocado, notada em decolagens de cauda alta e em manobras acentuadas — não é o que ocorre ao aplicar aileron.`},
  {t:`Efeito de esteira helicoidal; corrige-se com compensador de leme.`, ok:false,
   pq:`Errada. A esteira helicoidal produz guinada constante com potência alta, compensável por trim, mas não é o efeito transitório ligado à aplicação de aileron.`},
  {t:`Guinada adversa, causada pelo maior arrasto induzido na asa que sobe; corrige-se com aplicação coordenada de leme no mesmo sentido da curva.`, ok:true,
   pq:`Correta. O aileron que desce aumenta a sustentação e, com ela, o arrasto induzido daquela asa — que é a asa externa da curva. O resultado é uma guinada para o lado oposto ao da curva. O leme aplicado no sentido da curva anula esse momento, e é isso que significa "coordenar".`},
  {t:`Estol de ponta de asa; corrige-se com aplicação de flape.`, ok:false,
   pq:`Errada. Estol de ponta é fenômeno de separação do escoamento em ângulo de ataque alto, sem relação com a guinada adversa.`}
 ]},

{id:`TV-18`, m:`TV`, dif:3,
 obj:`Descrever as peculiaridades do voo em função dos diversos fatores que influenciam a realização das manobras de: decolagem, subida, voo cruzeiro, curvas, descida e pouso.`,
 p:`O que caracteriza a REGIÃO DE COMANDO REVERSO e por que ela importa na aproximação final?`,
 alts:[
  {t:`É a faixa de velocidades acima da Vne, em que os comandos invertem seu efeito.`, ok:false,
   pq:`Errada. Não há inversão de efeito dos comandos; o nome se refere à relação entre potência e velocidade, não ao sentido de atuação dos controles.`},
  {t:`É a condição em que o profundor passa a controlar a velocidade e o manete, a altitude.`, ok:false,
   pq:`Errada como definição, embora relacionada. Essa forma de descrever a aproximação estabilizada é consequência prática, não a definição da região de comando reverso.`},
  {t:`É a faixa em que o avião voa com o CG fora do envelope traseiro.`, ok:false,
   pq:`Errada. É um conceito aerodinâmico ligado à curva de arrasto, sem relação com balanceamento.`},
  {t:`É a faixa de velocidades abaixo da de melhor razão de planeio, em que é preciso MAIS potência para voar MAIS devagar, porque o arrasto induzido cresce rapidamente.`, ok:true,
   pq:`Correta. Ali a curva de arrasto total volta a subir com a redução de velocidade. Na final, isso significa que corrigir uma aproximação baixa puxando o manche sem acrescentar potência piora a situação: reduz a velocidade, aumenta o arrasto e aumenta a razão de descida.`}
 ]},

{id:`TV-19`, m:`TV`, dif:2,
 obj:`Descrever o comportamento da estabilidade do avião em função das variações de potência e de altitude.`,
 p:`O que é o EFEITO SOLO e qual sua consequência prática no pouso?`,
 alts:[
  {t:`É a redução do arrasto induzido quando a aeronave voa a menos de uma envergadura do solo, pela interferência do solo nos vórtices de ponta; no pouso, isso faz o avião tender a flutuar se chegar rápido demais.`, ok:true,
   pq:`Correta. Perto do solo os vórtices não se desenvolvem plenamente, o arrasto induzido cai e a asa fica mais eficiente. Se a velocidade na final estiver acima da correta, o avião simplesmente não desce — flutua e consome pista.`},
  {t:`É o aumento do arrasto perto do solo, que ajuda a frenagem aerodinâmica no pouso.`, ok:false,
   pq:`Errada, e é o oposto. O arrasto DIMINUI, e é isso que causa a flutuação.`},
  {t:`É a turbulência gerada pelo contato dos vórtices com a pista, exigindo aproximação mais rápida.`, ok:false,
   pq:`Errada. Não se trata de turbulência, e aproximar mais rápido agrava a flutuação em vez de resolvê-la.`},
  {t:`É a perda de sustentação causada pela proximidade do solo, exigindo mais potência no flare.`, ok:false,
   pq:`Errada. Há ganho de eficiência, não perda de sustentação. O risco é o inverso: decolar dentro do efeito solo com velocidade insuficiente para sustentar o voo fora dele.`}
 ]},

{id:`TV-20`, m:`TV`, dif:2,
 obj:`Utilizar corretamente os gráficos e tabelas com as limitações e performances de uma aeronave para planejamento de voo.`,
 p:`Sobre a velocidade de manobra (Va), qual afirmação está correta?`,
 alts:[
  {t:`Ela AUMENTA quando o peso diminui, pois há menos massa para acelerar.`, ok:false,
   pq:`Errada, e é o erro clássico. Menos massa significa maior aceleração para a mesma força de rajada — logo, maior fator de carga, não menor.`},
  {t:`Ela DIMINUI quando o peso da aeronave diminui, porque um avião mais leve é acelerado mais facilmente pelas rajadas e atinge o limite de carga em velocidade menor.`, ok:true,
   pq:`Correta. É contraintuitivo e cai bastante. Abaixo da Va a asa estola antes de a estrutura ser sobrecarregada; com menos peso, a estrutura chega ao limite antes — então a Va precisa ser menor. Por isso os manuais publicam a Va para diferentes pesos.`},
  {t:`Ela é uma velocidade fixa, marcada em vermelho no velocímetro.`, ok:false,
   pq:`Errada. A marca vermelha é a Vne. A Va normalmente nem aparece no velocímetro, justamente por variar com o peso; ela consta do manual e de uma placa na cabine.`},
  {t:`Abaixo da Va é impossível danificar a aeronave em qualquer circunstância.`, ok:false,
   pq:`Errada, e perigosamente absoluta. A proteção vale para deflexão plena de UM comando de cada vez; movimentos combinados ou alternados de comandos podem exceder os limites mesmo abaixo da Va.`}
 ]},

{id:`TV-21`, m:`TV`, dif:2,
 obj:`Identificar as principais forças de resistência.`,
 p:`Em que velocidade o arrasto TOTAL de uma aeronave é mínimo, e que velocidade característica corresponde a esse ponto?`,
 alts:[
  {t:`Na velocidade máxima de cruzeiro, quando o escoamento é mais laminar.`, ok:false,
   pq:`Errada. Em velocidade alta o arrasto parasita cresce com o quadrado da velocidade e o arrasto total é grande, não mínimo.`},
  {t:`Na velocidade de estol, quando a sustentação é máxima.`, ok:false,
   pq:`Errada. Perto do estol o ângulo de ataque é máximo e o arrasto induzido dispara. É a região de arrasto total alto.`},
  {t:`Na velocidade em que o arrasto induzido se iguala ao parasita, que corresponde à velocidade de melhor razão de planeio e de maior autonomia aerodinâmica.`, ok:true,
   pq:`Correta. As duas curvas variam em sentidos opostos; a soma tem um mínimo exatamente onde elas se cruzam. Voar nessa velocidade é o que dá a maior distância planada sem motor, e é o número que o piloto precisa saber de cor para uma pane.`},
  {t:`Na Vne, por definição do envelope de voo.`, ok:false,
   pq:`Errada. A Vne é um limite estrutural e de flutter, e nela o arrasto é máximo dentro da faixa operacional, não mínimo.`}
 ]},

{id:`TV-22`, m:`TV`, dif:2,
 obj:`Conceituar trabalho e potência.`,
 p:`Qual é a diferença entre TRABALHO e POTÊNCIA, e como isso se aplica ao desempenho de subida?`,
 alts:[
  {t:`São sinônimos; potência é apenas o nome usado em motores.`, ok:false,
   pq:`Errada. A diferença é o tempo. Duas aeronaves podem realizar o mesmo trabalho, mas a que o faz em menos tempo tem mais potência.`},
  {t:`Trabalho é medido em watts e potência em joules.`, ok:false,
   pq:`Errada — as unidades estão trocadas. Trabalho e energia se medem em joules; potência, em watts, que são joules por segundo.`},
  {t:`Potência é força vezes deslocamento, e trabalho é potência por tempo.`, ok:false,
   pq:`Errada. As definições estão invertidas.`},
  {t:`Trabalho é força vezes deslocamento; potência é trabalho por unidade de tempo. Na subida, o excesso de potência disponível sobre a requerida é o que determina a razão de subida.`, ok:true,
   pq:`Correta. Ganhar 1.000 ft exige o mesmo trabalho contra a gravidade, independentemente de quanto tempo se leve. O que define se a aeronave sobe rápido ou devagar é a POTÊNCIA excedente — e é por isso que a razão de subida cai com a altitude, à medida que a potência disponível diminui.`}
 ]}
];

const Q_CTA = [
{id:`CTA-01`, m:`CTA`, dif:2,
 obj:`Definir aeronave segundo o art. 106 da Lei 7.565/1986 (Código Brasileiro de Aeronáutica - CBAer).`,
 p:`Segundo o Código Brasileiro de Aeronáutica, o que caracteriza uma AERONAVE?`,
 alts:[
  {t:`Todo aparelho manobrável em voo, apto a se sustentar e circular no espaço aéreo mediante reações aerodinâmicas, capaz de transportar pessoas ou coisas.`, ok:true,
   pq:`Correta. Os elementos da definição legal são: ser manobrável, sustentar-se e circular no espaço aéreo por reações aerodinâmicas, e ter capacidade de transporte. Os três precisam estar presentes.`},
  {t:`Todo aparelho que se desloca no espaço aéreo, incluindo foguetes e satélites.`, ok:false,
   pq:`Errada. Foguetes e satélites não se sustentam por reações aerodinâmicas nem são manobráveis nesse sentido; estão fora da definição legal de aeronave.`},
  {t:`Todo aparelho com motor capaz de decolar por meios próprios.`, ok:false,
   pq:`Errada. A propulsão própria não é elemento da definição: planadores e balões livres são aeronaves e não decolam por meios próprios.`},
  {t:`Todo aparelho registrado na ANAC, independentemente de suas características.`, ok:false,
   pq:`Errada. O registro é consequência de ser aeronave, não a causa. A definição é técnica e legal, anterior ao ato de registrar.`}
 ]},

{id:`CTA-02`, m:`CTA`, dif:2,
 obj:`Classificar as fuselagens quanto ao tipo de estrutura.`,
 p:`Qual é a característica estrutural da fuselagem SEMIMONOCOQUE, a mais usada em aviões leves metálicos?`,
 alts:[
  {t:`Toda a carga é suportada por uma treliça interna de tubos, e o revestimento é apenas aerodinâmico.`, ok:false,
   pq:`Errada — essa é a fuselagem em TRELIÇA (tubular). Nela o revestimento, muitas vezes de tela, não trabalha estruturalmente.`},
  {t:`O revestimento trabalha estruturalmente, mas é apoiado por cavernas e longarinas (reforçadores) que distribuem os esforços.`, ok:true,
   pq:`Correta. É a solução intermediária: o revestimento contribui para a resistência, mas não sozinho. Por isso um amassado na fuselagem semimonocoque é dano estrutural, e não apenas estético.`},
  {t:`Toda a carga é suportada exclusivamente pelo revestimento, sem qualquer reforço interno.`, ok:false,
   pq:`Errada — essa é a monocoque pura, estrutura leve mas pouco tolerante a danos e a aberturas, pouco usada em fuselagens completas.`},
  {t:`A estrutura é formada por painéis de compósito colados, sem cavernas nem longarinas.`, ok:false,
   pq:`Errada. Ainda que existam estruturas em compósito, isso descreve um material e um processo, não a classificação estrutural pedida.`}
 ]},

{id:`CTA-03`, m:`CTA`, dif:1,
 obj:`Identificar cada um dos componentes da empenagem.`,
 p:`Quais são os componentes da EMPENAGEM de um avião convencional e que superfícies móveis eles abrigam?`,
 alts:[
  {t:`Asas, com os ailerons, e estabilizador vertical, com o leme.`, ok:false,
   pq:`Errada. As asas e os ailerons não fazem parte da empenagem; são conjunto separado.`},
  {t:`Estabilizador horizontal, com os flapes, e estabilizador vertical, com os spoilers.`, ok:false,
   pq:`Errada. Flapes ficam nas asas, e spoilers, quando existem, também. Nenhum dos dois pertence à empenagem.`},
  {t:`Estabilizador horizontal, com o profundor, e estabilizador vertical, com o leme de direção.`, ok:true,
   pq:`Correta. A empenagem é o conjunto de cauda. A parte fixa dá estabilidade; as superfícies móveis dão controle: profundor para arfagem, leme para guinada.`},
  {t:`Somente o estabilizador vertical, já que o horizontal faz parte da fuselagem.`, ok:false,
   pq:`Errada. O estabilizador horizontal integra a empenagem, mesmo quando fixado à fuselagem ou ao topo da deriva.`}
 ]},

{id:`CTA-04`, m:`CTA`, dif:2,
 obj:`Classificar os trens de pouso quanto à posição da roda auxiliar (bequilha).`,
 p:`Qual é a diferença entre trem de pouso TRICICLO e CONVENCIONAL, e qual a consequência operacional mais relevante?`,
 alts:[
  {t:`No triciclo a roda auxiliar fica na cauda, e no convencional, no nariz.`, ok:false,
   pq:`Errada — está invertido. O nome "convencional" vem de ser a configuração original da aviação, com bequilha de cauda.`},
  {t:`A diferença é apenas o número de rodas: triciclo tem três e convencional tem quatro.`, ok:false,
   pq:`Errada. Ambos costumam ter três pontos de apoio; o que muda é a posição do terceiro.`},
  {t:`O triciclo só existe em aeronaves com trem retrátil.`, ok:false,
   pq:`Errada. Retrátil ou fixo é outra classificação, independente da posição da roda auxiliar. Há triciclos fixos em profusão nos aviões de treinamento.`},
  {t:`No triciclo a roda auxiliar fica à frente (nariz) e o CG está adiante das rodas principais; no convencional a roda auxiliar fica na cauda e o CG está atrás das principais, o que o torna direcionalmente instável no solo e sujeito ao cavalo de pau.`, ok:true,
   pq:`Correta. A posição do CG em relação às rodas principais é o que muda tudo. No convencional, qualquer desvio tende a se amplificar, exigindo trabalho constante de pedal — daí a habilitação e o cuidado específicos com essa configuração.`}
 ]},

{id:`CTA-05`, m:`CTA`, dif:2,
 obj:`Classificar os trens de pouso quanto à fixação.`,
 p:`Qual é a diferença entre trem de pouso RETRÁTIL e ESCAMOTEÁVEL?`,
 alts:[
  {t:`O retrátil recolhe-se completamente para dentro da estrutura; o escamoteável recolhe-se apenas parcialmente, deixando parte das rodas exposta.`, ok:true,
   pq:`Correta. O escamoteável é uma solução de compromisso: reduz o arrasto sem exigir alojamento completo e, em caso de pouso com o trem recolhido, o dano tende a ser menor.`},
  {t:`O retrátil é acionado eletricamente e o escamoteável, hidraulicamente.`, ok:false,
   pq:`Errada. O tipo de acionamento é independente da classificação; existem retráteis elétricos, hidráulicos e até manuais.`},
  {t:`O escamoteável é aquele que pode ser removido no solo para manutenção.`, ok:false,
   pq:`Errada. A classificação se refere ao comportamento em voo, não à desmontagem em solo.`},
  {t:`São sinônimos; a diferença é apenas regional no vocabulário.`, ok:false,
   pq:`Errada. São categorias distintas na classificação usada pelo programa, com a diferença estando no recolhimento total ou parcial.`}
 ]},

{id:`CTA-06`, m:`CTA`, dif:1,
 obj:`Classificar os trens de pouso quanto ao tipo de superfície de operação.`,
 p:`Como se classifica a aeronave dotada de trem de pouso capaz de operar tanto em pista quanto na água?`,
 alts:[
  {t:`Hidroplana.`, ok:false,
   pq:`Errada. O hidroplano opera exclusivamente na água, com flutuadores ou casco, sem rodas para pista.`},
  {t:`Anfíbia.`, ok:true,
   pq:`Correta. O anfíbio combina flutuadores ou casco com rodas retráteis, permitindo operação nas duas superfícies. Daí o cuidado operacional clássico: rodas recolhidas para amerissar, rodas baixadas para pousar em pista.`},
  {t:`Litoplana.`, ok:false,
   pq:`Errada. O litoplano opera exclusivamente em superfície terrestre.`},
  {t:`Escamoteável.`, ok:false,
   pq:`Errada. Escamoteável é classificação quanto à fixação (recolhimento parcial), não quanto à superfície de operação.`}
 ]},

{id:`CTA-07`, m:`CTA`, dif:2,
 obj:`Classificar as aeronaves quanto à fixação da asa na fuselagem.`,
 p:`Qual é a diferença entre asa CANTILEVER e SEMICANTILEVER?`,
 alts:[
  {t:`A cantilever é sempre asa alta e a semicantilever é sempre asa baixa.`, ok:false,
   pq:`Errada. A posição da asa em relação à fuselagem é outra classificação, independente da forma de fixação.`},
  {t:`A cantilever é feita de metal e a semicantilever, de madeira e tela.`, ok:false,
   pq:`Errada. A classificação é estrutural, não de material. Existem asas cantilever em madeira e semicantilever em metal.`},
  {t:`A cantilever não usa nenhum apoio externo, sustentando-se apenas pela própria estrutura interna; a semicantilever recebe apoio externo, como montantes ou estais.`, ok:true,
   pq:`Correta. A cantilever é aerodinamicamente mais limpa e exige longarina mais robusta. A semicantilever, com montante, é mais leve e barata — solução comum em aviões de asa alta de treinamento.`},
  {t:`A semicantilever pode ser removida em voo para reduzir arrasto.`, ok:false,
   pq:`Errada, e sem sentido físico. Nenhuma asa é removível em voo.`}
 ]},

{id:`CTA-08`, m:`CTA`, dif:1,
 obj:`Definir superfícies de comando primárias.`,
 p:`Quais são as superfícies de comando PRIMÁRIAS e sobre que eixo cada uma atua?`,
 alts:[
  {t:`Flapes, slats e spoilers.`, ok:false,
   pq:`Errada. Essas são superfícies secundárias: alteram as características da asa, mas não são os comandos primários de atitude.`},
  {t:`Ailerons no eixo vertical, leme no eixo longitudinal e profundor no transversal.`, ok:false,
   pq:`Errada. Os eixos de aileron e leme estão trocados: aileron rola em torno do longitudinal, leme guina em torno do vertical.`},
  {t:`Compensadores (trim tabs) nos três eixos.`, ok:false,
   pq:`Errada. Compensadores são superfícies secundárias, cuja função é aliviar o esforço no comando, não produzir a manobra.`},
  {t:`Ailerons no eixo longitudinal (rolagem), profundor no eixo transversal (arfagem) e leme no eixo vertical (guinada).`, ok:true,
   pq:`Correta. As três primárias são as que controlam a atitude nos três eixos. Memorizar o par superfície-eixo é a base para acertar as perguntas de comando e de estabilidade.`}
 ]},

{id:`CTA-09`, m:`CTA`, dif:2,
 obj:`Relacionar cada tipo de superfície de comando secundária com suas respectivas características principais.`,
 p:`Qual é a função do COMPENSADOR (trim tab) e como ele atua?`,
 alts:[
  {t:`Aliviar ou anular o esforço que o piloto precisa fazer no comando, defletindo-se no sentido oposto ao da superfície principal para mantê-la na posição desejada.`, ok:true,
   pq:`Correta. O compensador é uma pequena superfície na borda de fuga do comando. Ao defletir para um lado, ele empurra a superfície principal para o outro, mantendo-a onde o piloto quer sem força no manche. Voo bem trimado é a base de qualquer manobra estável.`},
  {t:`Aumentar a sustentação da asa em baixa velocidade.`, ok:false,
   pq:`Errada. Isso é função dos dispositivos hipersustentadores, como flapes e slats.`},
  {t:`Substituir o piloto automático em aeronaves sem esse equipamento.`, ok:false,
   pq:`Errada. O compensador equilibra forças, mas não mantém rota nem altitude por conta própria.`},
  {t:`Aumentar a área da superfície de comando, tornando-a mais eficaz em alta velocidade.`, ok:false,
   pq:`Errada. Ele não amplia a área útil do comando; sua função é de equilíbrio de forças.`}
 ]},

{id:`CTA-10`, m:`CTA`, dif:2,
 obj:`Definir pressão estática, pressão dinâmica, escoamento, equação de continuidade, tubos de Pitot e tubos de Venturi.`,
 p:`Num tubo de VENTURI, o que acontece com a velocidade e a pressão do fluido na região de menor seção (garganta)?`,
 alts:[
  {t:`A velocidade diminui e a pressão estática aumenta.`, ok:false,
   pq:`Errada, e viola a continuidade: estreitar a passagem não pode reduzir a velocidade se a vazão é a mesma.`},
  {t:`A velocidade aumenta e a pressão estática diminui.`, ok:true,
   pq:`Correta. Pela equação da continuidade, a mesma vazão passando por uma área menor exige velocidade maior; e pelo teorema de Bernoulli, mais velocidade significa menos pressão estática. É esse par de princípios que explica também o funcionamento do carburador e a sucção no extradorso da asa.`},
  {t:`Velocidade e pressão aumentam juntas.`, ok:false,
   pq:`Errada. Isso implicaria criar energia dentro do tubo, o que Bernoulli exclui.`},
  {t:`Nada muda, pois o fluido é incompressível.`, ok:false,
   pq:`Errada. Justamente por ser incompressível é que a velocidade PRECISA aumentar na garganta para manter a vazão.`}
 ]},

{id:`CTA-11`, m:`CTA`, dif:2,
 obj:`Definir vento relativo, resistência ao avanço, perfil aerodinâmico, aerofólio, resultante aerodinâmica, resistência útil, resistência parasita, arrasto induzido, corda, linha de curvatura média, ângulo de ataque e ângulo de estol.`,
 p:`Como se define o ÂNGULO DE ATAQUE?`,
 alts:[
  {t:`É o ângulo entre o eixo longitudinal da aeronave e o horizonte.`, ok:false,
   pq:`Errada — isso é a ATITUDE de arfagem, que o piloto vê no horizonte artificial. Atitude e ângulo de ataque podem ser muito diferentes.`},
  {t:`É o ângulo com que a asa é fixada à fuselagem.`, ok:false,
   pq:`Errada — isso é o ângulo de INCIDÊNCIA, uma característica construtiva fixa da aeronave.`},
  {t:`É o ângulo formado entre a corda do aerofólio e a direção do vento relativo.`, ok:true,
   pq:`Correta. Note que a referência é o VENTO RELATIVO, não o horizonte nem o solo. É por isso que se pode ter ângulo de ataque alto com o nariz apontado para baixo — situação do estol acelerado em curva descendente.`},
  {t:`É o ângulo entre a corda e a linha de curvatura média do perfil.`, ok:false,
   pq:`Errada. Corda e linha de curvatura média são duas referências geométricas do próprio perfil; o ângulo entre elas descreve o arqueamento, não o ataque.`}
 ]},

{id:`CTA-12`, m:`CTA`, dif:2,
 obj:`Identificar os três eixos imaginários da aeronave (longitudinal, transversal (lateral) e vertical).`,
 p:`Os três eixos imaginários da aeronave se cruzam em que ponto?`,
 alts:[
  {t:`No centro de pressão da asa.`, ok:false,
   pq:`Errada. O centro de pressão é o ponto de aplicação da resultante aerodinâmica e se desloca conforme o ângulo de ataque; ele não é o ponto de rotação.`},
  {t:`No nariz da aeronave.`, ok:false,
   pq:`Errada. O nariz é apenas a extremidade dianteira; a aeronave não gira em torno dele.`},
  {t:`No eixo do motor.`, ok:false,
   pq:`Errada. O eixo do motor é uma referência construtiva e não coincide necessariamente com o CG.`},
  {t:`No centro de gravidade.`, ok:true,
   pq:`Correta. Todos os movimentos de rotação da aeronave se dão em torno do CG. É por isso que a posição do CG afeta diretamente a resposta e a estabilidade em cada eixo.`}
 ]},

{id:`CTA-13`, m:`CTA`, dif:2,
 obj:`Definir: cabrar, picar, inclinar e guinar.`,
 p:`Qual associação entre movimento, eixo e comando está correta?`,
 alts:[
  {t:`Cabrar e picar são movimentos em torno do eixo transversal, comandados pelo profundor.`, ok:true,
   pq:`Correta. Cabrar é levantar o nariz, picar é abaixá-lo; ambos são arfagem, em torno do eixo transversal (lateral), sob comando do profundor acionado pelo manche à frente e atrás.`},
  {t:`Guinar é o movimento em torno do eixo longitudinal, comandado pelos ailerons.`, ok:false,
   pq:`Errada. Guinar é em torno do eixo VERTICAL e é comandado pelo LEME. Em torno do longitudinal, com aileron, o movimento é o de inclinar (rolar).`},
  {t:`Inclinar é o movimento em torno do eixo vertical, comandado pelo leme.`, ok:false,
   pq:`Errada. Inclinar (rolar) ocorre em torno do eixo LONGITUDINAL, sob comando dos ailerons.`},
  {t:`Cabrar é movimento em torno do eixo vertical, comandado pelo compensador.`, ok:false,
   pq:`Errada duas vezes: o eixo é o transversal e o comando é o profundor. O compensador apenas alivia o esforço.`}
 ]},

{id:`CTA-14`, m:`CTA`, dif:2,
 obj:`Definir diedro, diedro positivo, diedro negativo, enflechamento, enflechamento positivo, enflechamento negativo e incidência.`,
 p:`O que é o DIEDRO POSITIVO e qual seu efeito sobre a aeronave?`,
 alts:[
  {t:`É a inclinação das asas para baixo, que aumenta a manobrabilidade em rolagem.`, ok:false,
   pq:`Errada quanto ao nome. Asas inclinadas para baixo constituem diedro NEGATIVO (anedro), usado em aeronaves que precisam de menos estabilidade lateral e mais agilidade.`},
  {t:`É a inclinação das asas para cima em relação ao plano horizontal, que aumenta a estabilidade lateral: numa derrapagem, a asa mais baixa recebe maior ângulo de ataque e tende a subir, nivelando a aeronave.`, ok:true,
   pq:`Correta. Esse é o mecanismo do diedro. É a razão pela qual muitos aviões de treinamento de asa baixa têm diedro acentuado, enquanto os de asa alta obtêm efeito semelhante pela própria posição da asa acima do CG.`},
  {t:`É o ângulo com que a asa é fixada à fuselagem em relação ao eixo longitudinal.`, ok:false,
   pq:`Errada — esse é o ângulo de INCIDÊNCIA, medido no plano vertical ao longo da fuselagem, não no plano frontal.`},
  {t:`É o ângulo de enflechamento das asas para trás, típico de aeronaves rápidas.`, ok:false,
   pq:`Errada. Enflechamento é o recuo das asas em relação ao eixo transversal, visto de cima; diedro é visto de frente.`}
 ]},

{id:`CTA-15`, m:`CTA`, dif:2,
 obj:`Definir estabilidade lateral, estabilidade direcional e estabilidade longitudinal.`,
 p:`Sobre qual eixo atua a ESTABILIDADE DIRECIONAL e qual componente é seu principal responsável?`,
 alts:[
  {t:`Eixo longitudinal (rolagem), tendo o diedro como principal responsável.`, ok:false,
   pq:`Errada. Essa é a estabilidade LATERAL, não direcional.`},
  {t:`Eixo transversal (arfagem), tendo o estabilizador horizontal como responsável.`, ok:false,
   pq:`Errada. Essa é a estabilidade LONGITUDINAL.`},
  {t:`Eixo vertical (guinada), tendo o estabilizador vertical como principal responsável.`, ok:true,
   pq:`Correta. A deriva atua como um cata-vento: se a aeronave guina, ela recebe fluxo lateral e gera momento que devolve o nariz ao vento relativo. É a mesma lógica das penas de uma flecha.`},
  {t:`Eixo vertical, tendo os ailerons como principais responsáveis.`, ok:false,
   pq:`Errada quanto ao componente. O eixo está certo, mas ailerons são superfícies de comando de rolagem, não elementos de estabilidade direcional.`}
 ]},

{id:`CTA-16`, m:`CTA`, dif:2,
 obj:`Classificar as aeronaves quanto ao tipo de motor.`,
 p:`Qual é a diferença essencial entre um motor TURBOÉLICE e um TURBOFAN?`,
 alts:[
  {t:`O turboélice é um motor a pistão com uma turbina acoplada.`, ok:false,
   pq:`Errada. Turboélice é motor de turbina a gás; não há pistões. O que existe com pistão e turbina é o motor turboalimentado, coisa diferente.`},
  {t:`O turbofan não possui compressor nem câmara de combustão.`, ok:false,
   pq:`Errada. O turbofan tem núcleo completo: compressor, câmara de combustão e turbina. O ventilador é acrescentado à frente desse núcleo.`},
  {t:`O turboélice só pode ser instalado em aeronaves militares.`, ok:false,
   pq:`Errada. Turboélices equipam larga parte da aviação regional, agrícola e executiva civil.`},
  {t:`No turboélice, a maior parte da energia da turbina é convertida em potência de eixo para acionar uma hélice; no turbofan, uma fração grande do ar é acelerada por um ventilador carenado, e a tração vem principalmente desse fluxo.`, ok:true,
   pq:`Correta. Ambos partem de um núcleo de turbina a gás. A diferença é como a energia vira tração: hélice externa no turboélice, ventilador carenado no turbofan. O turboélice é mais eficiente em velocidades e altitudes menores.`}
 ]},

{id:`CTA-17`, m:`CTA`, dif:2,
 obj:`Definir peso, sustentação, tração e arrasto.`,
 p:`Qual é a definição correta de SUSTENTAÇÃO?`,
 alts:[
  {t:`É a componente da resultante aerodinâmica perpendicular à direção do vento relativo.`, ok:true,
   pq:`Correta. Sustentação e arrasto são as duas componentes da mesma resultante aerodinâmica: a sustentação perpendicular ao vento relativo, o arrasto paralelo a ele. Como a referência é o vento relativo, em curva a sustentação não aponta para cima.`},
  {t:`É a força que sempre aponta verticalmente para cima, contrária ao peso.`, ok:false,
   pq:`Errada. Só em voo reto e nivelado a sustentação é vertical. Numa curva de 45° ela está inclinada 45°, e é justamente sua componente horizontal que faz a aeronave curvar.`},
  {t:`É a força produzida pelo motor que impulsiona a aeronave para a frente.`, ok:false,
   pq:`Errada — essa é a TRAÇÃO.`},
  {t:`É a força de atrito entre o ar e a superfície da aeronave.`, ok:false,
   pq:`Errada — isso é uma parcela do ARRASTO, o atrito superficial.`}
 ]},

{id:`CTA-18`, m:`CTA`, dif:2,
 obj:`Enunciar o princípio de Arquimedes.`,
 p:`O princípio de Arquimedes explica a sustentação de qual tipo de aeronave?`,
 alts:[
  {t:`Dos aviões, cujo peso é equilibrado pelo empuxo do ar sob a asa.`, ok:false,
   pq:`Errada. O avião é um aeródino: sua sustentação vem do escoamento do ar sobre o aerofólio, não de empuxo hidrostático. O empuxo do ar sobre a estrutura do avião é desprezível diante de seu peso.`},
  {t:`Dos aeróstatos, como balões e dirigíveis, que se sustentam por empuxo ao deslocar um volume de ar mais pesado que o conjunto.`, ok:true,
   pq:`Correta. Aeróstato é a aeronave "mais leve que o ar": sustenta-se estaticamente, sem precisar de velocidade. O aeródino — avião, helicóptero, planador — depende de reações aerodinâmicas, ou seja, de movimento relativo ao ar.`},
  {t:`Dos helicópteros, cujo rotor cria uma bolha de ar de menor densidade.`, ok:false,
   pq:`Errada. O rotor é uma asa giratória; o helicóptero é aeródino e não se sustenta por empuxo.`},
  {t:`De nenhuma aeronave; o princípio só se aplica a líquidos.`, ok:false,
   pq:`Errada. O princípio vale para qualquer fluido, inclusive gases — é exatamente o que sustenta o balão.`}
 ]},

{id:`CTA-19`, m:`CTA`, dif:2,
 obj:`Classificar as aeronaves quanto à posição da asa em relação à fuselagem.`,
 p:`Que classificação recebe a aeronave cuja asa é montada acima da fuselagem, sustentada por montantes, com um afastamento nítido entre a asa e o corpo do avião?`,
 alts:[
  {t:`Asa alta.`, ok:false,
   pq:`Errada. Na asa alta a asa se apoia diretamente sobre a parte superior da fuselagem, sem o afastamento característico da parassol.`},
  {t:`Asa média.`, ok:false,
   pq:`Errada. A asa média atravessa a fuselagem em sua altura intermediária.`},
  {t:`Asa parassol.`, ok:true,
   pq:`Correta. A parassol fica claramente afastada acima da fuselagem, como um guarda-sol — daí o nome. Não se confunde com a asa alta, que é fixada diretamente no topo da fuselagem.`},
  {t:`Asa cantilever.`, ok:false,
   pq:`Errada. Cantilever é classificação quanto à FIXAÇÃO (sem apoios externos) — e o enunciado descreve justamente uma asa com montantes, portanto semicantilever.`}
 ]},

{id:`CTA-20`, m:`CTA`, dif:2,
 obj:`Definir teoria de voo de alta velocidade.`,
 p:`O que é o NÚMERO DE MACH?`,
 alts:[
  {t:`A velocidade da aeronave expressa em quilômetros por hora dividida por mil.`, ok:false,
   pq:`Errada. Não há relação com o sistema métrico; Mach é adimensional.`},
  {t:`A velocidade máxima estrutural da aeronave.`, ok:false,
   pq:`Errada. Limite estrutural de velocidade é a Vne, ou o Mmo em aeronaves de alta velocidade — não a definição de número de Mach.`},
  {t:`A razão entre a velocidade indicada e a velocidade verdadeira.`, ok:false,
   pq:`Errada. Essa razão diz respeito à correção de densidade entre IAS e TAS, sem relação com a velocidade do som.`},
  {t:`A razão entre a velocidade da aeronave e a velocidade do som no ar em que ela se encontra.`, ok:true,
   pq:`Correta. Por ser uma razão, Mach 1 não corresponde sempre à mesma velocidade indicada: a velocidade do som depende da temperatura, e portanto diminui com a altitude. Voar Mach 0,8 no nível do mar e a 35.000 ft significa velocidades verdadeiras diferentes.`}
 ]},

{id:`CTA-21`, m:`CTA`, dif:2,
 obj:`Classificar as aeronaves quanto à velocidade, em relação ao número de Mach.`,
 p:`Como se classifica uma aeronave que opera em regime TRANSÔNICO?`,
 alts:[
  {t:`Aquela cuja faixa de operação abrange velocidades em que coexistem escoamentos subsônicos e supersônicos sobre a estrutura, aproximadamente entre Mach 0,75 e Mach 1,20.`, ok:true,
   pq:`Correta. O transônico é a faixa mais delicada aerodinamicamente: mesmo com a aeronave abaixo de Mach 1, o escoamento acelerado sobre o extradorso já pode ultrapassar a velocidade do som, formando ondas de choque locais. Os limites exatos variam conforme o perfil e a referência adotada.`},
  {t:`Aquela que voa sempre acima de Mach 5.`, ok:false,
   pq:`Errada. Acima de Mach 5 o regime é chamado hipersônico.`},
  {t:`Aquela que voa abaixo de Mach 0,5 em qualquer condição.`, ok:false,
   pq:`Errada. Essa é claramente a faixa subsônica, sem qualquer efeito de compressibilidade relevante.`},
  {t:`Aquela que só pode operar acima de 40.000 ft.`, ok:false,
   pq:`Errada. A classificação é por número de Mach, não por altitude, ainda que altitude e temperatura influam na velocidade do som.`}
 ]},

{id:`CTA-22`, m:`CTA`, dif:2,
 obj:`Definir cada um dos tipos de equilíbrio da aeronave em voo.`,
 p:`Qual é a condição para que a aeronave esteja em EQUILÍBRIO durante o voo?`,
 alts:[
  {t:`Que a sustentação seja maior que o peso.`, ok:false,
   pq:`Errada. Sustentação maior que peso produz aceleração vertical, ou seja, quebra o equilíbrio.`},
  {t:`Que a soma de todas as forças e a soma de todos os momentos que atuam sobre ela sejam nulas.`, ok:true,
   pq:`Correta. Equilíbrio exige as duas condições: forças em equilíbrio (para não haver aceleração linear) e momentos em equilíbrio (para não haver rotação). Um avião pode ter as forças equilibradas e ainda assim estar cabrando, se houver momento resultante.`},
  {t:`Que a aeronave esteja voando em linha reta, independentemente da velocidade.`, ok:false,
   pq:`Errada. Voo retilíneo acelerado não é equilíbrio; falta a condição de velocidade constante.`},
  {t:`Que o piloto mantenha o manche na posição neutra.`, ok:false,
   pq:`Errada. Posição do manche não define equilíbrio; uma aeronave destrimada pode exigir força constante justamente para se manter equilibrada.`}
 ]}
];

const Q_CTA2 = [
{id:`CTA-23`, m:`CTA`, dif:2,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Qual é a sequência correta dos tempos de um motor a pistão de quatro tempos?`,
 alts:[
  {t:`Compressão, admissão, escapamento e potência.`, ok:false,
   pq:`Errada. Comprimir antes de admitir não faz sentido: não haveria mistura no cilindro para comprimir.`},
  {t:`Admissão, potência, compressão e escapamento.`, ok:false,
   pq:`Errada. A combustão precisa ocorrer com a mistura já comprimida; sem compressão prévia não há rendimento nem pressão útil.`},
  {t:`Admissão, compressão, potência (expansão) e escapamento.`, ok:true,
   pq:`Correta. O pistão desce admitindo a mistura, sobe comprimindo, é empurrado para baixo pela combustão (único tempo que produz trabalho) e sobe de novo expulsando os gases. São dois giros completos do virabrequim por ciclo.`},
  {t:`Ignição, admissão, compressão e escapamento.`, ok:false,
   pq:`Errada. A ignição não é um dos quatro tempos: ela é o evento que dá início ao tempo de potência.`}
 ]},

{id:`CTA-24`, m:`CTA`, dif:3,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Por que os motores aeronáuticos a pistão usam ignição DUPLA, com dois magnetos e duas velas por cilindro?`,
 alts:[
  {t:`Para permitir a partida do motor sem bateria.`, ok:false,
   pq:`Errada quanto ao motivo do sistema duplo — embora seja verdade que o magneto é autoalimentado. Essa autonomia é característica do magneto, não a razão de haver dois conjuntos.`},
  {t:`Para dobrar a potência do motor.`, ok:false,
   pq:`Errada. A ignição dupla melhora a eficiência da queima, mas não dobra potência.`},
  {t:`Para permitir o funcionamento com dois tipos diferentes de combustível.`, ok:false,
   pq:`Errada. O sistema de ignição não tem relação com o tipo de combustível admitido.`},
  {t:`Por redundância e por eficiência: duas frentes de chama tornam a combustão mais rápida e completa, e a falha de um sistema não para o motor.`, ok:true,
   pq:`Correta. É por isso que o teste de magnetos antes da decolagem é obrigatório: verifica-se cada sistema isoladamente. Uma queda de RPM dentro do limite indica sistema saudável; queda excessiva ou nenhuma queda indicam problema.`}
 ]},

{id:`CTA-25`, m:`CTA`, dif:3,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Por que uma hélice pode girar e o motor pegar mesmo com a chave de ignição na posição desligada, se houver defeito no sistema?`,
 alts:[
  {t:`Porque o magneto é autoalimentado: ele gera a própria centelha ao girar, e a chave só o desliga aterrando seu circuito — se esse fio de aterramento estiver partido, o magneto continua "vivo".`, ok:true,
   pq:`Correta, e é conhecimento de segurança pessoal, não só de prova. É por isso que se trata toda hélice como se estivesse armada: nunca a movimente com o corpo na frente do arco, ainda que a chave esteja desligada e o avião parado há dias.`},
  {t:`Porque a bateria continua alimentando as velas.`, ok:false,
   pq:`Errada. A bateria não alimenta as velas: quem gera a centelha é o magneto, por indução, a partir da rotação do próprio motor.`},
  {t:`Porque o combustível residual no cilindro entra em autoignição.`, ok:false,
   pq:`Errada. Motores a gasolina não operam por autoignição; a pressão de compressão é insuficiente para isso.`},
  {t:`Porque o alternador continua gerando energia com a hélice girando.`, ok:false,
   pq:`Errada. O alternador alimenta o sistema elétrico da aeronave, não a ignição do motor.`}
 ]},

{id:`CTA-26`, m:`CTA`, dif:3,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Em que condições o GELO NO CARBURADOR pode se formar e qual o primeiro sintoma num avião com hélice de passo fixo?`,
 alts:[
  {t:`Somente com temperatura externa abaixo de zero; o primeiro sintoma é o aumento da temperatura do óleo.`, ok:false,
   pq:`Errada nos dois pontos. O gelo de carburador ocorre com temperatura externa bem acima de zero, e temperatura de óleo não é indicador desse problema.`},
  {t:`Com ar úmido e temperatura externa que pode chegar a mais de 20 °C; o primeiro sintoma é a queda gradual da RPM, com marcha irregular.`, ok:true,
   pq:`Correta, e é o ponto contraintuitivo da matéria. A queda de pressão e a vaporização do combustível no venturi do carburador podem baixar a temperatura em 20 °C ou mais, congelando a umidade do ar. Por isso o gelo de carburador é um perigo de dia quente e úmido, típico do Brasil — e a suspeita se confirma aplicando o aquecimento do carburador.`},
  {t:`Apenas em voo acima de 10.000 ft; o primeiro sintoma é a perda de pressão de combustível.`, ok:false,
   pq:`Errada. Não há relação com altitude elevada; o fenômeno é comum em baixa altitude, inclusive em solo com o motor em marcha lenta.`},
  {t:`Somente durante a decolagem em potência máxima.`, ok:false,
   pq:`Errada, e ao contrário: o risco é maior com potência REDUZIDA, como em descida com manete recuada, quando a borboleta parcialmente fechada favorece a formação do gelo.`}
 ]},

{id:`CTA-27`, m:`CTA`, dif:2,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`O que acontece com a mistura ar-combustível ao se aplicar o AQUECIMENTO DO CARBURADOR?`,
 alts:[
  {t:`A mistura empobrece e a potência aumenta.`, ok:false,
   pq:`Errada nos dois pontos, e é a inversão exata do efeito real.`},
  {t:`Nada muda na mistura; apenas o gelo derrete.`, ok:false,
   pq:`Errada. O ar quente é menos denso, então a proporção entre ar e combustível necessariamente se altera.`},
  {t:`A mistura enriquece e há alguma perda de potência, porque o ar quente é menos denso.`, ok:true,
   pq:`Correta. É o preço a pagar: entra menos massa de ar para a mesma quantidade de combustível. Por isso, ao usar aquecimento de carburador por período prolongado, pode ser necessário ajustar a mistura — e por isso ele não é usado em decolagem, quando se quer potência máxima.`},
  {t:`A mistura enriquece e a potência aumenta.`, ok:false,
   pq:`Errada quanto à potência. Enriquecer por redução de densidade não gera potência adicional; ao contrário, reduz.`}
 ]},

{id:`CTA-28`, m:`CTA`, dif:2,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Por que é necessário EMPOBRECER a mistura conforme a aeronave sobe?`,
 alts:[
  {t:`Porque o combustível se expande com a altitude e ocupa mais volume.`, ok:false,
   pq:`Errada. A variação de volume do combustível líquido é irrelevante para a proporção da mistura.`},
  {t:`Porque em altitude o motor precisa de mais combustível para compensar a menor potência.`, ok:false,
   pq:`Errada, e é exatamente o contrário do procedimento correto.`},
  {t:`Porque a temperatura mais baixa em altitude exige mais combustível para a partida.`, ok:false,
   pq:`Errada. A questão trata de voo em cruzeiro, não de partida a frio.`},
  {t:`Porque a densidade do ar diminui com a altitude, e sem o ajuste a mistura ficaria excessivamente rica.`, ok:true,
   pq:`Correta. O carburador dosa combustível em função do VOLUME de ar, não da sua massa. Subindo, o mesmo volume traz menos massa de ar, e a mistura enriquece sozinha — daí perda de potência, marcha irregular, consumo excessivo e formação de depósitos nas velas.`}
 ]},

{id:`CTA-29`, m:`CTA`, dif:3,
 obj:`Identificar os procedimentos adequados de identificação, análise e solução de panes em motores aeronáuticos.`,
 p:`Qual é a diferença entre DETONAÇÃO e PRÉ-IGNIÇÃO num motor a pistão?`,
 alts:[
  {t:`Detonação é a queima explosiva e descontrolada da mistura APÓS a centelha; pré-ignição é a inflamação da mistura ANTES da centelha, por um ponto quente na câmara.`, ok:true,
   pq:`Correta. As duas produzem sobrecarga térmica e mecânica e podem destruir o motor rapidamente. Causas típicas de detonação: mistura pobre demais em potência alta, combustível de octanagem inferior à especificada e temperaturas excessivas.`},
  {t:`São o mesmo fenômeno, com nomes diferentes conforme o fabricante.`, ok:false,
   pq:`Errada. São fenômenos distintos, com causas e momentos diferentes, ainda que possam ocorrer juntos e um leve ao outro.`},
  {t:`Detonação ocorre só na partida e pré-ignição só no corte do motor.`, ok:false,
   pq:`Errada. Ambas ocorrem com o motor em funcionamento sob carga, tipicamente em potência elevada.`},
  {t:`Detonação é o funcionamento normal do motor diesel aplicado à aviação.`, ok:false,
   pq:`Errada. A combustão por compressão do ciclo Diesel é projetada e controlada; detonação é anomalia destrutiva em motor de ignição por centelha.`}
 ]},

{id:`CTA-30`, m:`CTA`, dif:2,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Além de reduzir o atrito, quais são as outras funções do ÓLEO num motor aeronáutico a pistão?`,
 alts:[
  {t:`Apenas lubrificar; refrigeração é feita exclusivamente pelo ar.`, ok:false,
   pq:`Errada. Em motores refrigerados a ar o óleo é responsável por uma parcela significativa da remoção de calor, sobretudo de mancais e do interior dos pistões.`},
  {t:`Refrigerar, vedar a folga entre pistão e cilindro, limpar carregando resíduos e proteger contra corrosão.`, ok:true,
   pq:`Correta. Cinco funções ao todo, com a lubrificação. É por isso que a checagem de óleo antes do voo não é formalidade: pouco óleo compromete simultaneamente a lubrificação e a refrigeração, e o efeito aparece primeiro na temperatura de cabeça de cilindro.`},
  {t:`Aumentar a compressão e elevar a octanagem do combustível.`, ok:false,
   pq:`Errada. Octanagem é propriedade do combustível; o óleo não interfere nela.`},
  {t:`Servir de fluido hidráulico para o trem de pouso.`, ok:false,
   pq:`Errada. Sistemas hidráulicos usam fluido próprio, em circuito separado do motor.`}
 ]},

{id:`CTA-31`, m:`CTA`, dif:2,
 obj:`Identificar os efeitos da hélice nas manobras das aeronaves.`,
 p:`Numa aeronave com hélice de VELOCIDADE CONSTANTE, o que cada manete controla?`,
 alts:[
  {t:`A manete de potência controla a RPM e a de hélice controla a pressão de admissão.`, ok:false,
   pq:`Errada — as funções estão invertidas. É um erro que leva a exceder limites do motor, ajustando o parâmetro errado.`},
  {t:`As duas controlam a RPM, sendo uma para grosso e outra para fino.`, ok:false,
   pq:`Errada. São parâmetros distintos, não ajustes de sensibilidade do mesmo parâmetro.`},
  {t:`A manete de potência controla a PRESSÃO DE ADMISSÃO e a manete de hélice controla a RPM, mantida constante pelo governador.`, ok:true,
   pq:`Correta. O governador varia o passo automaticamente para segurar a RPM selecionada. Regra prática de sequência: ao aumentar potência, hélice primeiro e depois potência; ao reduzir, potência primeiro e depois hélice — para não deixar pressão de admissão alta com RPM baixa.`},
  {t:`A manete de hélice controla a mistura ar-combustível.`, ok:false,
   pq:`Errada. Mistura tem manete própria, normalmente identificada por cor distinta.`}
 ]},

{id:`CTA-32`, m:`CTA`, dif:2,
 obj:`Identificar os efeitos da hélice nas manobras das aeronaves.`,
 p:`Qual é a limitação principal de uma hélice de PASSO FIXO?`,
 alts:[
  {t:`Ela só pode ser usada em voo abaixo de 5.000 ft.`, ok:false,
   pq:`Errada. Não há limitação de altitude associada ao tipo de hélice.`},
  {t:`Ela não permite variar a RPM do motor em voo.`, ok:false,
   pq:`Errada. A RPM varia, sim — com a manete de potência e com a velocidade da aeronave. O que não varia é o ângulo das pás.`},
  {t:`Ela exige uso obrigatório de aquecimento do carburador.`, ok:false,
   pq:`Errada. O aquecimento de carburador está ligado ao sistema de admissão, não ao tipo de hélice.`},
  {t:`Como o ângulo das pás é fixo, ela só tem rendimento ótimo numa faixa estreita de velocidade — é otimizada para subida ou para cruzeiro, mas não para ambos.`, ok:true,
   pq:`Correta. Daí a distinção entre hélice "climb" e hélice "cruise": uma dá melhor desempenho na decolagem e subida, a outra em cruzeiro, e a escolha é um compromisso feito no solo. A hélice de velocidade constante resolve isso variando o passo em voo.`}
 ]},

{id:`CTA-33`, m:`CTA`, dif:2,
 obj:`Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um deles e o princípio de funcionamento.`,
 p:`Quais são as duas propriedades do giroscópio que permitem o funcionamento dos instrumentos giroscópicos?`,
 alts:[
  {t:`Rigidez no espaço e precessão.`, ok:true,
   pq:`Correta. A rigidez no espaço é o que faz o rotor manter seu plano de rotação, servindo de referência fixa — base do horizonte artificial e do giro direcional. A precessão, a resposta deslocada 90° no sentido de rotação, é o princípio do indicador de curva e também a causa de erros a corrigir periodicamente.`},
  {t:`Inércia térmica e dilatação.`, ok:false,
   pq:`Errada. São propriedades usadas em instrumentos de temperatura, não em giroscópios.`},
  {t:`Capilaridade e tensão superficial.`, ok:false,
   pq:`Errada. São fenômenos de fluidos, sem relação com giroscópios.`},
  {t:`Magnetismo e indução.`, ok:false,
   pq:`Errada. Esses princípios explicam a bússola magnética, que é justamente o instrumento NÃO giroscópico de direção.`}
 ]},

{id:`CTA-34`, m:`CTA`, dif:2,
 obj:`Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um deles e o princípio de funcionamento.`,
 p:`Quais instrumentos básicos de um avião leve são normalmente acionados pelo sistema de VÁCUO?`,
 alts:[
  {t:`Altímetro e velocímetro.`, ok:false,
   pq:`Errada. Ambos são instrumentos de pressão, alimentados pelo sistema Pitot-estático, e não por vácuo.`},
  {t:`Horizonte artificial e giro direcional.`, ok:true,
   pq:`Correta. Numa instalação típica, a bomba de vácuo acionada pelo motor gira esses dois giroscópios, enquanto o indicador de curva costuma ser elétrico — divisão proposital, para que a falha de uma fonte não apague todas as referências de atitude.`},
  {t:`Bússola magnética e indicador de temperatura externa.`, ok:false,
   pq:`Errada. A bússola é autônoma e magnética; o termômetro externo é um sensor simples, sem vácuo.`},
  {t:`Tacômetro e indicador de pressão de óleo.`, ok:false,
   pq:`Errada. São instrumentos de motor, com acionamento mecânico ou elétrico próprio.`}
 ]},

{id:`CTA-35`, m:`CTA`, dif:3,
 obj:`Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um deles e o princípio de funcionamento.`,
 p:`Quais são os principais erros da BÚSSOLA MAGNÉTICA e qual sua causa comum?`,
 alts:[
  {t:`Erros de paralaxe, causados pela posição do piloto na cabine.`, ok:false,
   pq:`Errada. Paralaxe afeta a leitura de mostradores analógicos em geral, mas não é o erro característico da bússola.`},
  {t:`Erros de altitude, causados pela variação de pressão.`, ok:false,
   pq:`Errada. A bússola não depende de pressão; isso afeta altímetro, velocímetro e climb.`},
  {t:`Erros de aceleração e de curva, causados pela componente vertical do campo magnético terrestre (inclinação, ou dip).`, ok:true,
   pq:`Correta. A agulha tende a mergulhar em direção ao polo magnético, e essa componente vertical faz o conjunto responder de forma espúria a acelerações e a curvas — mais acentuadamente em proas próximas de norte e sul. O sentido dos erros se inverte entre os hemisférios, por isso mnemônicos importados do hemisfério norte não valem aqui.`},
  {t:`Erros de precessão, causados pelo atrito dos rolamentos.`, ok:false,
   pq:`Errada. Precessão é fenômeno de giroscópios; a bússola magnética não é um giroscópio.`}
 ]},

{id:`CTA-36`, m:`CTA`, dif:2,
 obj:`Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um deles e o princípio de funcionamento.`,
 p:`Num avião leve típico, qual é a função do ALTERNADOR e o que acontece se ele falhar em voo?`,
 alts:[
  {t:`Ele dá a partida no motor; sem ele, o motor para.`, ok:false,
   pq:`Errada. Quem dá a partida é o motor de arranque; e o motor a pistão, uma vez em funcionamento, não depende do sistema elétrico da aeronave para continuar operando, graças aos magnetos.`},
  {t:`Ele alimenta os magnetos; sem ele, a ignição cessa.`, ok:false,
   pq:`Errada. O magneto é autoalimentado justamente para que a falha elétrica não pare o motor.`},
  {t:`Ele aciona a bomba de vácuo; sem ele, todos os instrumentos param.`, ok:false,
   pq:`Errada. A bomba de vácuo é acionada mecanicamente pelo motor, e não pelo alternador.`},
  {t:`Ele alimenta o sistema elétrico e recarrega a bateria; se falhar, a aeronave passa a consumir a bateria, com autonomia elétrica limitada — mas o motor continua funcionando.`, ok:true,
   pq:`Correta, e a segunda parte é o que traz calma na hora: a ignição é por magneto, independente do sistema elétrico. A conduta é reduzir cargas não essenciais para esticar a bateria, que alimenta rádio, transponder e instrumentos elétricos, e planejar o pouso.`}
 ]},

{id:`CTA-37`, m:`CTA`, dif:2,
 obj:`Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um deles e o princípio de funcionamento.`,
 p:`Qual é a função do disjuntor (circuit breaker) no sistema elétrico da aeronave?`,
 alts:[
  {t:`Proteger o circuito, interrompendo-o quando a corrente excede o valor previsto.`, ok:true,
   pq:`Correta. A regra operacional que acompanha: disjuntor que salta pode ser rearmado uma vez; se saltar de novo, há falha real e insistir pode causar incêndio. Nunca se segura um disjuntor armado à força.`},
  {t:`Aumentar a tensão fornecida aos equipamentos.`, ok:false,
   pq:`Errada. Elevar ou reduzir tensão é função de conversores e reguladores, não de disjuntores.`},
  {t:`Armazenar energia para a partida do motor.`, ok:false,
   pq:`Errada. Armazenamento de energia é função da bateria.`},
  {t:`Converter corrente contínua em alternada para os instrumentos.`, ok:false,
   pq:`Errada. Essa conversão, quando necessária, é feita por inversor.`}
 ]},

{id:`CTA-38`, m:`CTA`, dif:2,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Por que é obrigatório drenar os pontos baixos do sistema de combustível antes do voo?`,
 alts:[
  {t:`Para reduzir o peso da aeronave antes da decolagem.`, ok:false,
   pq:`Errada. A quantidade drenada é insignificante para o peso e não é essa a finalidade.`},
  {t:`Para verificar a presença de água e de contaminantes, que se acumulam no ponto mais baixo por serem mais densos que o combustível.`, ok:true,
   pq:`Correta. Água condensada ou infiltrada afunda, e uma porção dela chegando ao motor causa falha. A drenagem também permite confirmar a cor do combustível — o AVGAS 100LL é azul — evitando o erro grave de abastecimento com querosene de aviação.`},
  {t:`Para verificar a octanagem do combustível.`, ok:false,
   pq:`Errada. Octanagem não se verifica por dreno; o que a amostra permite confirmar é o TIPO de combustível, pela cor.`},
  {t:`Para aliviar a pressão do sistema antes da partida.`, ok:false,
   pq:`Errada. O sistema de combustível de aeronaves leves não trabalha sob pressão que exija alívio manual.`}
 ]},

{id:`CTA-39`, m:`CTA`, dif:2,
 obj:`Identificar as características principais das aeronaves com motores convencionais.`,
 p:`Num avião de asa alta com alimentação por gravidade, e num de asa baixa, como o combustível chega ao motor?`,
 alts:[
  {t:`Nos dois casos apenas por gravidade, já que os tanques ficam nas asas.`, ok:false,
   pq:`Errada. No avião de asa baixa os tanques ficam abaixo do motor, e a gravidade trabalharia contra o fluxo.`},
  {t:`Nos dois casos apenas por bomba elétrica.`, ok:false,
   pq:`Errada. A alimentação por gravidade é característica clássica dos aviões de asa alta e dispensa bomba em operação normal.`},
  {t:`No de asa alta, tipicamente por gravidade; no de asa baixa, com auxílio de bomba de combustível, normalmente havendo bomba elétrica auxiliar além da mecânica.`, ok:true,
   pq:`Correta. É por isso que os procedimentos diferem: no asa baixa a bomba elétrica auxiliar costuma ser ligada em decolagem, pouso e troca de tanque, para garantir alimentação se a bomba mecânica falhar no momento crítico.`},
  {t:`Por pressurização dos tanques com ar de impacto.`, ok:false,
   pq:`Errada. Os tanques são ventilados para a atmosfera, e não pressurizados para alimentar o motor.`}
 ]},

{id:`CTA-40`, m:`CTA`, dif:2,
 obj:`Relacionar cada tipo de superfície de comando secundária com suas respectivas características principais.`,
 p:`O que são SLATS e qual sua função?`,
 alts:[
  {t:`Superfícies no bordo de fuga que aumentam o arrasto para a descida.`, ok:false,
   pq:`Errada. Dispositivos de bordo de fuga voltados a aumentar arrasto são os spoilers e os freios aerodinâmicos.`},
  {t:`Compensadores que aliviam o esforço no manche.`, ok:false,
   pq:`Errada. Compensadores são os trim tabs, e ficam nas superfícies de comando.`},
  {t:`Superfícies que substituem os ailerons em baixa velocidade.`, ok:false,
   pq:`Errada. Controle em rolagem continua sendo dos ailerons; slats não têm função de comando.`},
  {t:`Dispositivos no BORDO DE ATAQUE da asa que, ao se estenderem, retardam o descolamento do escoamento e permitem voar em ângulos de ataque maiores antes do estol.`, ok:true,
   pq:`Correta. Enquanto o flape atua no bordo de fuga aumentando a curvatura, o slat atua no bordo de ataque energizando o escoamento. Os dois são hipersustentadores, mas por mecanismos diferentes.`}
 ]},

{id:`CTA-41`, m:`CTA`, dif:2,
 obj:`Relacionar cada tipo de superfície de comando secundária com suas respectivas características principais.`,
 p:`Qual é a função dos SPOILERS?`,
 alts:[
  {t:`Reduzir a sustentação e aumentar o arrasto, permitindo descidas mais íngremes e, no solo, transferir peso para as rodas melhorando a frenagem.`, ok:true,
   pq:`Correta. As duas aplicações são complementares: em voo servem para descer sem ganhar velocidade; no toque, ao "matar" a sustentação residual, fazem o peso ir para o trem de pouso, o que é o que torna os freios eficazes.`},
  {t:`Aumentar a sustentação em baixa velocidade.`, ok:false,
   pq:`Errada, e é o oposto: eles existem para destruir sustentação, não para criá-la.`},
  {t:`Compensar a guinada adversa dos ailerons.`, ok:false,
   pq:`Errada quanto à função primária, ainda que em algumas aeronaves spoilers auxiliem o controle de rolagem. Guinada adversa se corrige com leme e com projeto de aileron diferencial.`},
  {t:`Aumentar o alcance de planeio em caso de pane de motor.`, ok:false,
   pq:`Errada. Ao aumentar o arrasto e reduzir a sustentação, eles diminuem o alcance de planeio.`}
 ]},

{id:`CTA-42`, m:`CTA`, dif:2,
 obj:`Classificar as aeronaves quanto ao tipo de motor.`,
 p:`Qual é a diferença entre um motor a pistão ASPIRADO e um TURBOALIMENTADO?`,
 alts:[
  {t:`O turboalimentado é um motor a reação, sem pistões.`, ok:false,
   pq:`Errada. Turboalimentado continua sendo motor a pistão; apenas recebe ar comprimido por um turbocompressor movido pelos gases de escape.`},
  {t:`O aspirado admite o ar na pressão ambiente e perde potência com a altitude; o turboalimentado comprime o ar de admissão, mantendo a potência em altitudes mais elevadas.`, ok:true,
   pq:`Correta. O ganho é justamente onde o aspirado sofre: acima de alguns milhares de pés, o aspirado vai perdendo potência proporcionalmente à queda de densidade, enquanto o turboalimentado sustenta a pressão de admissão até a chamada altitude crítica.`},
  {t:`O turboalimentado usa querosene de aviação em vez de gasolina.`, ok:false,
   pq:`Errada. O combustível continua sendo gasolina de aviação; quem usa querosene são as turbinas.`},
  {t:`O aspirado só funciona em aeronaves de asa alta.`, ok:false,
   pq:`Errada. Não há relação entre tipo de admissão e posição da asa.`}
 ]}
];

/* --- parâmetros do "potinho" de cobertura (explicados na tela) --- */
const CRED_MAX   = 3;   // acertos, em dias diferentes, para encher a célula
// Decaimento calibrado ACIMA do maior intervalo da repetição espaçada (35 dias).
// Se fosse menor, o app puniria você por seguir a própria agenda que ele propõe:
// um objetivo revisado no prazo nunca deveria perder crédito.
const DECAI_DIAS = 45;  // a cada 45 dias sem tocar no objetivo, perde 1 crédito
const GATE_COB   = 0.85;// cobertura mínima da matéria para liberar validação
const GATE_ACC   = 0.80;// acerto recente mínimo (margem sobre os 70% da prova)
const GATE_AMOSTRA = 25;// respostas recentes mínimas para a métrica valer
const JANELA_DIAS  = 60;// janela do "acerto recente"
const JANELA_RESP  = 40;// nº máximo de respostas consideradas recentes
const META_DIA   = 12;  // questões-alvo da sessão diária
const SEG_DIA    = 900; // 15 minutos
const LEITNER    = [0,1,3,7,16,35];

/* Índice de objetivos existentes no banco, por matéria */

const somaDias = (d,n) => { const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toLocaleDateString('sv-SE'); };

function toast(msg, ms){
