<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b0f">
<title>Guided Training — Briefing & Debrief PP</title>
<style>
/* =====================================================================
   GUIDED TRAINING v2 — EFB de bolso
   Escuro, tipografia de instrumento, feito para celular ao lado do console.
   ===================================================================== */
:root{
  color-scheme: dark;
  --fundo:#070b0f; --painel:#0e151c; --painel2:#131d26; --linha:#1e2b38;
  --texto:#cfe3f2; --apagado:#7d97aa;
  --verde:#24e07a; --ambar:#ffb020; --vermelho:#ff4d4d; --ciano:#35c4ff;
  --mono: ui-monospace,"Cascadia Mono","Roboto Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--fundo);min-height:100%}
body{
  font-family:var(--mono); color:var(--texto); font-size:15px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  background:radial-gradient(900px 420px at 50% -8%,#10202c 0%,transparent 62%),var(--fundo);
}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:var(--mono);cursor:pointer}

/* ---------- topo ---------- */
.topo{
  position:sticky;top:0;z-index:20;background:rgba(14,21,28,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);
  padding:10px 14px calc(10px);
}
.topo-l1{display:flex;align-items:center;gap:10px}
.marca{font-size:13px;letter-spacing:2.5px;color:var(--ciano);font-weight:700}
.marca span{color:var(--apagado)}
.nuvem{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--apagado);
  border:1px solid var(--linha);border-radius:20px;padding:4px 10px;background:var(--painel2)}
.led{width:7px;height:7px;border-radius:50%;background:var(--ambar)}
.nuvem.ok .led{background:var(--verde)} .nuvem.off .led{background:var(--vermelho)}

.seletores{display:flex;gap:8px;margin-top:10px}
select{
  flex:1;background:var(--painel2);color:var(--texto);border:1px solid var(--linha);
  border-radius:8px;padding:10px;font-family:var(--mono);font-size:14px;min-width:0;
}

/* ---------- abas inferiores ---------- */
.abas{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(14,21,28,.98);border-top:1px solid var(--linha);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);
}
.abas button{
  background:none;border:0;color:var(--apagado);padding:13px 4px 15px;font-size:11px;
  letter-spacing:1.5px;border-top:2px solid transparent;
}
.abas button.on{color:var(--ciano);border-top-color:var(--ciano);background:rgba(53,196,255,.06)}
.abas b{display:block;font-size:17px;margin-bottom:3px;font-weight:400}

/* ---------- blocos ---------- */
.tela{padding:14px;display:none} .tela.on{display:block}
.card{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:15px;margin-bottom:12px}
.rot{font-size:10px;letter-spacing:2px;color:var(--apagado);margin-bottom:9px}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:12px;
  background:var(--painel2);border:1px solid var(--linha);color:var(--apagado);margin:2px 4px 2px 0}
.tag.acs{color:var(--ciano);border-color:#1d4b63}
.tag.aviso{color:var(--ambar);border-color:#5a4310}

.titulo-manobra{font-size:19px;margin-bottom:8px;line-height:1.25}
.sub{color:var(--apagado);font-size:13px}

ol.passos{margin:0;padding-left:22px} ol.passos li{margin-bottom:9px}
ul.erros{margin:0;padding-left:20px} ul.erros li{margin-bottom:8px;color:#e8d9b4}

.tol{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--linha)}
.tol:last-child{border-bottom:0}
.tol .lb{flex:1;min-width:0}
.tol .lb b{display:block;font-weight:500;font-size:14px}
.tol .lb small{color:var(--apagado);font-size:11px}
.tol .vl{font-size:17px;color:var(--verde);white-space:nowrap;font-weight:600}

.aviso-box{border-left:3px solid var(--ambar);background:#1d1704;color:#ffd684;
  padding:11px 13px;border-radius:8px;font-size:13px;margin-top:12px}
.nota-fonte{border-left:3px solid var(--ciano);background:#08202b;color:#a9d9ef;
  padding:11px 13px;border-radius:8px;font-size:12px;margin-top:12px}
.futuro{border-left:3px solid #7a5cff;background:#120e26;color:#c3b6ff;
  padding:11px 13px;border-radius:8px;font-size:12px}

/* ---------- debrief ---------- */
.item{background:var(--painel);border:1px solid var(--linha);border-left:3px solid var(--apagado);
  border-radius:10px;padding:13px;margin-bottom:10px}
.item.dentro{border-left-color:var(--verde)}
.item.fora{border-left-color:var(--vermelho)}
.item .cab{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.item .cab b{font-size:14px;font-weight:500;flex:1}
.item .cab i{font-style:normal;font-size:13px;color:var(--ciano);white-space:nowrap}
.item .fon{font-size:10px;color:var(--apagado);margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.opts button{
  background:var(--painel2);border:1px solid var(--linha);color:var(--apagado);
  border-radius:8px;padding:11px 4px;font-size:12px;
}
.opts button.sel[data-v="dentro"]{background:rgba(36,224,122,.16);border-color:var(--verde);color:var(--verde)}
.opts button.sel[data-v="fora"]{background:rgba(255,77,77,.14);border-color:var(--vermelho);color:var(--vermelho)}
.opts button.sel[data-v="na"]{background:var(--linha);color:var(--texto)}
.desvio{margin-top:9px;display:none}
.item.fora .desvio{display:block}
input[type=text],input[type=date],input[type=number],textarea{
  width:100%;background:var(--painel2);border:1px solid var(--linha);border-radius:8px;
  color:var(--texto);padding:10px;font-family:var(--mono);font-size:14px;
}
textarea{min-height:92px;resize:vertical}

.btn{width:100%;padding:15px;border-radius:10px;border:1px solid var(--linha);
  background:var(--painel2);color:var(--texto);font-size:14px;margin-top:10px}
.btn.pri{background:var(--ciano);color:#04121b;border-color:var(--ciano);font-weight:700}
.btn:disabled{opacity:.45}

.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.resumo div{background:var(--painel2);border:1px solid var(--linha);border-radius:10px;padding:13px 6px;text-align:center}
.resumo b{display:block;font-size:26px;color:var(--ciano)}
.resumo span{font-size:9px;letter-spacing:1px;color:var(--apagado)}

/* ---------- evolução ---------- */
.ev{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:13px;margin-bottom:10px}
.ev-cab{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ev-cab b{flex:1;font-size:14px;font-weight:500}
.pill{font-size:9px;letter-spacing:1px;padding:4px 9px;border-radius:11px;white-space:nowrap}
.pill.bom{background:rgba(36,224,122,.15);color:var(--verde)}
.pill.rep{background:rgba(255,77,77,.13);color:var(--vermelho)}
.pill.novo{background:var(--linha);color:var(--apagado)}
.barras{display:flex;align-items:flex-end;gap:4px;height:46px;margin-bottom:8px}
.barras i{flex:1;max-width:26px;background:var(--ciano);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.barras i.nok{background:var(--vermelho)}
.ev small{color:var(--apagado);font-size:11px;display:block}
.vazio{text-align:center;color:var(--apagado);padding:40px 16px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;
  background:var(--painel2);border:1px solid var(--ciano);border-radius:9px;padding:11px 18px;
  font-size:13px;max-width:88vw;text-align:center;display:none}
</style>
</head>
<body>

<div class="topo">
  <div class="topo-l1">
    <div class="marca">GUIDED<span>TRAINING</span></div>
    <div class="nuvem" id="nuvem"><i class="led"></i><span id="nuvem-txt">verificando</span></div>
  </div>
  <div class="seletores">
    <select id="sel-aeronave"></select>
    <select id="sel-manobra"></select>
  </div>
</div>

<div class="tela on" id="tela-briefing"></div>
<div class="tela" id="tela-debrief"></div>
<div class="tela" id="tela-evolucao"></div>

<nav class="abas">
  <button class="on" data-t="briefing"><b>◈</b>BRIEFING</button>
  <button data-t="debrief"><b>✓</b>DEBRIEF</button>
  <button data-t="evolucao"><b>▤</b>EVOLUÇÃO</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   1. CONEXÃO COM O BANCO
   ---------------------------------------------------------------------
   Falamos direto com a API REST do Supabase (PostgREST) via fetch — sem
   biblioteca externa, para o app continuar sendo UM arquivo só.
   A chave abaixo é a PÚBLICA: pode ficar visível, ela só faz o que as
   regras da tabela permitirem.
   ===================================================================== */
const SUPA_URL  = 'https://pwtadrvycwrdzmdydxkz.supabase.co';
const SUPA_KEY  = 'sb_publishable_GApBo8b3LGJLMhjiDhvuZw_cp-onYXY';
const TABELA    = 'gt_debriefs';

const cabecalhos = {
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json'
};

let nuvemOk = null;   // null = ainda não sabemos

async function nuvemGravar(registro){
  const r = await fetch(SUPA_URL + '/rest/v1/' + TABELA, {
    method:'POST', headers:{...cabecalhos, 'Prefer':'return=representation'},
    body: JSON.stringify([registro])
  });
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0,160));
  return (await r.json())[0];
}

async function nuvemLer(){
  const r = await fetch(SUPA_URL + '/rest/v1/' + TABELA +
    '?select=*&order=data_voo.desc,criado_em.desc&limit=500', {headers:cabecalhos});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

/* ---------------------------------------------------------------------
   Guarda local (o app funciona sem internet; sincroniza quando dá).
   Tudo em try/catch: em algumas situações o navegador bloqueia o
   armazenamento e não queremos que o app quebre por causa disso.
   ------------------------------------------------------------------- */
const LS = {
  ler(chave, padrao){ try{ const v = localStorage.getItem(chave); return v ? JSON.parse(v) : padrao; }catch(e){ return padrao; } },
  gravar(chave, valor){ try{ localStorage.setItem(chave, JSON.stringify(valor)); }catch(e){} }
};

   Fonte: POH Cessna 172S / POH Cirrus SR22 P/N 13772-001 (3400 lb)
   Itens em "verificar" NÃO são de POH: são convenção de escola.

// Mostra só as velocidades que importam para a manobra escolhida.
function velocidadesRelevantes(m, p){
  const rot = {
    vso:'Vso — estol, flaps totais', vs1:'Vs1 — estol, limpo', vr:'Vr — rotação',
    vx:'Vx — melhor ângulo', vy:'Vy — melhor razão', vglide:'Vglide — melhor planeio',
    va:'Va — manobra', subida:'Subida em cruzeiro', aproximacao:'Aproximação normal',
    aproxCurta:'Aproximação curta', curvaEscarpada:'Entrada de curva escarpada',
    downwind:'Perna do vento', base:'Base', vooLento:'Voo lento (alvo)',
    vfe10:'Vfe 0→10°', vfe30:'Vfe 10→30°', vfe50:'Vfe 50%', vfe100:'Vfe 100%',
    vno:'Vno', vne:'Vne', vpd:'Vpd — máx. para CAPS'
  };
  const porManobra = {
    voo_reto_nivelado:['subida','va','vno'],
    curva_escarpada:['curvaEscarpada','va','vno'],
    subida_vel_constante:['vy','vx','subida'],
    descida_vel_constante:['subida','vno','va'],
    voo_lento:['vooLento','vs1','vso','vfe10','vfe30','vfe50','vfe100'],
    estol_sem_potencia:['aproximacao','vso','vs1','vglide'],
    estol_com_potencia:['vr','vx','vs1'],
    trafego_pouso:['downwind','base','aproximacao','aproxCurta','vso','vfe10','vfe30','vfe50','vfe100']
  };
  const chaves = (porManobra[m.id] || []).filter(k => p.v[k] !== undefined);
  return chaves.map(k=>`
    <div class="tol">
      <div class="lb"><b>${esc(rot[k]||k)}</b><small>${p.verificar.includes(k) ? '⚠ não é valor de POH — convenção, conferir' : esc(p.fonte)}</small></div>
      <div class="vl">${p.v[k]} kt</div>
    </div>`).join('');
}

function atualizarResumo(){
  const m = manobra();
  const vals = m.tolerancias.map(t => (respostas[t.id]||{}).status);
  const dentro = vals.filter(v=>v==='dentro').length;
  const fora   = vals.filter(v=>v==='fora').length;
  const avaliados = dentro + fora;
  $('d-dentro').textContent = dentro;
  $('d-fora').textContent   = fora;
  $('d-indice').textContent = avaliados ? Math.round(dentro/avaliados*100) : '—';
  $('d-salvar').disabled = avaliados === 0;
}

async function salvarDebrief(){
  const m = manobra(), p = perfil();

  const itens = m.tolerancias.map(t=>({
    id: t.id, label: t.label, tolerancia: t.texto, fonte: t.fonte,
    status: (respostas[t.id]||{}).status || 'na',
    desvio: (($('dv-'+t.id)||{}).value || '').trim() || null
  }));

  const dentro = itens.filter(i=>i.status==='dentro').length;
  const fora   = itens.filter(i=>i.status==='fora').length;
  const avaliados = dentro + fora;

  const registro = {
    data_voo: $('d-data').value || new Date().toISOString().slice(0,10),
    manobra_id: m.id, manobra_nome: m.nome, referencia_acs: m.acs,
    aeronave_id: p.id, aeronave_nome: p.nome,
    itens, total_itens: itens.length, itens_dentro: dentro, itens_fora: fora,
    indice: avaliados ? Math.round(dentro/avaliados*100) : 0,
    aprovado: fora === 0 && avaliados > 0,
    observacao: ($('d-obs').value||'').trim() || null,
    origem: 'autoavaliacao'
  };

  // 1) guarda local sempre — nunca perdemos o debrief por causa de rede
  const locais = LS.ler('gt2_locais', []);
  locais.push({ ...registro, _local_id: Date.now(), _sincronizado: false });
  LS.gravar('gt2_locais', locais);

  // 2) tenta a nuvem
  try{
    await nuvemGravar(registro);
    const l = LS.ler('gt2_locais', []);
    if(l.length) l[l.length-1]._sincronizado = true;
    LS.gravar('gt2_locais', l);
    marcarNuvem(true);
    toast('Debrief salvo no banco.');
  }catch(e){
    marcarNuvem(false);
    toast('Sem conexão com o banco — salvo no aparelho. Sincroniza depois.', 4200);
  }

  respostas = {};
  desenharDebrief();
  carregarEvolucao();
}

/* Reenvia o que ficou preso no aparelho quando a rede voltar. */
async function sincronizarPendentes(){
  const locais = LS.ler('gt2_locais', []);
  const pendentes = locais.filter(r=>!r._sincronizado);
  if(!pendentes.length) return 0;
  let n = 0;
  for(const r of pendentes){
    const { _local_id, _sincronizado, ...limpo } = r;
    try{ await nuvemGravar(limpo); r._sincronizado = true; n++; }catch(e){ break; }
  }
  LS.gravar('gt2_locais', locais);
  if(n) toast(n + ' debrief(s) pendente(s) enviado(s) ao banco.');
  return n;
}

/* =====================================================================
   7. MODO EVOLUÇÃO
   ===================================================================== */
async function carregarEvolucao(){
  const alvo = $('tela-evolucao');
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';

  let dados = [], origem = 'nuvem';
  try{
    await sincronizarPendentes();
    dados = await nuvemLer();
    marcarNuvem(true);
  }catch(e){
    marcarNuvem(false);
    dados = LS.ler('gt2_locais', []);
    origem = 'aparelho';
  }
  historico = dados;
  desenharEvolucao(dados, origem);
}

function desenharEvolucao(dados, origem){
  const porManobra = {};
  for(const d of dados){
    const k = d.manobra_id + '|' + d.aeronave_id;
    (porManobra[k] = porManobra[k] || []).push(d);
  }
  // mais antigo primeiro dentro de cada grupo
  Object.values(porManobra).forEach(g => g.sort((a,b)=>
    (a.data_voo+String(a.criado_em||'')).localeCompare(b.data_voo+String(b.criado_em||''))));

  const cartoes = [];

  // 1) manobras já treinadas
  for(const [k, g] of Object.entries(porManobra)){
    const ult = g[g.length-1];
    const ultimas3 = g.slice(-3);
    const consistente = ultimas3.length >= 3 && ultimas3.every(x=>x.aprovado);

    // qual item repete erro?
    const conta = {};
    for(const d of g) for(const i of (d.itens||[]))
      if(i.status==='fora'){ conta[i.label] = (conta[i.label]||0)+1; }
    const reincidentes = Object.entries(conta).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);

    const pill = consistente
      ? '<span class="pill bom">CONSISTENTE</span>'
      : reincidentes.length ? '<span class="pill rep">ERRO QUE REPETE</span>' : '';

    cartoes.push(`
      <div class="ev">
        <div class="ev-cab"><b>${esc(ult.manobra_nome)}</b>${pill}</div>
        <div class="barras">
          ${g.slice(-14).map(d=>`<i class="${d.aprovado?'':'nok'}" style="height:${Math.max(6, d.indice||0)}%" title="${esc(d.data_voo)} — ${d.indice}/100"></i>`).join('')}
        </div>
        <small>${esc(AERONAVES[ult.aeronave_id]?.nome || ult.aeronave_id)} · ${g.length} treino(s) · último em ${esc(ult.data_voo)} · índice ${ult.indice}</small>
        ${reincidentes.length ? `<small style="color:var(--vermelho);margin-top:6px">Repete: ${reincidentes.map(([l,n])=>esc(l)+' ('+n+'x)').join(', ')}</small>` : ''}
        ${ult.observacao ? `<small style="margin-top:6px;color:var(--texto);opacity:.8">"${esc(ult.observacao)}"</small>` : ''}
      </div>`);
  }

  // 2) manobras nunca treinadas
  const treinadas = new Set(dados.map(d=>d.manobra_id));
  const nunca = MANOBRAS.filter(m=>!treinadas.has(m.id));

  $('tela-evolucao').innerHTML = `
    ${origem === 'aparelho' ? '<div class="card"><div class="aviso-box">Sem conexão com o banco. Mostrando o que está guardado neste aparelho. Ao voltar a rede, os debriefs pendentes são enviados sozinhos.</div></div>' : ''}
    ${cartoes.length ? cartoes.join('') : '<div class="vazio">Nenhum debrief ainda.<br><br>Voe uma manobra, volte aqui na aba DEBRIEF e registre. A evolução aparece a partir do segundo treino.</div>'}
    ${nunca.length ? `
      <div class="ev">
        <div class="ev-cab"><b>Nunca treinadas</b><span class="pill novo">${nunca.length}</span></div>
        ${nunca.map(m=>`<small>· ${esc(m.nome)}</small>`).join('')}
      </div>` : ''}
    ${dados.length ? `<button class="btn" id="ev-exportar">Exportar histórico (JSON)</button>` : ''}`;

  const btn = $('ev-exportar');
  if(btn) btn.onclick = () => {
    const blob = new Blob([JSON.stringify(historico,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'guided-training-historico.json';
    a.click();
  };
}

/* =====================================================================
   8. Estado da nuvem e arranque
   ===================================================================== */
function marcarNuvem(ok){
  nuvemOk = ok;
  const n = $('nuvem');
  n.className = 'nuvem ' + (ok ? 'ok' : 'off');
  $('nuvem-txt').textContent = ok ? 'banco ok' : 'offline';
}

function desenharTudo(){ desenharBriefing(); desenharDebrief(); }

desenharTudo();

// testa a conexão sem travar a tela
(async () => {
  try{ await nuvemLer(); marcarNuvem(true); await sincronizarPendentes(); }
  catch(e){ marcarNuvem(false); }
})();
</script>
